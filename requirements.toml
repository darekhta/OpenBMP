[[requirements]]
id = "REQ-COMM-005"
title = "The communications bridge supports declared pass-plan handover"
statement = "The schema-v3 [comm] surface accepts bridge_link_selection = \"declared_plan\" and non-overlapping [[comm.bridge_pass_plan]] windows keyed by declared comm link id, with finite non-negative start_s and finite end_s greater than start_s. It also accepts [[comm.relays]] declared GEO relay nodes with relay-to-ground budget constants and FER decks, plus [[comm.links]].relay_id references that compose vehicle-to-relay and relay-to-ground budgets into a two-hop LinkState using bottleneck margin and combined independent-hop FER. The parser validates unknown link ids, unknown relay ids, missing declared-plan windows, invalid times, overlapping windows, and invalid relay geometry or budget fields fail-closed. The runner stores the latest comm observation time, selects the active declared link for FC bridge sensor and command frames when the current time is inside a pass-plan window, keeps comm effects active with deterministic no-link packet drops during declared-plan schedule gaps instead of silently bypassing the [fc.transport] comm seam, resolves relay deck files, reports relay evidence in RunOutcome.comm.links[*].relay, and evaluates relay links through the composed two-hop state. RunOutcome.comm.bridge_selections reports contiguous bridge link/gap selection intervals with step/time span, sample count, and sensor/command drop or bit-flip counts, RunOutcome.comm.bridge_handovers reports explicit link/gap transition events with from/to identities and transition step/time, and RunOutcome.comm.link_passes reports sampled visible/non-blackout link passes with step/time span, duration, sample count, min/max/mean margin, sampled margin profile, and bridge packet drop or bit-flip counts attributed to each pass. This is a WP-20.6 partial implementation only: richer relay scheduling and continuous/interpolated pass-profile artifacts remain open."

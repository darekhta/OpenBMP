schema_version = 1

[[requirements]]
id = "REQ-MULTIBODY-001"
title = "The multibody substrate exposes deterministic spatial-vector primitives"
statement = "The workspace contains an openbmp-multibody L2 crate registered in the workspace that depends only on lower L0/L1 crates plus nalgebra, exposes angular-over-linear SpatialMotion and moment-over-force SpatialForce vectors, force-dual motion cross products, Pluecker parent-to-child transforms with power-dual force mapping, SpatialInertia construction from validated MassProperties, the WP-01.1 joint vocabulary and topologically ordered MultibodyTree/MultibodyState shape with deterministic q/qd offsets and fail-closed topology/state validation, while making no claim that simulator integration, scenario wiring, or external Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-001"]

[[requirements]]
id = "REQ-MULTIBODY-002"
title = "The multibody substrate cross-checks fixed-transform CRBA against RNEA columns"
statement = "The openbmp-multibody crate exposes a fixed-transform composite-rigid-body joint-space inertia substrate and a zero-velocity fixed-transform Recursive Newton-Euler inverse-dynamics substrate that share the same q-independent joint subspaces and deterministic tree order, validate generalized acceleration dimensions and finiteness fail-closed, prove a single free-flyer root returns the root spatial inertia block, and prove CRBA columns match RNEA generalized forces on a small tree while making no claim that simulator integration, scenario wiring, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-002"]

[[requirements]]
id = "REQ-MULTIBODY-003"
title = "The multibody substrate applies q-dependent joint transforms"
statement = "The openbmp-multibody crate exposes q-dependent Joint::joint_transform evaluation, PluckerTransform composition, state-dependent body transforms, and state-dependent no-bias CRBA/RNEA substrates that validate generalized state dimensions, finiteness, body indices, quaternion length, and quaternion norm fail-closed, and prove transform composition plus CRBA column consistency against zero-velocity RNEA at a nontrivial generalized state while making no claim that simulator integration, scenario wiring, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-003"]

[[requirements]]
id = "REQ-MULTIBODY-004"
title = "The multibody substrate evaluates biased and forced RNEA"
statement = "The openbmp-multibody crate exposes inverse_dynamics_rnea_at_state for q-dependent Recursive Newton-Euler inverse dynamics with generalized velocity-bias terms, a virtual-root parent acceleration seed suitable for gravity, and per-body external spatial forces expressed in body frames, validates qd/qdd dimensions, body-transform counts, root acceleration finiteness, and external-force dimensions/finiteness fail-closed, proves the zero-velocity zero-force path matches the no-bias CRBA substrate, proves a single free-flyer velocity-bias force analytically, and proves root acceleration plus external-force subtraction on a single-root tree while making no claim that simulator integration, scenario wiring, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-004"]

[[requirements]]
id = "REQ-MULTIBODY-005"
title = "The multibody substrate solves dense forward dynamics"
statement = "The openbmp-multibody crate exposes forward_dynamics_dense_at_state as a deterministic dense forward-dynamics substrate that forms H(q) with the state-dependent CRBA path, forms C(q, qd, a_root, f_ext) through the biased/forced RNEA path at zero qdd, solves H(q) qdd = tau - C with a finite checked Gaussian-elimination solver, validates generalized-force dimensions and finiteness fail-closed, rejects singular/ill-conditioned joint-space inertia systems fail-closed, and proves a biased RNEA round trip on a nontrivial tree while making no claim that simulator integration, scenario wiring, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-005"]

[[requirements]]
id = "REQ-MULTIBODY-006"
title = "The multibody substrate advances generalized state vectors deterministically"
statement = "The openbmp-multibody crate exposes MultibodyDerivative and tree-owned generalized-state integration helpers that validate derivative dimensions and finiteness fail-closed, scale and add derivative vectors without panic-prone dynamic-vector arithmetic, advance q/qd in locked component order, project free-flyer and spherical quaternion coordinate slices using tree topology, compute scalar state size and weighted adaptive-error norms in the same locked order, and prove derivative arithmetic, state advance/projection, spherical projection, scalar norm, weighted error norm, and invalid tolerance handling while making no claim that kernel/runner force adapter wiring, runner-level byte-equivalence, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-006"]

[[requirements]]
id = "REQ-MULTIBODY-007"
title = "The multibody substrate evaluates articulated-body forward dynamics"
statement = "The openbmp-multibody crate exposes forward_dynamics_aba_at_state as an O(n) articulated-body forward-dynamics substrate over q-dependent transforms, generalized velocity-bias terms, a virtual-root parent acceleration seed, and per-body external spatial forces, solves each local articulated joint block including the free-flyer root with a fixed-order symmetric LDLT factorization, validates generalized-force, root-acceleration, and external-force inputs fail-closed, rejects singular local articulated inertia blocks fail-closed, and proves agreement with the dense forward-dynamics bridge plus biased RNEA round-trip on a moving nontrivial tree while making no claim that kernel/runner force adapter wiring, runner-level byte-equivalence, scenario wiring, double-pendulum tolerance tables, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-007"]

[[requirements]]
id = "REQ-MULTIBODY-008"
title = "The multibody substrate lifts velocities into state derivatives"
statement = "The openbmp-multibody crate exposes coordinate_derivative_from_velocity and derivative_from_state_and_acceleration as adapter-facing kinematic lift helpers that validate generalized state and acceleration dimensions fail-closed, map scalar joint velocities directly, lift free-flyer and spherical body-frame angular rates into quaternion coordinate derivatives with the existing rigid-body quaternion convention, convert free-flyer body-frame linear velocity into parent-frame translation derivatives, and prove scalar-joint, free-flyer, spherical, qdd-pairing, and bad-acceleration handling while making no claim that kernel/runner force adapter wiring, runner-level byte-equivalence, scenario wiring, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-008"]

[[requirements]]
id = "REQ-MULTIBODY-009"
title = "The multibody substrate adapts vector-backed states to the generic integrator traits"
statement = "The workspace relaxes openbmp-models VehicleState and SimStateDerivative bounds from Copy to Clone, updates the RK4, DOPRI5, and DOPRI8 generic integrator ownership paths and vehicle aggregate model context forwarding to clone reused states, derivatives, and borrowed contexts explicitly without changing locked evaluation order, and exposes MultibodySimState as a topology-aware openbmp-models SimState adapter carrying tree-derived quaternion projection offsets for vector-backed multibody states. The openbmp-multibody tests prove trait implementation, q/qd advance, weighted-error evaluation, free-flyer and spherical quaternion projection, retiming, and bad projection metadata rejection while making no claim that kernel/runner force adapter wiring, runner-level byte-equivalence, scenario wiring, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-009"]

[[requirements]]
id = "REQ-MULTIBODY-010"
title = "The multibody substrate turns ABA loads into simulator derivatives"
statement = "The openbmp-multibody crate exposes derivative_from_forward_dynamics as a kernel-facing bridge that evaluates ABA forward dynamics from locked-order generalized loads, root-parent acceleration, and per-body external spatial forces, then lifts the resulting generalized accelerations into MultibodyDerivative with the same state-dependent q_dot convention used by the generic integrators. The openbmp-multibody tests prove the one-body free-flyer, zero-CG-offset, identity-orientation, zero-translational-velocity derivative is byte-identical to the existing rigid-body derivative equations for translational velocity, acceleration, quaternion rate, and angular acceleration while making no claim that runner-level force adapter wiring, runner-level byte-equivalence, scenario wiring, double-pendulum tolerance tables, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-010"]

[[requirements]]
id = "REQ-MULTIBODY-011"
title = "The multibody substrate maps root free-flyer loads into generalized forces"
statement = "The openbmp-multibody crate exposes root_free_flyer_generalized_forces_from_loads and derivative_from_root_free_flyer_loads as runner-facing helpers that map a body-frame root moment plus parent-frame root force into the free-flyer generalized-force slots in locked moment-then-force order, rotate parent-frame force through the root quaternion, leave non-root joint force slots at zero, and feed the result through the ABA derivative bridge. The openbmp-multibody tests prove force rotation, root slot order, non-root zero fill, and the single-free-flyer rigid-derivative equivalence through the load-adapter path while making no claim that full runner integration, scenario opt-in, double-pendulum tolerance tables, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-011"]

[[requirements]]
id = "REQ-MULTIBODY-012"
title = "The rigid runner seeds a root free-flyer multibody state"
statement = "The openbmp-runner crate depends on openbmp-multibody and exposes a runner-side root-free-flyer seed bridge that constructs a one-body MultibodyTree plus MultibodySimState from the existing RigidBodyState seed for multi_body scenarios that declare a primary_body_id, preserving the body id, quaternion wxyz order, inertial position, body-frame angular velocity, and ECI velocity rotated into body-frame free-flyer linear qd slots. The runner tests prove deterministic q/qd mapping, quaternion projection offsets, body-frame velocity rotation, and fail-closed invalid mass properties while making no claim that the rigid kernel has been replaced by a multibody kernel, that full force/environment adapter wiring is complete, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-012"]

[[requirements]]
id = "REQ-MULTIBODY-013"
title = "The rigid runner bridges root free-flyer loads into multibody derivatives"
statement = "The openbmp-runner crate exposes a runner-side root-free-flyer derivative bridge that feeds body-frame moments and ECI-frame forces through the openbmp-multibody root load adapter, allocates one zero external spatial-force slot per tree body, and validates the zero-load derivative path during primary multi_body scenario setup without mutating current rigid-kernel behavior. The runner tests prove identity-orientation, zero-CG-offset no-joint equivalence against the current RigidBodyDerivative force, moment, quaternion-rate, and acceleration equations, plus fail-closed non-finite load handling, while making no claim that the rigid kernel has been replaced by a multibody kernel, that full environment/force adapter wiring is complete, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-013"]

[[requirements]]
id = "REQ-MULTIBODY-014"
title = "The rigid runner exercises the primary multibody bridge from scenario setup"
statement = "The openbmp-runner crate carries a scenario-level byte-equivalence regression that runs the existing rigid-body kernel with and without a disabled primary multi_body block, thereby exercising the root free-flyer seed and zero-load derivative validation path through real Scenario parsing and RigidBodySession preparation while proving that the current rigid-kernel telemetry remains byte-identical when the multibody controller is inactive. The runner test proves schema channel count and CSV telemetry byte equivalence for the disabled primary bridge path while making no claim that the rigid kernel has been replaced by a multibody kernel, that full environment/force adapter wiring is complete, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-014"]

[[requirements]]
id = "REQ-MULTIBODY-015"
title = "The rigid runner validates primary multibody derivatives through live force and moment adapters"
statement = "The openbmp-runner primary root-free-flyer bridge builds its multibody seed from the primary body's mounted mass resources, not the pre-split composite mass, and validates the initial multibody derivative by evaluating the runner's actual rigid force and moment adapter stacks with the initial environment, effector, engine, tank, and recovery snapshots before handing the same models to the current rigid kernel. The runner tests prove primary-body mass selection for initial multi_body lanes and prove nonzero gravity plus direct-torque adapter loads flow through the multibody derivative bridge with the expected linear and angular acceleration slots while making no claim that the rigid kernel has been replaced by a multibody kernel, that full per-step multibody propagation is complete, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-015"]

[[requirements]]
id = "REQ-MULTIBODY-016"
title = "The rigid runner mirrors primary multibody derivatives before each step"
statement = "The openbmp-runner prepared rigid-body session maintains a primary root-free-flyer multibody shadow for primary multi_body scenarios, refreshes that shadow from the current rigid state plus active primary-body mass resources before each authoritative rigid-kernel step, evaluates the runner's current force and moment adapter stacks with the held effector, engine, tank, recovery, environment, wind, and mission-phase views, and records the resulting multibody derivative without changing the rigid kernel's propagation or telemetry authority. The runner test drives two real RigidBodySession::step_once calls and proves the per-step shadow refresh observes nonzero gravity plus direct-torque adapter loads at the expected pre-step times while making no claim that the rigid kernel has been replaced by a multibody kernel, that separated-body multibody propagation is complete, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-016"]

[[requirements]]
id = "REQ-MULTIBODY-017"
title = "The primary multibody shadow exercises gimballed engine loads"
statement = "The openbmp-runner primary root-free-flyer shadow is covered by a session-stepped synthetic gimballed-engine scenario that fires a real scenario_script engine_command, lets the runner apply the command through EngineRack, publishes the resulting engine snapshot to the kernel-held adapter views, and proves the multibody shadow derivative sees nonzero engine-cluster force and moment contributions from a mounted, pitch-gimballed liquid engine. The runner test proves the second pre-step shadow derivative carries signed angular and linear acceleration slots from off-axis axial thrust plus lateral gimbal thrust while making no claim that the rigid kernel has been replaced by a multibody kernel, that a full gimballed ascent has been validated, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-017"]

[[requirements]]
id = "REQ-MULTIBODY-018"
title = "The runner mirrors separated lanes through multibody shadows"
statement = "The openbmp-runner prepared rigid-body session maintains root-free-flyer multibody shadows for currently propagating separated lanes in multi_body scenarios, refreshes each shadow from the separated lane's current rigid state before the authoritative rigid-kernel step, refreshes immediately after jettison events create new separated lanes, evaluates the runner's per-body force and moment adapter stacks with the lane body id, held rack snapshots, lane environment sample, wind, and mission-phase views, and records the resulting multibody derivative without changing rigid separated-lane propagation or telemetry authority. The runner tests use an initial multi_body lane and a jettison-created lane with a booster-owned direct-torque effector and prove the separated shadow derivative sees the signed pitch-torque contribution while the direct-torque-only translational slots remain zero, making no claim that welded-to-free joint-release propagation, full separated-body multibody propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-018"]

[[requirements]]
id = "REQ-MULTIBODY-019"
title = "The primary multibody shadow can forecast a constant-mass root step"
statement = "The openbmp-runner root-free-flyer bridge can project a one-body MultibodySimState back into the existing RigidBodyState shape and records an RK4 primary-shadow forecast by evaluating the runner's force and moment adapters at multibody RK stages before the authoritative rigid-kernel step. The multibody free-flyer quaternion convention is parent-from-child for the stored quaternion while Plucker transforms still receive child-from-parent matrices, quaternion-rate lifting uses raw finite nonzero RK substep quaternions before projection, free-flyer body velocity lifts into parent-frame position rate, parent-frame root forces rotate into the body generalized-force slots, and the runner bridge integrates root translation in the rigid kernel's ECI velocity coordinates while using multibody stage derivatives for attitude. The tests prove projection round-trips position, velocity, quaternion, and body angular rate, prove a constant-mass no-rotation gravity-only primary multi_body scenario forecasts the same next rigid state as the current RK4 rigid kernel, and prove a constant-mass direct-torque/changing-attitude scenario forecasts the same next rigid state as the current rigid kernel without changing telemetry authority. This makes no claim that replacing the rigid-kernel propagation path, variable-mass propagation, gimballed ascent propagation, welded-to-free joint-release propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-019"]

[[requirements]]
id = "REQ-MULTIBODY-020"
title = "The primary multibody shadow can forecast a variable-mass root step"
statement = "The openbmp-runner root-free-flyer RK4 forecast evaluates the same RigidMassModel mass-property-rate surface as the current rigid kernel at each stage, carries mass rate, center-of-mass rate, and inertia-rate fields into RigidBodyDerivative, and applies the rigid kernel's inertia-rate angular correction before rebuilding the next one-body root-free-flyer seed. The runner test proves a no-rotation solid-motor primary multi_body scenario forecasts the same next mass, position, velocity, quaternion, and body angular rate as the current rigid kernel over one step while leaving telemetry authority with the rigid kernel. This makes no claim that replacing the rigid-kernel propagation path, liquid-engine snapshot-timing equivalence, full gimballed ascent propagation, welded-to-free joint-release propagation, broad articulated variable-mass propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-020"]

[[requirements]]
id = "REQ-MULTIBODY-021"
title = "Separated multibody shadows can forecast an active lane step"
statement = "The openbmp-runner separated-lane multibody shadow path records an RK4 root-free-flyer forecast for each currently propagating separated rigid-body lane by evaluating the same runner force, moment, mass-rate, held rack snapshot, mission-phase, and environment sampling surfaces used by the primary shadow forecast. The runner test proves an initial separated direct-torque lane forecasts the same next mass, position, velocity, quaternion, and body angular rate as that lane's current rigid-kernel propagation over one step while leaving separated-lane telemetry authority with the rigid kernel. This makes no claim that replacing separated-lane propagation, welded-to-free joint-release propagation, liquid-engine snapshot-timing equivalence, broad articulated separated-body propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-021"]

[[requirements]]
id = "REQ-MULTIBODY-022"
title = "The primary multibody shadow can forecast a gimballed liquid-engine step"
statement = "The openbmp-runner primary root-free-flyer shadow seeds single-body active stacks from the kernel's authoritative current mass properties before forecasting, avoiding double-counting liquid-engine snapshots whose consumed mass has already been advanced by the runner rack for the current tick. The runner test fires a real scenario_script engine_command, publishes a pitch-gimballed liquid-engine snapshot through the runner/kernel adapter views, and proves the RK4 primary-shadow forecast matches the current rigid kernel's next mass, position, velocity, quaternion, and body angular rate over one powered gimballed step while leaving telemetry authority with the rigid kernel. This makes no claim that replacing the rigid-kernel propagation path, vehicle-scale gimballed ascent validation, articulated gimbal-joint inertia coupling, welded-to-free joint-release propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-022"]

[[requirements]]
id = "REQ-MULTIBODY-023"
title = "The primary multibody shadow validates consecutive powered gimballed forecast ticks"
statement = "The openbmp-runner primary root-free-flyer shadow is covered by a session-stepped synthetic gimballed liquid-engine ascent that compares the stored RK4 primary-shadow forecast against the authoritative rigid-kernel state on two consecutive powered ticks after scenario_script ignition. The runner test proves next-step mass, position, velocity, quaternion, and body angular rate match the current rigid kernel on both powered ticks while leaving telemetry authority with the rigid kernel. This makes no claim that replacing the rigid-kernel propagation path, vehicle-scale gimballed ascent validation, articulated gimbal-joint inertia coupling, welded-to-free joint-release propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-023"]

[[requirements]]
id = "REQ-MULTIBODY-024"
title = "Separated multibody shadows can forecast a jettison-created lane step"
statement = "The openbmp-runner separated-lane multibody shadow path is covered after a scenario_script jettison event creates a new propagating separated rigid-body lane. The runner test copies the RK4 separated-shadow forecast recorded immediately after the jettison-created booster lane is mirrored, advances the authoritative rigid separated-lane kernel one tick, and proves the forecasted next mass, position, velocity, quaternion, and body angular rate match the current separated-lane state while preserving rigid-kernel telemetry authority. This makes no claim that replacing separated-lane propagation, full momentum-conserving multibody joint-release propagation, broad articulated separated-body propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-024"]

[[requirements]]
id = "REQ-MULTIBODY-025"
title = "Separated multibody shadows can forecast a variable-mass powered lane step"
statement = "The openbmp-runner separated-lane multibody shadow path is covered for a powered variable-mass separated lane whose body-owned liquid engine is commanded by the multi_body landing controller. The runner test proves the RK4 separated-shadow forecast drains mass through the owner-filtered engine mass-rate adapter and matches the authoritative rigid separated-lane kernel's next mass, position, velocity, quaternion, and body angular rate over the powered tick while preserving rigid-kernel telemetry authority. This makes no claim that replacing separated-lane propagation, broad articulated variable-mass propagation, full momentum-conserving multibody joint-release propagation, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-025"]

[[requirements]]
id = "REQ-MULTIBODY-026"
title = "The multibody ABA substrate is backed by a checked tolerance-table fixture"
statement = "The openbmp-multibody crate ships a checked TOML tolerance fixture for the moving free-flyer/revolute/prismatic sample chain, parses its generalized state, generalized forces, root acceleration, per-body external forces, and strict maximum-absolute-error thresholds in a crate test, and proves forward_dynamics_aba_at_state matches the dense forward-dynamics bridge and recovers the input generalized forces through biased RNEA within the fixture tolerances. This makes no claim that Spatial_v2 oracle validation, scenario wiring, runner-level byte-equivalence, or replacing rigid-kernel propagation are complete."
verification = ["V-MULTIBODY-026"]

[[requirements]]
id = "REQ-MULTIBODY-027"
title = "The multibody substrate can hand off an unreleased welded subtree as a free flyer"
statement = "The openbmp-multibody crate exposes release_welded_subtree_as_free_flyer for an unreleased non-root welded body, remapping the selected subtree into a new deterministic MultibodyTree whose released body is a free-flyer root, whose descendants keep their original joint coordinates and velocities, and whose released root state preserves the selected body's parent-frame pose plus body-frame spatial velocity at the release instant. The crate tests prove pose, velocity, descendant state, and fail-closed root/non-welded rejection on a synthetic welded stack with a descendant revolute joint. This makes no claim that runner-side jettison has been replaced, full momentum-conserving separated-lane multibody propagation is complete, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-027"]

[[requirements]]
id = "REQ-MULTIBODY-028"
title = "The multibody substrate exposes checked energy and generalized momentum"
statement = "The openbmp-multibody crate exposes generalized_momentum_at_state and kinetic_energy_at_state, evaluating p = H(q) qd in locked generalized-velocity order and scalar kinetic energy from the state-dependent CRBA matrix. A checked TOML fixture backs a planar point-mass double-pendulum regression with a zero-velocity free-flyer root, analytic total kinetic energy, and analytic revolute generalized momenta under strict absolute tolerances. This makes no claim that Spatial_v2 oracle validation, runner-level propagation replacement, articulated gimbal-joint inertia coupling, or full-duration vehicle-scale gimballed ascent validation is complete."
verification = ["V-MULTIBODY-028"]

[[requirements]]
id = "REQ-MULTIBODY-029"
title = "The primary multibody shadow validates a vehicle-scale TVC ascent probe"
statement = "The openbmp-runner primary root-free-flyer multibody shadow is covered on the Phalcon-9 TVC probe scenario with a nine-engine gimballed liquid-engine cluster, real FC guidance/autopilot/engine-rack surfaces, an accelerated pitch schedule, and a dormant multi_body attitude-target hook used only to enable the shadow. The runner test advances 150 real RigidBodySession ticks, proves each recorded primary-shadow RK4 forecast matches the authoritative rigid state on that tick, and proves the vehicle-scale engine snapshots applied nonzero lateral gimballed thrust. This makes no claim that the rigid-kernel propagation path has been replaced, full-duration orbital-ascent validation is complete, articulated gimbal-joint inertia coupling is modeled, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-029"]

[[requirements]]
id = "REQ-MULTIBODY-030"
title = "The primary multibody shadow validates the full Phalcon-9 TVC probe"
statement = "The openbmp-runner primary root-free-flyer multibody shadow is covered over the full 40 s Phalcon-9 TVC probe scenario, preserving the scenario's original pitch schedule while adding only a dormant multi_body attitude-target hook to enable the shadow. The runner test advances all 4000 RigidBodySession ticks to completion, proves each recorded primary-shadow RK4 forecast matches the authoritative rigid state at every tick, and proves the nine-engine vehicle-scale TVC stack applies nonzero lateral gimballed thrust over the full run. This makes no claim that the rigid-kernel propagation path has been replaced, full orbital-ascent validation is complete, articulated gimbal-joint inertia coupling is modeled, or Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-030"]

[[requirements]]
id = "REQ-MULTIBODY-031"
title = "The multibody substrate validates articulated gimbal inertia coupling"
statement = "The openbmp-multibody crate is covered by a free-flyer airframe plus offset inertial engine on a revolute gimbal regression that proves the state-dependent CRBA matrix carries nonzero off-diagonal coupling between the gimbal axis and root angular/linear slots, applies a gimbal generalized torque that drives both root reaction acceleration and gimbal-axis acceleration, and cross-checks the result through ABA versus dense forward dynamics plus biased RNEA round-trip. This makes no claim that runner-side gimbal shadows are authoritative, that the rigid-kernel propagation path has been replaced, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-031"]

[[requirements]]
id = "REQ-MULTIBODY-032"
title = "The runner materializes scenario-declared articulated gimbal joints"
statement = "Schema-v3 [multi_body] scenarios can declare [[multi_body.gimbal_joint]] entries that bind an owned liquid-engine id to its parent assembly body, a finite nonzero revolute axis, a parent-frame pivot, declared engine inertial mass properties, a finite child-frame thrust application point, a finite nonzero neutral thrust direction not parallel to the revolute axis, and initial joint state. The scenario parser validates finite/positive mass-property fields, rejects unknown body or engine references, rejects duplicate engine gimbal declarations, and rejects engine/body ownership mismatches; the rigid runner materializes each declaration during session preparation as a root free-flyer plus revolute engine MultibodyTree seeded from live parent body mass resources and validates its state-dependent CRBA inertia matrix. This makes no claim that the articulated gimbal tree has replaced the current rigid-kernel propagation path, that commanded gimbal joint-state handoff is authoritative, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-032"]

[[requirements]]
id = "REQ-MULTIBODY-033"
title = "Articulated gimbal shadows consume live engine thrust snapshots"
statement = "For each scenario-declared [[multi_body.gimbal_joint]], the prepared rigid-body session keeps a non-authoritative articulated gimbal shadow, refreshes the parent root state from the current rigid state and parent-body mass resources before each rigid tick, maps the live EngineSnapshot::thrust_body vector into the revolute child frame, applies it as a child-body external spatial force and moment at the finite thrust_application_body_m point, and records the ABA derivative. The regression fires a real scenario_script engine_command through EngineRack and proves the powered engine snapshot drives both root acceleration and revolute gimbal-axis acceleration through the articulated tree. This makes no claim that the rigid kernel has been replaced by articulated propagation, that the joint coordinate is commanded by the flight-control gimbal command, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-033"]

[[requirements]]
id = "REQ-MULTIBODY-034"
title = "Articulated gimbal shadows derive live one-axis joint state"
statement = "For each powered scenario-declared [[multi_body.gimbal_joint]], the rigid runner derives the non-authoritative revolute coordinate from the live EngineSnapshot::thrust_body direction by projecting the declared neutral_thrust_body and thrust direction into the plane normal to axis_body, using the multibody child-from-parent sign convention, and carries a finite-difference revolute rate into the shadow seed before evaluating ABA. The regression fires a real scenario_script engine_command with a one-axis pitch command and proves the powered articulated shadow state q and qd slots update from the live thrust direction before the derivative is recorded. This makes no claim that the articulated shadow is authoritative or that the rigid propagation path has been replaced."
verification = ["V-MULTIBODY-034"]

[[requirements]]
id = "REQ-MULTIBODY-035"
title = "Articulated gimbal shadows accept two-axis pitch/yaw state"
statement = "Scenario-declared [[multi_body.gimbal_joint]] entries can include an optional secondary_axis_body for non-authoritative two-axis articulated gimbal shadows. The parser validates finite nonzero secondary axes, requires axis_body, secondary_axis_body, and neutral_thrust_body to be mutually orthogonal, and requires secondary_axis_body to align with axis_body x neutral_thrust_body; the rigid runner materializes a massless intermediate secondary-axis gimbal frame plus a primary-axis engine body, derives secondary and primary child-from-parent coordinates/rates from the live EngineSnapshot::thrust_body pitch/yaw direction, and records an ABA derivative over the two-axis tree. The regression fires a real scenario_script engine_command with nonzero pitch and yaw and proves the shadow tree q/qd dimensions, body ordering, joint coordinate/rate handoff, and powered root plus two-axis gimbal accelerations. This makes no claim that the articulated shadow is authoritative, that two-axis propagation has replaced the rigid kernel, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-035"]

[[requirements]]
id = "REQ-MULTIBODY-036"
title = "Articulated gimbal shadows record an RK4 forecast"
statement = "Prepared rigid-body sessions record a non-authoritative one-step RK4 forecast for each scenario-declared articulated gimbal shadow by advancing the articulated MultibodySimState with held EngineSnapshot thrust and the same stage child-frame thrust mapping used by the recorded ABA derivative. The regression uses a two-axis pitch/yaw gimbal scenario and proves the forecast preserves tree q/qd dimensions, advances exactly one session step, and changes the articulated gimbal coordinates and rates under powered held thrust. This makes no claim that the articulated forecast is authoritative, that two-axis propagation has replaced the rigid kernel, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-036"]

[[requirements]]
id = "REQ-MULTIBODY-037"
title = "Articulated gimbal forecasts project a root rigid state"
statement = "Prepared rigid-body sessions project each non-authoritative articulated gimbal RK4 forecast's root free-flyer slots back into the existing RigidBodyState shape using the parent mass properties that seeded the articulated tree. The regression uses the powered two-axis pitch/yaw gimbal scenario and proves the projected root forecast advances exactly one session step, preserves parent mass, and carries nonzero translational and angular response from held live articulated thrust. This makes no claim that the projected root forecast is authoritative, that it has replaced the rigid kernel's propagated state, or that Spatial_v2 oracle validation is complete."
verification = ["V-MULTIBODY-037"]

[[requirements]]
id = "REQ-MULTIBODY-038"
title = "The multibody substrate ingests Spatial_v2-compatible ABA oracle fixtures"
statement = "The openbmp-multibody crate ingests a provenance-bearing TOML fixture matrix shaped for offline Spatial_v2 ABA qdd exports, validates source metadata and q/qd/generalized-force/root-acceleration/external-force dimensions for three deterministic free-flyer/revolute/prismatic sample-tree cases, computes ABA forward dynamics, and compares each resulting generalized acceleration vector against checked static expected_qdd values at <= 1e-12. The checked-in matrix is explicitly labeled self-consistency and therefore makes no claim that an independent Featherstone Spatial_v2 run or the required three-tree external oracle matrix is complete."
verification = ["V-MULTIBODY-038"]

[[requirements]]
id = "REQ-MULTIBODY-039"
title = "The rigid runner can hand primary root authority to the multibody forecast"
statement = "Schema-v3 [multi_body] scenarios accept propagation_authority = \"primary_root_free_flyer\" as an explicit guarded mode that requires primary_body_id and rejects simultaneous initial lanes, separation declarations, landing controllers, and articulated gimbal joints. In that mode, the rigid runner validates and records the usual primary root-free-flyer multibody RK4 forecast, advances the existing rigid kernel tick to preserve event and stop machinery, replaces the current primary RigidBodyState with the same-tick root-free-flyer multibody forecast through a validity-checked kernel handoff API, and records the applied authoritative handoff on the shadow. This makes no claim that separated-lane authority, articulated gimbal authority, or full rigid-kernel removal is complete."
verification = ["V-MULTIBODY-039"]

[[requirements]]
id = "REQ-MULTIBODY-040"
title = "The rigid runner can hand separated-lane authority to multibody forecasts"
statement = "Schema-v3 [multi_body] scenarios accept propagation_authority = \"separated_root_free_flyer\" as an explicit separated-lane handoff mode that requires an initial lane or separation declaration and rejects articulated gimbal joints. In that mode, the rigid runner records the existing pre-step root-free-flyer multibody RK4 forecast for each active separated lane, advances the existing rigid kernel tick to preserve event, stop, jettison, and lane-retirement machinery, replaces each already-active separated lane with its same-tick forecast through a validity-checked kernel handoff API that refreshes rigid event caches, and records the applied authoritative handoff on the separated shadow. The regressions cover an initially separated lane and a jettison-created lane after a pre-step forecast exists. This makes no claim that articulated gimbal authority, momentum-conserving tree release, or full rigid-kernel removal is complete."
verification = ["V-MULTIBODY-040"]

[[requirements]]
id = "REQ-MULTIBODY-041"
title = "The rigid runner can hand single-gimbal root authority to an articulated forecast"
statement = "Schema-v3 [multi_body] scenarios accept propagation_authority = \"articulated_gimbal_root\" as an explicit single-gimbal root-state handoff mode that requires primary_body_id and exactly one articulated gimbal joint whose body_id matches the primary body, while rejecting initial lanes, separation declarations, landing controllers, and multiple gimbal joints. In that mode, the rigid runner records the existing one-axis or two-axis articulated gimbal RK4 forecast, advances the existing rigid kernel tick to preserve event and stop machinery, replaces the current primary RigidBodyState with the projected root state from the same-tick articulated forecast through the validity-checked kernel handoff API, and records the applied root handoff on the articulated shadow. This makes no claim that internal gimbal coordinates are authoritative, that multiple gimbals are supported, or that full rigid-kernel removal is complete."
verification = ["V-MULTIBODY-041"]

[[requirements]]
id = "REQ-MULTIBODY-042"
title = "Single-gimbal authority carries articulated internal forecast state"
statement = "After a schema-v3 propagation_authority = \"articulated_gimbal_root\" scenario has applied its first authoritative root handoff, the rigid runner's next pre-step articulated gimbal mirror uses the prior same-time articulated RK4 forecast as the source of joint coordinates and rates, rebuilds the articulated seed with the current authoritative rigid root state and current parent mass properties, and then forecasts the next tick from that carried internal state. The regression captures a powered two-axis gimbal forecast, advances another authoritative tick, and proves the next seed carries the prior forecast's internal joint coordinates and rates while its root projection matches the prior authoritative root state. This remains limited to the existing single declared gimbal mode and makes no claim that multiple gimbals, actuator lag dynamics, or full rigid-kernel removal is complete."
verification = ["V-MULTIBODY-042"]

[[requirements]]
id = "REQ-MULTIBODY-043"
title = "The sim kernel can install externally computed separation states"
statement = "The openbmp-sim rigid-body kernel exposes RigidBodySeparationStates and jettison_rigid_body_with_states as an explicit post-separation state installation seam for future momentum-continuing welded-to-free release runners. The API validates separated-body force, moment, and mass model support, rejects same-body splits, active-primary mismatches, duplicate departed bodies, invalid states, and continuing/departing states whose times do not match the current kernel time; then it installs the continuing-stack state exactly, appends the departing lane state exactly, marks the separation step/time, and refreshes relative distance/speed event caches. The tests prove exact explicit-state installation and fail-closed wrong-time rejection. This makes no claim that the runner already computes those states from release_welded_subtree_as_free_flyer, that batch explicit-state release is complete, or that full welded-release propagation is complete."
verification = ["V-MULTIBODY-043"]

[[requirements]]
id = "REQ-MULTIBODY-044"
title = "The rigid runner can install welded-release jettison states"
statement = "Schema-v3 [multi_body] scenarios accept propagation_authority = \"welded_release_jettison\" as an explicit guarded mode that requires primary_body_id and a separation declaration, rejects initial lanes and articulated gimbal joints, and routes jettison_stage plus batch jettison_bodies events through runner-side configured welded upper/lower multibody pairs. Separations may declare lower_weld_translation_upper_body_m and lower_weld_quaternion_upper_to_lower_xyzw, and [[multi_body.welded_body]] entries may declare dry welded descendants under a departing lower body; the parser validates finite translations, unit orientations, real body references, unique child parents, acyclic welded topology, and subtree ancestry. In that mode, the runner computes each departing lower-body free-flyer state with release_welded_subtree_as_free_flyer, projects same-time continuing and departing rigid states from the pre-install event state, applies configured welded geometry, dry descendant mass aggregation, separation delta-v, angular-rate tip-off, lower attitude offset, and mass-property COM-offset semantics, and installs them through jettison_rigid_body_with_states. The regressions prove successful single and batch release-state installation plus configured welded-transform, dry welded-subtree release, and impulse/tip-off/attitude-offset application. This makes no claim that dynamic/resource-owning subtree release or full rigid-kernel removal is complete."
verification = ["V-MULTIBODY-044"]

[[requirements]]
id = "REQ-SIL-001"
title = "FC-owned mission decisions use the estimated-state commander"
statement = "When mission authority belongs to the flight controller, mission events and mission actions are evaluated by the commander on bus-published estimated state; the simulator kernel does not re-evaluate them on truth."
verification = ["V-SIL-001", "V-SIL-002"]

[[requirements]]
id = "REQ-SIL-002"
title = "FC scenarios reject ideal truth sensors"
statement = "A scenario that declares a flight-controller block must not use an ideal-state sensor, because that bypasses the SIL sensor boundary."
verification = ["V-SIL-003"]

[[requirements]]
id = "REQ-SIL-003"
title = "Propellant depletion is visible to the commander"
statement = "The commander reads onboard PropellantState mass fraction when evaluating mass-fraction mission triggers."
verification = ["V-SIL-004"]

[[requirements]]
id = "REQ-SIL-004"
title = "Unsupported FC relative-navigation triggers fail closed"
statement = "A flight-controller-owned mission must reject relative-distance or relative-speed triggers until an onboard relative-navigation observable is wired, so simulator truth-relative maps cannot silently drive FC mission decisions."
verification = ["V-SIL-005"]

[[requirements]]
id = "REQ-SCHED-001"
title = "FC job rates and budgets are declarative I-loads"
statement = "Estimator, guidance, commander, autopilot, mixer, health, and FDIR rates and declared budgets are configurable through the scenario FC scheduler block with validated positive values."
verification = ["V-SCHED-001", "V-SCHED-002"]

[[requirements]]
id = "REQ-SCHED-002"
title = "Scheduler budget overruns are health and FDIR visible"
statement = "A scheduler budget overrun publishes an overrun event; sustained overrun bursts set the health failsafe flag and FDIR can latch the scheduler-overrun fault bit."
verification = ["V-SCHED-003"]

[[requirements]]
id = "REQ-RT-001"
title = "Known FC tick allocation regressions are guarded"
statement = "The scheduler dispatch hot path must use a registration-time cached order rather than sorting or collecting per tick, the commander tick must not clone the full mission binding table each tick, and voted sensor ingest jobs must reuse scratch buffers instead of allocating them per tick."
verification = ["V-RT-001"]

[[requirements]]
id = "REQ-RT-002"
title = "Host frame pacing is timing-only and observable"
statement = "The host real-time substrate exposes FreeRun, RealTime, and Paced frame modes with absolute-time scheduling, signed jitter percentiles, host frame-execution percentiles, overrun and frame-budget-overrun counting, real-time-factor reporting, and a Liu-Layland schedulability advisory; runner integration is opt-in through a v3 [realtime] block with optional [[realtime.task]] budgets, preserves identical functional telemetry across pacing modes, reports timing outside telemetry, and keeps openbmp-fc independent of openbmp-rt."
verification = ["V-RT-002"]

[[requirements]]
id = "REQ-BUS-001"
title = "Canonical FC topics have static bus indices"
statement = "Every canonical flight-controller topic exposes a stable compile-time topic-table index for static bus dictionaries and downstream fixed-storage backends."
verification = ["V-BUS-001"]

[[requirements]]
id = "REQ-ILOAD-001"
title = "Flight I-load blobs are versioned and integrity checked"
statement = "A serialized flight I-load is wrapped in a fixed envelope with a schema version, payload length, CRC-32 integrity check, and primary/fallback validation path."
verification = ["V-ILOAD-001"]

[[requirements]]
id = "REQ-NAV-001"
title = "High-dynamics navigation process noise is phase driven"
statement = "The EKF applies the high-dynamics position and velocity process-noise scale only when the commander-published estimator-regime state is boost mode."
verification = ["V-NAV-001", "V-NAV-002", "V-NAV-003"]

[[requirements]]
id = "REQ-FDIR-001"
title = "Estimator lane failover is visible to FDIR"
statement = "When a multi-lane estimator switches away from the primary lane or loses all lanes, it publishes lane-selection status and FDIR latches an estimator-lane failover fault bit."
verification = ["V-FDIR-001"]

[[requirements]]
id = "REQ-FDIR-002"
title = "HAL sensor read failures surface as FDIR sensor faults"
statement = "Sensor ingest publishes unhealthy samples when a HAL or synthetic sensor read fails; the health monitor turns unhealthy samples into failsafe flags and FDIR latches the corresponding sensor fault bit."
verification = ["V-FDIR-002"]

[[requirements]]
id = "REQ-FDIR-003"
title = "FDIR redlines are declarative I-load watchpoints"
statement = "A scenario can declare FDIR redline watchpoints; the runner maps them into FdirParams and the FDIR job latches a fault bit when the watched estimate exceeds the limit."
verification = ["V-FDIR-003"]

[[requirements]]
id = "REQ-FDIR-004"
title = "Covariance-trace estimator voting uses exposed covariance diagnostics"
statement = "The multi-lane estimator best_by_covariance_trace voter selects the healthy lane with the smallest positive finite exposed position, velocity, and attitude covariance diagonal trace, treats non-finite or negative covariance diagnostics as unusable, falls back to the deterministic innovation chi-square proxy only when no covariance diagonal block is exposed, and keeps deterministic lowest-index tie breaking."
verification = ["V-FDIR-004"]

[[requirements]]
id = "REQ-HAL-001"
title = "Shared and flight-math contracts compile without std"
statement = "The shared core, state, model, mission, HAL, bare sensor-trait, no_std flight-math physics, propulsion core, aerodynamics core, forward AFTS monitor, and alloc-aware flight controller crates compile for the embedded thumb target with default features disabled."
verification = ["V-HAL-001"]

[[requirements]]
id = "REQ-PIL-001"
title = "Flight-controller step entry is hardware-portable"
statement = "The flight-controller crate exposes a hardware-portable topic-level fc_step entry that accepts FcStepInput time/tick plus optional IMU, barometer, air-data, GNSS, magnetometer, and star-tracker samples; publishes those samples before dispatch; runs exactly one FlightController scheduler tick; returns FcStepOutput with dispatch summary plus latest actuator, effector, engine, FDIR, failsafe, and vehicle-status outputs; fails closed when required topics are not registered; compiles without default features; and keeps openbmp-fc free of bridge, runner, scenario, telemetry, CLI, simulator, and aerothermal dependencies. The openbmp-bridge packet, codec, lockstep-validator, caller-buffer encode, and caller-buffer frame surface compiles without default features for the embedded thumb target while host transports, XIL ports, and bridge fault transforms stay std-gated. The openbmp-pil crate provides a no_std-capable target shim outside openbmp-fc that decodes bridge SensorPacket bytes, adapts them into FcStepInput, calls fc_step, converts captured effector/engine topics into ActuatorCommandPacket, encodes command bytes into caller storage, exposes a repr(C) PilMailbox with target-visible status/error codes plus PilMailboxLayout field offsets for GDB-symbol or UART-backed firmware wrappers, exposes a complete-frame PilFrameIo loop over the existing length-prefixed bridge frame format, exposes a fixed-buffer PilFramePump that ingests arbitrary byte chunks, waits for complete frames, preserves queued trailing frames, and holds one pending output frame for caller transmission, exposes a PilByteIo polling endpoint that reads caller-owned byte chunks, drives the pump, writes completed command frames, and preserves pending output across write failures, exposes OPENBMP_PIL_MAILBOX / openbmp_pil_step_mailbox advisory symbol names with PilFirmwareSymbolContract, exposes a safe PilFirmware wrapper that owns one initialized FlightController plus bounded mailbox, pump, and read scratch for target firmware loops, and exposes PilWcetBudget / PilWcetReport integer instruction-count × CPI deadline evidence helpers; it compiles for the embedded thumb target with default features disabled. The runner adapts openbmp-bridge SensorPacket and ActuatorCommandPacket frames to the topic-level FC boundary outside openbmp-fc, exposes a validated RenodePilPlan renderer for a socket-backed UART `.resc` coupling script, exposes GdbPilSymbolBinding helpers that resolve mailbox and step-entry addresses from target ELF32/ELF64 symtab/dynsym bytes or files, exposes a GdbPilMailboxPlan with GdbMemoryRead/GdbMemoryWrite/GdbBreakpointCommand helpers that map the resolved target mailbox symbol address plus PilMailboxLayout into deterministic GDB Remote Serial Protocol memory read/write/breakpoint packets and decode target-read status/error/length/command payload bytes, exposes a GdbRspSession over caller-owned Read+Write streams that performs RSP checksummed packet exchange, acknowledgement, target-error handling, memory reads/writes, software breakpoint insert/remove, continue, mailbox sensor loading, and mailbox status/command reads, and exposes a host PilFrameStream/RenodeSocketPilClient that sends length-prefixed SensorPacket bytes to that socket, decodes length-prefixed ActuatorCommandPacket responses, enforces payload limits, and fails closed on step/time mismatches. This is only the factored PIL prerequisite, target-compatible bridge wire surface, no_std byte/mailbox/framed endpoint/frame-pump/byte-poll/firmware-wrapper shim, WCET budget plumbing, host Renode script renderer, ELF symbol resolver, GDB mailbox/RSP planner and tested stream-session mechanics, socket client, and host bridge-packet adapter, not a downstream-exported linked firmware image, live Renode target execution, real UART driver, actuator-equivalence-on-target gate, or measured WCET claim."
verification = ["V-PIL-001"]

[[requirements]]
id = "REQ-HAL-002"
title = "HAL provides a no-heap static bus contract"
statement = "The HAL crate exposes a fixed-capacity latest-value StaticBus keyed by Topic::INDEX and backed by explicit payload encoders rather than TypeId, Any, or heap storage."

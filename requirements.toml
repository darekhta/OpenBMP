[[requirements]]
id = "REQ-DET-004"
title = "Native aarch64 determinism is a CI-declared bit-stable profile"
statement = "The CI workflow runs the fixed-step canonical determinism scenarios on a native aarch64 Linux runner, verifies the aarch64 host and floating-point guard profile, and byte-diffs those Parquet/CSV outputs against the same-run x86_64 reference artifact before accepting the second Linux bit-stable profile."
verification = ["V-DET-004"]

[[requirements]]
id = "REQ-DET-005"
title = "GPU offload is bounded to offline provenance-pinned decks"
statement = "The repository contains a WP-12.4-b boundary fixture for externally produced GPU-style output as a static offline atmosphere-density deck under data/ with a sibling provenance record, SHA-256 pin, explicit UQ band, and no-live-GPU metadata; the deterministic CPU path reproduces the deck's sampled subset through the existing AtmosphereModel surface within the declared UQ band, and workspace Cargo manifests do not add known GPU framework dependencies."
verification = ["V-DET-005"]

[[requirements]]
id = "REQ-STD-001"
title = "Standards posture avoids certification overclaim"
statement = "The repository documents that upstream OpenBMP uses civil aerospace and simulation standards as vocabulary and evidence organization only; certification, qualification, real-time proof, and data-rights posture are re-earned by downstream real-vehicle forks."
verification = ["V-STD-001"]

[[requirements]]
id = "REQ-CONFORM-001"
title = "A fork-runnable conformance entry point exists"
statement = "The CLI exposes a conformance command that validates and runs one or more scenarios without writing telemetry, so downstream forks can smoke-test the shared scenario and runner path."
verification = ["V-CONFORM-001"]

[[requirements]]
id = "REQ-TRAJOPT-001"
title = "The offline trajectory corrector has a CLI I-load path"
statement = "The host-side trajectory optimization crate exposes deterministic T0 two-body and scenario-backed runner apogee drivers that call the differential corrector with propagated terminal states, target only TerminalCondition::ApogeeRadius, write postcard I-loads only after convergence, report non-convergence without writing an I-load, and expose the capability through offline CLI commands with no surface-coordinate inputs."
verification = ["V-TRAJOPT-001"]

[[requirements]]
id = "REQ-TRAJOPT-002"
title = "The trajectory optimizer exposes an STM multiple-shooting substrate"
statement = "The host-side trajectory optimization crate exposes a deterministic two-body variational STM propagator with complex-step column verification, a multiple-shooting continuity evaluator whose defects and state Jacobian are block-bidiagonal and whose segment-duration sensitivity columns are verified, a controlled multiple-shooting evaluator whose control sensitivity columns are verified for piecewise-constant ECI acceleration controls, soft box/path exterior-penalty rows for node state components, state norms, rotating-atmosphere qbar, and qbar-alpha, a damped fixed-endpoint interior-node corrector, and fixed-initial-state terminal-condition correctors, including free-duration and controlled variants, that target only the closed TerminalCondition equality vocabulary, report non-convergence honestly, prove the T1 multiple-shooting solution matches the T0 single-shooting apogee case through a checked-in cross-tier tolerance table, and remain independent of any surface-coordinate target vocabulary."
verification = ["V-TRAJOPT-002"]

[[requirements]]
id = "REQ-ENV-001"
title = "The physics layer exposes a first tesseral gravity substrate"
statement = "The HAL-portable physics crate exposes an opt-in TesseralGravity model with finite degree-2 C20, C21/S21, and C22/S22 coefficients, an explicit TideSystem tag, fail-closed degree/order validation that currently permits only degree 0 or degree 2 up to order 2, a fully-normalized degree-2 coefficient ingestion bridge with a reusable NormalizedHarmonicField / NormalizedHarmonicCoefficient / NormalizedHarmonicFieldIter / IcgemGfcNormalizedField substrate, std-gated from_normalized_toml_str ingestion for OpenBMP normalized harmonic TOML fixtures, std-gated from_icgem_gfc_str and from_icgem_gfc_str_with_metadata ingestion for static ICGEM/NGA-style fully-normalized gfc coefficient lines plus source earth_gravity_constant/radius/max_degree metadata, explicit without_central_term stripping for full coefficient files whose Cbar00 central term must not be double-counted by point-mass-plus-correction evaluators, checked fully_normalized_to_unnormalized_scale helper, bounded HarmonicLongitudeTrigonometry cos(mλ)/sin(mλ) recurrence table, singularity-free PinesLongitudePolynomials direction-cosine recurrence, HarmonicTruncation envelope validator, HarmonicSynthesisPlan / HarmonicSynthesisTier runtime-tier validation and tag parsing for planned 70/120/360 EGM2008 requests, bounded PinesLegendreTable A_nm(u) recurrence, PinesSynthesisPoint geometry validator, PinesPotentialSum / pines_dimensionless_potential_sum and GottliebPotentialSum / gottlieb_dimensionless_potential_sum scalar-potential correction paths, pines_potential_correction_acceleration_finite_difference_m_s2 and gottlieb_potential_correction_acceleration_finite_difference_m_s2 acceleration oracles, pines_potential_correction_acceleration_gradient_finite_difference_s2 and gottlieb_potential_correction_acceleration_gradient_finite_difference_s2 finite-difference acceleration-gradient oracles, and FiniteDifferencePinesGravity GravityModel wrapper with new_from_full_normalized_field, new_from_icgem_gfc_str, new_from_icgem_gfc_str_with_synthesis_tier, and acceleration_gradient_eci_s2 that stores, scales, precomputes, parses source constants, strips Cbar00, differentiates, and validates deterministic harmonic inputs, cross-checks the Pines scalar sum through a Gottlieb-style longitude recomposition oracle, defaults missing in-envelope coefficients to zero for lookup and iteration, rejects duplicate or out-of-envelope entries, rejects malformed normalized-field TOML and ICGEM GFC metadata, rejects high-degree tier requests when field or scratch envelopes do not cover them, rejects central C00 double-counting in the correction-only constructor, and can rebuild the current Egm2008ZonalGravity J2-J6 truncation from a provenance-pinned normalized zonal Cbar_n0 fixture, parse a provenance-labeled synthetic degree-4 non-zonal normalized-field fixture, parse a provenance-labeled synthetic degree-4 ICGEM-style GFC fixture with source metadata, parse a provenance-pinned clipped EGM2008 degree-10/order-10 ICGEM-style GFC block with source constants and feed it through the FiniteDifferencePinesGravity transition model, parse a provenance-pinned WGS84 normalized degree-2 fixture, expose a degree-2/order-0 WGS84 J2 constructor that is byte-identical to the existing J2Gravity path, produce finite Cartesian evaluation near the pole, produce deterministic non-zonal acceleration and finite-difference acceleration gradients for sectoral/tesseral terms, expose EarthFixedGravity to rotate Earth-fixed harmonic models through FrameContext ECI/ECEF vectors including generated IersCio X/Y/s tests, wire schema-v3 runner scenarios to consume the bounded degree-2 path through environment.gravity = \"tesseral\" and third-body gravity_base = \"tesseral\", and wire schema-v3 environment.gravity = \"egm2008\" scenarios to resolve a SHA-pinnable ICGEM coefficient file with explicit egm2008_degree / egm2008_order or named egm2008_tier selectors and consume the degree-10 EGM2008 block or synthetic degree-70 tier path through the frame-coupled FiniteDifferencePinesGravity transition path while making no analytic Pines/Gottlieb completion claim."
verification = ["V-ENV-001"]

[[requirements]]
id = "REQ-ENV-002"
title = "Third-body perturbations use Battin's cancellation-free form"
statement = "The physics layer's ThirdBodyGravity path keeps its existing central-gravity plus ephemeris API but evaluates each third-body perturbing acceleration with Battin's f(q) formulation instead of the naive subtractive difference, remains finite in a documented |r| much less than |r_b| case where the naive expression loses a small component, and still reports singular/non-finite inputs fail-closed without claiming the remaining WP-08.2 Orekit force-stack validation work is complete."
verification = ["V-ENV-002"]

[[requirements]]
id = "REQ-ENV-003"
title = "The physics layer exposes analytic SRP and Schwarzschild perturbations"
statement = "The HAL-portable physics crate exposes opt-in SolarRadiationPressure and RelativisticCorrection force surfaces: cannonball SRP uses configurable area, mass, reflectivity, 1 AU pressure scaling, Sun ephemeris input, and a conical Earth-shadow factor from apparent solar/Earth disk overlap; the Schwarzschild correction uses typed ECI position and velocity, WGS84 defaults, named speed of light, and the standard beta equals gamma equals one first-post-Newtonian formula, with tests for full sunlight, umbra/penumbra behavior, circular-disk overlap, the near-3e-10 m/s^2 circular-orbit correction scale, and fail-closed invalid geometry while making no claim that the WP-08.2 Orekit code-to-code force-stack fixture is complete."
verification = ["V-ENV-003"]

[[requirements]]
id = "REQ-ENV-004"
title = "Earth-orientation samples carry CIO pole-offset fields and compact time-scale bridge"
statement = "The HAL-portable physics frame layer extends EarthOrientationSample with cip_offset_x_rad and cip_offset_y_rad celestial-pole-offset fields for future CIO-frame construction, keeps the legacy constructors defaulting both offsets to exactly zero, validates non-finite offsets fail-closed through a builder-style with_cip_offsets path and table validation, linearly interpolates dX/dY through EarthOrientationTable::sample alongside polar motion and UT1-UTC, exposes a TimeScaleBridge that converts pinned UTC-relative seconds and Julian Dates through UT1/TAI/TT plus the legacy compact two-term TT-to-TDB approximation, and also exposes ERFA eraDtdb-compatible TT-to-TDB helpers backed by a transcribed Fairhead-Bretagnon coefficient table with reference pins against the upstream ERFA C routine. The runner openbmp-eop-v1 parser ingests optional cip_offset_x_arcsec/cip_offset_y_arcsec pairs while rejecting rows that declare only one offset. Runner celestial UTC/TT/TDB epoch conversion now uses the shared TimeScaleBridge ERFA-compatible helper, supplies topocentric dtdb observer geometry from frames.local_origin when present, samples epoch.eop UT1-UTC for UTC-to-TDB phase when available, and pins the 2017 UTC conversion against the ERFA-style offset. Runner EOP ingestion also detects raw fixed-width IERS/USNO finals2000A.data rows, converts row MJD UTC to scenario-relative time_s from epoch.iso8601, prefers Bulletin B final x/y pole, UT1-UTC, dX, and dY columns when present, falls back to Bulletin A columns otherwise, converts dX/dY milliarcseconds to arcseconds and LOD milliseconds to seconds, and is exercised by a four-day provenance-pinned finals2000A-derived raw fixture plus equivalent openbmp-eop-v1 fixture. Runner EOP ingestion also detects raw IERS EOP 14 C04 IAU2000A rows with headers, consumes MJD, x, y, UT1-UTC, LOD, dX, and dY in the published C04 units, and is exercised by a four-day provenance-pinned C04 fixture. The current equinox-based IersTabulated transform remains unchanged, and this makes no claim that a CIO rotation matrix is complete."
verification = ["V-ENV-004"]

[[requirements]]
id = "REQ-ENV-005"
title = "The frame layer exposes ERFA-pinned CIO matrix primitives and scenario profile substrate"
statement = "The HAL-portable physics frame layer exposes ERFA-compatible building blocks for the IAU 2006/2000A CIO frame path: earth_rotation_angle_iau2000 and earth_rotation_angle_iau2000_parts mirror eraEra00, tio_locator_sp00 and tio_locator_sp00_parts mirror eraSp00, cio_locator_s06 and cio_locator_s06_parts mirror eraS06, mean_obliquity_iau2006 and mean_obliquity_iau2006_parts mirror eraObl06, fukushima_williams_angles_iau2006 and fukushima_williams_angles_iau2006_parts mirror eraPfw06, fukushima_williams_matrix mirrors eraFw2m, nutation_angles_iau2000a and nutation_angles_iau2000a_parts mirror eraNut00a using generated ERFA coefficient data, nutation_angles_iau2006a and nutation_angles_iau2006a_parts mirror eraNut06a, bias_precession_nutation_matrix_iau2006a and bias_precession_nutation_matrix_iau2006a_parts mirror eraPnm06a, cip_xy_from_bias_precession_nutation_matrix mirrors eraBpn2xy, cio_xys_iau2006a and cio_xys_iau2006a_parts mirror eraXys06a, cio_celestial_to_intermediate_matrix mirrors eraC2ixys, polar_motion_matrix_iau2000 mirrors eraPom00, and cio_celestial_to_terrestrial_matrix assembles the eraC2tcio product RPOM * R3(ERA) * RC2I. It also exposes CioXysSample, CioXysTable, CioXysCoordinates, CioFrameSample, and CioFrameModel as a CIO substrate that samples pinned EOP, adds dX/dY offsets to X/Y before matrix construction, derives UT1 and TT dates through TimeScaleBridge, computes ERA and TIO s prime, and returns GCRS-to-ITRS plus inverse CIO matrices; CioFrameModel can use either caller-provided X/Y/s tables or internally generated IAU 2006/2000A X/Y/s. FrameProfile::IersCio and runner frame construction are wired behind frame_profile = \"iers-cio\" / [frames].profile = \"iers-cio\" using SHA-pinned epoch.eop and leap-second inputs, defaulting to internally generated IAU 2006/2000A X/Y/s; when epoch.cio_xys is supplied, the runner parses the openbmp-cio-xys-v1 TOML table, validates EOP and X/Y/s table coverage over the simulation interval, and keeps IersTabulated unchanged. These helpers validate non-finite inputs fail-closed, reject impossible CIP X/Y norms including post-offset combinations, remain available in no-default-features physics builds, and are pinned against reference values generated from upstream ERFA C sources for era00.c, sp00.c, s06.c (6ad19dd59c3150d9f065b3f76d254c1cf3adb0cb6bacd6422c1dc6b6f14122ea) plus its fundamental-argument helpers, nut00a.c (a1538ec0277745db974ab76ca4b678a7602249bccecf9474e2b0268f9c2032ef), nut06a.c (819c36a689c28e50aaf71ec6d9774da5130df09657a07ab07520ae3712414d07), xys06a.c (a0b87f7a16b843254d11df469ce3b809cd44155611e361b25580ea6d4086f6ae), pnm06a.c (ea1814a86aad0895b6f1d5a48ef0308474df1f8fcf27abe6c0293165d8367b99), obl06.c (550260874d5e5fa3be77296b85b92c54c726fee6fbb1bb44748d04c17ffb37c2), pfw06.c (085f49861026fab98633d8479795090b3278a0d246a938ebdf10fde326ef1987), fw2m.c (480d1ae7780566980b8f80f4c6daa2be330a80e99861d892dc5a9f7b11da47c0), bpn2xy.c (8771bc7db7aeb18f8d9d6fc258d5a28db55e05f3345df0564b4c71a20cc01dfb), c2tcio.c (1a219863130bcb49ae67f424264776339aea8db5fdd0e716dbff660fbdd65a44), c2ixys.c, and pom00.c; the generated-X/Y/s CioFrameModel path is additionally pinned against a three-case UTC/EOP full-matrix grid generated from ERFA Xys06a, C2ixys, Era00, Sp00, Pom00, and C2tcio, and cio_xys_iau2006a is checked against IERS TN36 Ch.5 electronic Tables 5.2a, 5.2b, and 5.2d table-derived X/Y/s reference pins. FrameContext also exposes direction/acceleration vector rotations used by EarthFixedGravity, and a generated-IersCio tesseral gravity test proves the local frame-coupled force path while keeping the broader WP-08.4 Orekit force-stack validation open."
verification = ["V-ENV-005"]

[[requirements]]
id = "REQ-CONTACT-001"
title = "Contact substrate exposes deterministic half-space force laws"
statement = "The contact dynamics substrate is an L2 crate that exposes point and sphere half-space kinematics, Kelvin-Voigt, Hertz, and Hunt-Crossley normal laws, regularized Coulomb friction, a fixed-step penalty-contact stability bound, and energy-audit closure helpers without depending on runner, simulator, or flight-controller crates."
verification = ["V-CONTACT-001"]

[[requirements]]
id = "REQ-CONTACT-002"
title = "Contact force is scenario-reachable without changing default ground impact"
statement = "Schema-v3 scenarios can opt into a [contact] half-space force with point or sphere geometry, load-time stability validation, automatic force-stack derivation when [forces] is omitted, explicit-force consistency checks when [forces] is present, runner-side GroundImpact disablement for contact scenarios, fixed contact substep integration by dividing the runner kernel step size by contact.substeps, standard force.contact.{x,y,z}_n telemetry, contact.gap_m, contact.penetration_m, contact.normal_velocity_m_s, and contact.normal_force_n diagnostics telemetry, and an out-of-band RunOutcome contact report with NoContact, Rest, and Unsettled classification plus run-level contact elastic-energy, contact-work, dissipation, and closure-error audit fields without depending on flight-controller crates."
verification = ["V-CONTACT-002"]

[[requirements]]
id = "REQ-CONTACT-003"
title = "Contact substrate exposes scalar constraint primitives"
statement = "The contact dynamics substrate exposes one-sided scalar stop, two-sided backlash gap, monotone latch primitives, and an allocation-free scalar mechanism evaluator that sums stop/backlash generalized forces and updates caller-owned latch state in declaration order, with finite-input validation, unilateral no-tension force clamping, exact configured backlash dead-zone width reporting, closed-form Kelvin-Voigt stop restitution evidence, and engage-once latch state transitions without depending on simulator or flight-controller crates. Schema-v3 [contact] blocks can declare optional [[contact.mechanism]] angular stop/backlash/latch fixtures with kind-specific fail-closed validation and duplicate-id rejection; schema-v3 [[multi_body.gimbal_joint]] entries can bind one contact mechanism by mechanism_id when its coordinate matches the engine id; and the rigid runner converts that mechanism into primary gimbal generalized force during articulated gimbal shadow derivative and forecast evaluation. This remains limited to a single primary-axis gimbal mechanism and does not claim full CFE loop-constraint dynamics, multi-axis mechanism routing, or broad doc-01 tree-joint mechanism authority."
verification = ["V-CONTACT-003"]

[[requirements]]
id = "REQ-CONTACT-004"
title = "Contact substrate exposes anchored stiction and rest anchors"
statement = "The contact dynamics substrate exposes anchored stick-slip friction with a static friction cone, kinetic sliding force, Karnopp restick velocity window, deterministic anchor-state updates, tangential anchor elastic-energy and non-negative dissipation reporting, incline stiction and sliding closed-form helpers, a drive-spring stick-slip oscillator fixture matched against an independent ideal Karnopp reference, a consecutive-hold rest detector, and Housner rocking-block closed-form threshold and period anchors without depending on runner, simulator, or flight-controller crates."
verification = ["V-CONTACT-004"]

[[requirements]]
id = "REQ-CONTACT-005"
title = "Anchored stiction contact is scenario-reachable"
statement = "Schema-v3 [contact] blocks can select regularized_coulomb or anchored_stiction friction, validate anchored static and kinetic coefficients plus tangential stiffness, damping, and restick speed fields fail-closed, route anchored_stiction through the point-mass and rigid-body contact force adapters with deterministic time-gated anchor updates, and classify contact rest from a kinetic-energy floor plus sticking hold while preserving the default regularized_coulomb behavior for existing contact scenarios."
verification = ["V-CONTACT-005"]

[[requirements]]
id = "REQ-CONTACT-006"
title = "Landing gear oleo and crush-core primitives exist"
statement = "The vehicle crate exposes landing-gear leg primitives with validated body hardpoints, normalized strut axes, optional footpad geometry, a polytropic oleo stage with quadratic orifice damping and closed-form stored-energy reporting, and an irreversible crush-core stage whose absorbed-energy update advances a monotone crushed coordinate with the plateau identity stroke = energy / force."
verification = ["V-CONTACT-006"]

[[requirements]]
id = "REQ-CONTACT-007"
title = "Landing gear rack is scenario-reachable"
statement = "Schema-v3 rigid_body scenarios can declare [vehicle.landing_gear] with a provenance-pinned data_file, ground altitude, and N validated legs carrying hardpoint, strut axis, free length, footpad, optional footpad friction, oleo, and crush parameters. The parser derives the landing_gear force when [forces] is omitted, rejects inconsistent explicit force lists, records the resolved data-file SHA-256 in telemetry metadata, routes landing_gear through rigid-body force and moment adapters, disables automatic ground-impact termination for gear scenarios, evaluates each footpad through a per-pad ContactPair in external-normal mode, publishes both force.landing_gear.{x,y,z}_n and per-leg stroke, gap, compression-rate, load, crush, and contact telemetry, emits a RunOutcome.landing_gear report with Rest/Unsettled/NoContact classification plus final per-leg tangential speed and friction-force evidence and a deterministic energy audit, and recovers body-x section loads from final per-leg samples for structural line-load consumers. The checked-in synthetic four-leg drop fixture verifies all four legs load and contact simultaneously, reaches Rest, closes the landing-gear energy audit to within 1%, and matches recovered mid-body shear/bending against independently read final front-leg telemetry; a focused runner test verifies ContactPair footpad friction contributes the expected tangential force."
verification = ["V-CONTACT-007"]

[[requirements]]
id = "REQ-MC-001"
title = "Seeded Monte-Carlo evidence has a visible CI lane"
statement = "The repository exposes a scheduled or manually runnable CI lane for the seeded footprint and ascent Monte-Carlo checks, so dispersion acceptance evidence is reproducible outside ad hoc local runs."
verification = ["V-MC-001"]

[[requirements]]
id = "REQ-MC-002"
title = "Monte-Carlo campaigns use deterministic sample streams and reusable reducers"
statement = "Monte-Carlo campaign sampling uses the project deterministic RNG with a dedicated sample domain, and reusable campaign reports, Welford reducers, Clopper-Pearson reducers, explicit scalar-report byte checks, and a pinned scalar-report digest provide deterministic campaign statistics instead of ad hoc per-test samplers."
verification = ["V-MC-002"]

[[requirements]]
id = "REQ-MC-003"
title = "Monte-Carlo campaigns expose Wilks sizing and convergence gates"
statement = "Monte-Carlo campaign planning can compute one-sided and two-sided Wilks sample counts for a requested coverage and confidence level, and campaign traces can be evaluated by a deterministic relative half-width convergence gate."
verification = ["V-MC-003"]

[[requirements]]
id = "REQ-MC-004"
title = "Monte-Carlo campaigns expose deterministic Latin hypercube designs"
statement = "Monte-Carlo design-of-experiments support can generate a deterministic Latin hypercube unit-cube design with one sample in each marginal stratum for every dispersion dimension."
verification = ["V-MC-004"]

[[requirements]]
id = "REQ-MC-005"
title = "Monte-Carlo designs support Iman-Conover rank correlation"
statement = "Monte-Carlo design-of-experiments support can reorder an existing unit-cube design with an Iman-Conover transform so requested rank correlation is induced while each marginal column's samples are preserved exactly."
verification = ["V-MC-005"]

[[requirements]]
id = "REQ-MC-006"
title = "Monte-Carlo campaigns expose native Sobol base designs"
statement = "Monte-Carlo design-of-experiments support can generate a native unscrambled Sobol unit-cube design from a provenance-pinned Joe/Kuo direction-number table and CSV output for local evidence workflows."
verification = ["V-MC-006"]

[[requirements]]
id = "REQ-MC-007"
title = "Sobol campaigns support deterministic Owen-style scrambling"
statement = "Monte-Carlo Sobol design support can apply deterministic nested binary scrambling keyed by a campaign-local seed, so repeated runs are reproducible while independent scramble seeds produce distinct randomized QMC designs."
verification = ["V-MC-007"]

[[requirements]]
id = "REQ-MC-008"
title = "Parallel Monte-Carlo fan-out is worker-count deterministic"
statement = "Monte-Carlo scalar campaigns expose bounded rayon fan-out whose per-sample streams and fixed merge-tree reducers produce bit-identical reports across worker counts, and worker-side floating-point environment checks fail closed before sample evaluation."
verification = ["V-MC-008"]

[[requirements]]
id = "REQ-MC-009"
title = "Monte-Carlo scalar checkpoints resume bit-identically"
statement = "Monte-Carlo scalar and footprint campaigns can persist completed-index checkpoint data in JSON, validate scenario and toolchain metadata before resume, skip completed samples through library and CLI surfaces, and finalize resumed chunks to the same report bits as one-shot execution."
verification = ["V-MC-009"]

[[requirements]]
id = "REQ-MC-010"
title = "Synthetic rare-event estimators stay closed to real vehicle risk"
statement = "The Monte-Carlo crate exposes synthetic-only standard-normal rare-event limit-state primitives, a sealed LimitState trait, a linear analytic limit state with exact Phi(-beta) truth, deterministic Au-Beck-style Subset Simulation with modified-Metropolis conditional sampling, deterministic cross-entropy Gaussian importance sampling, replay-identical probability reports with coefficient-of-variation and analytic log10-error evidence, a fail-closed runtime guard that rejects non synthetic-limit-state labels, and a compile-fail tripwire proving external crates cannot implement a ground-aimpoint LimitState. The scenario parser accepts only schema-v3 synthetic rare-event Monte-Carlo manifests, rejects ground-aimpoint or target vocabulary under monte_carlo.limit_state before serde deserialization, and the CLI can execute those synthetic scenario manifests through openbmp mc rare-event with deterministic TOML evidence output."
verification = ["V-MC-010"]

[[requirements]]
id = "REQ-MC-011"
title = "Code verification reports observed order and GCI"
statement = "The testkit exposes a smooth manufactured scalar ODE with exact state, exact derivative, and source term, plus an observed-order and Richardson/GCI reducer over three halved step sizes; the CLI exposes openbmp verify-order to run the real fixed-step RK4 and DOP853 integrators against that manufactured case or a deterministic multi-case MMS lambda campaign, fail closed when observed order or GCI acceptance fails, reject empty or oversized campaign requests, and optionally write deterministic TOML evidence."
verification = ["V-MC-011"]

[[requirements]]
id = "REQ-MC-012"
title = "Synthetic reconstruction reports RTS, batch GN, and NEES/NIS evidence"
statement = "The testkit exposes pure linear-Gaussian reconstruction helpers for normalized-error-squared statistics, chi-square consistency bands, NEES/NIS in-bounds fractions, Rauch-Tung-Striebel smoothing, and linear batch Gauss-Newton normal-equation solves without depending on openbmp-fc; the CLI exposes openbmp reconstruct synthetic-linear to run the deterministic synthetic fixture, fail closed outside the [0.93, 0.97] NEES/NIS fraction band or nonzero batch-update tolerance, and optionally write deterministic TOML evidence."
verification = ["V-MC-012"]

[[requirements]]
id = "REQ-MC-013"
title = "FC observation reconstruction consumes real estimator innovation histories"
statement = "The CLI reconstruction layer can run an existing scenario with the read-only SIL monitor, consume real estimator.status innovation histories from the in-loop flight controller, reduce GNSS, barometer, and magnetometer NIS samples through the testkit chi-square consistency helpers when those measurement updates are present, report estimator-sample counts, rejected-innovation counts, covariance-condition proxy maxima, and per-sensor in-bounds fractions, fail closed when no FC estimator diagnostics or innovation samples are observed, and optionally write deterministic TOML evidence without perturbing the underlying run."
verification = ["V-MC-013"]

[[requirements]]
id = "REQ-MC-014"
title = "FC observation reconstruction reports covariance-backed NEES"
statement = "The flight-controller estimator status topic publishes finite covariance diagonal blocks for exposed position, velocity, and attitude error-state subspaces while using zero diagonal blocks for unavailable subspaces; the CLI reconstruction layer consumes those diagnostics through the read-only SIL monitor, computes estimate-vs-truth position, velocity, and attitude NEES samples only when the corresponding diagonal block is positive and finite, reduces each populated block through the testkit chi-square consistency helpers, fails closed when no covariance-backed NEES samples are observed, and writes deterministic TOML evidence alongside the existing NIS report."
verification = ["V-MC-014"]

[[requirements]]
id = "REQ-MC-015"
title = "Reconstruction layer exports deterministic ECI trajectories for code-to-code exchange"
statement = "The CLI reconstruction layer can run an existing scenario through openbmp reconstruct export-trajectory, require the primary time, ECI position, and ECI velocity telemetry channels to be present as float64 data, write a deterministic CSV containing time_s, step, position_x/y/z_eci_m, and velocity_x/y/z_eci_m_s columns, report sample count, final time, and stop reason, fail closed when no complete trajectory rows are available, and keep external solver data outside the repository for local compare-telemetry workflows."
verification = ["V-MC-015"]

[[requirements]]
id = "REQ-MC-016"
title = "Reconstruction layer exports trajectory compare tolerance mappings"
statement = "The CLI reconstruction layer can write deterministic compare-telemetry mapping TOML for exported trajectory CSVs through openbmp reconstruct export-trajectory-mapping, provides a strict round-trip pack and a leo-research external-code starter pack, maps all three ECI position and velocity CSV columns to the corresponding OpenBMP telemetry channels with declared absolute tolerances and time interpolation tolerance, and proves the strict pack by exporting a trajectory CSV and comparing it back against the same scenario through the existing compare-telemetry engine."
verification = ["V-MC-016"]

[[requirements]]
id = "REQ-MC-017"
title = "Reconstruction local workflow keeps external BET references local-only"
statement = "The CLI reconstruction layer can write a deterministic LOCAL-only BET/code-to-code workflow manifest through openbmp reconstruct local-workflow, recording the scenario, OpenBMP trajectory CSV path, compare-telemetry mapping path, external reference CSV path, tolerance pack, and exact local commands for export, mapping, and comparison while explicitly marking external telemetry as local-only, not read by the manifest writer, not copied into the repository, and not a flight or targeting input."
verification = ["V-MC-017"]

[[requirements]]
id = "REQ-UQ-001"
title = "UQ budgets expose correlated source tags and 7009B credibility records"
statement = "The workspace exposes an L1 openbmp-uq crate that uses the canonical openbmp-core ValidationStatus, preserves the legacy flat RSS-plus-bias ErrorBudget for compatibility, provides source-tagged CorrelatedErrorBudget aggregation via sqrt(s^T Sigma s), reports aleatory and epistemic sub-aggregates, validates finite symmetric unit-diagonal bounded positive-semidefinite correlation matrices fail-closed, exposes NASA-STD-7009B-shaped eight-factor CredibilityRecord scoring with absent factors binding to L0, maps binding credibility back to the four public validation labels, and leaves openbmp-physics::uq as a compatibility re-export rather than a duplicate implementation."
verification = ["V-UQ-001"]

[[requirements]]
id = "REQ-UQ-002"
title = "Monte-Carlo campaign reports enforce UQ credibility floors"
statement = "Monte-Carlo scalar summaries, landing-footprint campaigns, and sampled propulsion-fault campaigns can read a TOML UQ budget into openbmp-uq CorrelatedErrorBudget data, evaluate campaign credibility through the shared MC campaign credibility helper and openbmp-mc, preserve ordinary reports when no UQ budget is supplied, optionally write a deterministic Markdown credibility report, fail closed before final campaign evidence is accepted when the binding credibility level is below the requested floor, allow landing-footprint scenario manifests to declare the UQ budget, floor, and report path under landing_footprint.monte_carlo.uq, and allow propulsion-fault library manifests to declare the same campaign UQ sidecar under uq."
verification = ["V-UQ-002"]

[[requirements]]
id = "REQ-UQ-003"
title = "Nested UQ reducers emit p-boxes and variance splits"
statement = "The UQ, Monte-Carlo, scenario, runner, and CLI layers can reduce nested aleatory-within-epistemic scalar sample sets into a conditional-CDF probability-box envelope, compute the law-of-total-variance split E_theta[Var_a] plus Var_theta[E_a], reject empty or non-finite nested samples fail-closed, verify lower-tail scalar probability requirements against the lower p-box bound rather than a mean conditional CDF, group materialized nested sample CSVs by epistemic condition, execute landing-footprint nested Monte-Carlo campaigns from source uncertainty_class tags and landing_footprint.monte_carlo.nested sample counts, and optionally write deterministic p-box CSV evidence."
verification = ["V-UQ-003"]

[[requirements]]
id = "REQ-UQ-004"
title = "Upstream deck margins can become source-tagged UQ sources"
statement = "The UQ crate exposes a no-std-compatible UpstreamMargin adapter that validates source ids, quantity ids, finite ordered lower/nominal/upper bounds, uncertainty class, upstream evidence, and credibility records, converts the larger side of each bounded band into a conservative one-sigma source contribution, can build a CorrelatedErrorBudget from ordered upstream margins plus an optional correlation matrix, and provides structural bending, aerodynamic coefficient, aerothermal model, and propulsion c_star_efficiency helpers that map upstream deck bands into source-tagged epistemic budget sources with evidence pointers and credibility scores; the scenario schema accepts optional vehicle.bending.uq frequency-band evidence, aero.uq coefficient-band evidence, and aerothermal.uq stagnation q_conv_w_m2 evidence; the runner gathers declared structural bending, aerodynamic coefficient, aerothermal q_conv_w_m2, and resolved thermochemical liquid-engine c_star_efficiency bands into upstream UQ sources and exposes the gathered budget on RunOutcome and FootprintMonteCarloReport without changing nominal dynamics, footprint propagation, or engine performance; the MC CLI exposes a typed CampaignCredibilityInputs contract plus a generalized campaign credibility helper that evaluates optional sidecar budgets plus runner-gathered upstream UQ budgets, preserving upstream-only correlation matrices and appending sidecar/upstream blocks as independent sources when both are present; sampled propulsion-fault and landing-footprint Monte-Carlo campaigns use that contract to merge runner-gathered upstream UQ sources into campaign credibility reports before final evidence is written."
verification = ["V-UQ-004"]

[[requirements]]
id = "REQ-PROP-001"
title = "Solid-motor pressure thrust uses ambient static pressure"
statement = "A solid motor that opts into pressure-thrust correction computes thrust from the stored momentum-thrust curve plus the ideal nozzle pressure term using the runtime atmosphere static pressure, while existing constant-correction motors preserve the legacy thrust curve."
verification = ["V-PROP-001"]

[[requirements]]
id = "REQ-PROP-002"
title = "Solid-motor nozzle separation clips overexpanded pressure thrust"
statement = "A solid motor that opts into nozzle separation with pressure-thrust correction detects heavily overexpanded operation, clips the effective expansion ratio with Summerfield or Schmucker criteria, and preserves the legacy full-nozzle pressure-thrust solution when separation is off."
verification = ["V-PROP-002"]

[[requirements]]
id = "REQ-PROP-003"
title = "Inline solid-grain transient chamber regression is opt-in"
statement = "Inline solid-grain motors can opt into a deterministic lumped-volume chamber-pressure integration mode that produces a validated SolidMotor curve, preserves the quasi-static equilibrium regression by default, and exposes an erosive burn-rate augmentation hook for transient internal-ballistics studies."
verification = ["V-PROP-003"]

[[requirements]]
id = "REQ-PROP-004"
title = "Thermochemistry decks parse and interpolate deterministically"
statement = "The L2 thermochemistry crate ingests Schema-1 offline CEA/Cantera-style decks, validates ideal c* consistency from chamber temperature, gamma, and molecular weight, carries an optional empirical c_star_efficiency band while keeping c* ideal, interpolates locked-order over log chamber pressure and mixture ratio, and fails closed for out-of-envelope queries or malformed efficiency bands."
verification = ["V-PROP-004"]

[[requirements]]
id = "REQ-PROP-005"
title = "Propulsion runtime paths can consume thermochemistry decks"
statement = "An inline solid-grain motor or reduced feed-network engine may declare a SHA-pinned [propulsion.thermochem] Schema-1 deck; the runner samples it at the declared chamber pressure and mixture ratio, overrides the inline grain c_star_m_s and gamma constants or feed-network chamber c_star_m_s, gas temperature, and molecular-weight-derived gas constant with the looked-up state, and preserves configured constants when the block is omitted."
verification = ["V-PROP-005"]

[[requirements]]
id = "REQ-PROP-006"
title = "Feed-system crate exposes a deterministic tank-valve-chamber solve"
statement = "The L2 feed-system crate provides an off-runner FeedNetwork boundary and a validated tank-valve-chamber equilibrium solve that balances incompressible valve inflow against choked throat outflow with fixed deterministic iteration, finite/positive parameter validation, fail-closed non-convergence handling, zero-flow closed-valve behavior, and a provenance-backed steady feed-network tolerance table."
verification = ["V-PROP-006"]

[[requirements]]
id = "REQ-PROP-007"
title = "Liquid engine feed networks can override feed pressure scale"
statement = "A tank-coupled liquid engine may declare one [[propulsion.feed_network]] tank_valve_chamber block; scenario validation rejects duplicate or unknown engine ids and engines without propellant budgets, and the runner samples the configured feed network to override that engine's existing feed_pressure_scale while preserving depletion shutdown precedence and the legacy regulated/blowdown path when the block is omitted."
verification = ["V-PROP-007"]

[[requirements]]
id = "REQ-PROP-008"
title = "Feed-system graphs solve deterministic node-branch mass balance"
statement = "The feed-system crate exposes a steady node/branch graph with fixed-pressure, junction, and chamber nodes, signed incompressible valve branches, choked chamber-throat outflow, fixed-cap deterministic Newton iteration, dense linear solve fail-closed handling, node-pressure/branch-flow snapshots with bounded mass residuals, and a provenance-backed two-valve ladder tolerance table."
verification = ["V-PROP-008"]

[[requirements]]
id = "REQ-PROP-009"
title = "Feed-system chambers integrate transient pressure deterministically"
statement = "The feed-system crate exposes a lumped transient chamber-pressure stepper that validates finite non-negative state and feed inputs, advances dp/dt = (R*T/V)*(m_dot_in - p*At/c*) with an exact constant-input update, reports inlet/outlet mass flow, pressure rate, optional oxidizer/fuel mixture ratio, validation status, fails closed for non-finite intermediate values, and is backed by a provenance-recorded transient chamber tolerance table."
verification = ["V-PROP-009"]

[[requirements]]
id = "REQ-PROP-010"
title = "Feed-system controllers produce bounded throttle and mixture commands"
statement = "The feed-system crate exposes a deterministic dual-valve throttle/MR controller that validates finite chamber-pressure and optional mixture-ratio setpoints/measurements, applies pressure PI correction to both valve commands, applies mixture-ratio PI correction with opposite oxidizer/fuel signs, clamps outputs to declared valve bounds, applies deterministic slew limiting, fails closed when an MR setpoint lacks an MR measurement, and is backed by a provenance-recorded controller tolerance table."
verification = ["V-PROP-010"]

[[requirements]]
id = "REQ-PROP-011"
title = "Feed-system transient dual-valve networks couple feed legs to chamber pressure"
statement = "The feed-system crate exposes a stateful transient dual-valve feed network with independent oxidizer and fuel tank/valve legs, finite/positive leg validation, bounded valve command validation, start-of-step incompressible valve inflows, exact lumped chamber-pressure integration, oxidizer/fuel mass-flow and mixture-ratio reporting, zero-time hold behavior, fail-closed handling for invalid values, and a provenance-recorded dual-valve transient tolerance table."
verification = ["V-PROP-011"]

[[requirements]]
id = "REQ-PROP-012"
title = "Feed-system turbopump maps apply affinity scaling and NPSH cavitation"
statement = "The feed-system crate exposes a generic normalized turbopump map with finite coefficient validation, design-point affinity scaling of flow and pressure rise, speed-scaled NPSH required versus available NPSH cavitation detection, cavitation head derating, efficiency and power reporting, specific-speed family metadata, and fail-closed handling for invalid map or operating values."
verification = ["V-PROP-012"]

[[requirements]]
id = "REQ-PROP-013"
title = "Feed-system line transients advance a fixed-grid MOC water-hammer step"
statement = "The feed-system crate exposes a frictionless fixed-grid Method-of-Characteristics line transient primitive with Courant-exact dx/a time step reporting, finite line-state validation, upstream fixed-head and downstream valve-velocity boundaries, characteristic interior updates, downstream pressure/head snapshots, and a valve-closure surge matching the Joukowsky bound."
verification = ["V-PROP-013"]

[[requirements]]
id = "REQ-PROP-014"
title = "Liquid engine feed networks can run transient dual-valve chamber state"
statement = "A tank-coupled liquid engine may declare one [[propulsion.feed_network]] transient_dual_valve_chamber block; scenario validation rejects malformed leg, chamber, and command values through strict typed fields, and the runner stores chamber pressure state in the feed-network rack, advances it once per simulation tick using the scenario time step, maps the updated chamber pressure to the existing feed_pressure_scale, and preserves depletion shutdown precedence."
verification = ["V-PROP-014"]

[[requirements]]
id = "REQ-PROP-015"
title = "Transient feed networks can close pressure and mixture-ratio control loops"
statement = "A transient_dual_valve_chamber feed network may declare a controller block with chamber-pressure and optional mixture-ratio setpoints, PI gains, integral clamps, valve bounds, and slew limits; scenario validation rejects malformed controller parameters, and the runner stores controller state, updates valve commands before each transient network step, carries the latest mixture-ratio measurement, and preserves the fixed-command path when the controller block is omitted."
verification = ["V-PROP-015"]

[[requirements]]
id = "REQ-PROP-016"
title = "Transient feed-network legs can use scenario-declared turbopump pressure rise"
statement = "A transient_dual_valve_chamber feed network may declare oxidizer_pump and fuel_pump blocks with generic normalized turbopump design points, map coefficients, NPSH parameters, and operating points; scenario validation rejects malformed pump scalars and coefficients, and the runner solves each configured pump at build time, applies NPSH derating through openbmp-feedsystem, adds the solved pressure rise to the corresponding feed-leg tank pressure, and preserves the no-pump path when the pump block is omitted."
verification = ["V-PROP-016"]

[[requirements]]
id = "REQ-PROP-017"
title = "Transient feed-network legs can use scenario-declared MOC line pressure perturbations"
statement = "A transient_dual_valve_chamber feed network may declare oxidizer_line and fuel_line fixed-grid Method-of-Characteristics line blocks with length, wave speed, density, area, segment count, initial state, and boundary values; scenario validation rejects malformed line parameters, the runner enforces that the line Courant time step equals scenario time.dt_s, advances each configured line once per simulation tick, applies the downstream pressure perturbation around that leg's tank-plus-pump feed pressure, steps the transient dual-valve network with dynamic feed pressures, and preserves the no-line path when line blocks are omitted."
verification = ["V-PROP-017"]

[[requirements]]
id = "REQ-PROP-018"
title = "Feed-system POGO stability primitive evaluates accumulator-detuned closed-loop margins"
statement = "The feed-system crate exposes a deterministic reduced POGO stability primitive that validates one longitudinal structural mode, a first-order feed response, mass-flow-gain phase lead, cavitation compliance, and accumulator compliance; it attenuates open-loop feed gain by the cavitation-to-accumulator compliance ratio, assembles the cubic closed-loop characteristic, evaluates static and Routh-Hurwitz dynamic stability margins, reports stable, static-divergence, or dynamic-instability verdicts, exposes the neutral accumulator compliance boundary, and remains an off-runner primitive until scenario-facing POGO wiring is added."
verification = ["V-PROP-018"]

[[requirements]]
id = "REQ-PROP-019"
title = "Propulsion POGO scenarios can gate startup on reduced stability verdicts"
statement = "A scenario may declare an optional [propulsion.pogo] block with explicit reduced longitudinal-mode scalars or mode_source = \"vehicle_bending\" consumption of the parsed [vehicle.bending] first mode, plus feed-lag, mass-flow-gain, cavitation-compliance, accumulator-compliance, and require_stable parameters; scenario validation rejects malformed or contradictory POGO scalars through unit-suffixed typed fields, the point-mass and rigid-body runners evaluate the feed-system POGO primitive at startup, require_stable rejects non-stable verdicts fail-closed, vehicle_bending mode source fails closed when no [vehicle.bending] block exists, and the no-block path remains inert."
verification = ["V-PROP-019"]

[[requirements]]
id = "REQ-PROP-020"
title = "Propulsion faults can be scheduled deterministically by engine and step"
statement = "A scenario may declare an optional [propulsion.faults] schedule with ordered [[propulsion.faults.rules]] entries carrying unique ids, engine ids, start_step values, and engine fault payloads; scenario validation rejects duplicate rule ids, unknown engine ids, and payloads outside the target engine envelope, EngineCluster exposes id-routed fault injection, and the point-mass and rigid-body runners inject each scheduled fault exactly once before the engine rack step whose kernel step is at or beyond start_step while preserving the no-fault path when the block is omitted."
verification = ["V-PROP-020"]

[[requirements]]
id = "REQ-PROP-021"
title = "Engine faults include deterministic hard-start over-pressure transients"
statement = "EngineFault supports a hard_start_overpressure mode with finite factor at least one and positive duration_s; the liquid-engine model applies the thrust multiplier only while the engine is Igniting and its in-state timer is within duration_s, scenario validation rejects malformed load-time or scheduled payloads, and the runner maps the typed scenario payload into both construction-time faults and [propulsion.faults] scheduled injections."
verification = ["V-PROP-021"]

[[requirements]]
id = "REQ-PROP-022"
title = "Pump cavitation can trigger deterministic one-shot engine faults"
statement = "A scenario may declare [[propulsion.faults.cavitation_rules]] entries keyed by engine id and oxidizer, fuel, or any pump leg; scenario validation rejects duplicate ids, malformed fault payloads, unknown engines, and rules without a matching transient feed-network pump source, the feed-network runner preserves pump NPSH cavitation verdicts as deterministic events, and the point-mass and rigid-body runners inject each matching cavitation fault exactly once before the engine rack step while preserving the no-trigger path when pumps are nominal or absent."
verification = ["V-PROP-022"]

[[requirements]]
id = "REQ-PROP-023"
title = "Mixture-ratio runaway rules drift transient feed-network valve commands"
statement = "A scenario may declare [[propulsion.faults.mixture_ratio_runaway_rules]] entries keyed by engine id and start_step with finite oxidizer and fuel valve-opening drift rates; scenario validation rejects duplicate ids, unknown engines, all-zero rates, and rules without a matching transient_dual_valve_chamber feed network, and the point-mass and rigid-body runners apply the scheduled deterministic drift after controller updates and before each transient feed-network step while clamping valve commands to [0, 1]."
verification = ["V-PROP-023"]

[[requirements]]
id = "REQ-PROP-024"
title = "SIL stimulation can arm scheduled propulsion engine faults"
statement = "A native SIL package run may use SilStimulation to append a scheduled [propulsion.faults] engine rule in memory without modifying package scenario files; the stimulation records the scheduled rule in EvidenceBundle.stimuli, uses the normal scenario parser and validator for engine ids and fault payloads, and produces an observable scheduled hard-off response in rigid-body engine telemetry."
verification = ["V-PROP-024"]

[[requirements]]
id = "REQ-PROP-025"
title = "Monte Carlo fault libraries materialize scheduled propulsion faults"
statement = "The Monte Carlo crate exposes a deterministic PropulsionFaultLibrary with validated scheduled engine-fault templates, per-template activation probabilities keyed by SampleRng, and materialized PropulsionFaultOverlay TOML fragments using the scenario [propulsion.faults] schema; duplicate ids, invalid probabilities, and invalid fault payloads are rejected, and emitted overlays parse through the normal scenario validator."
verification = ["V-PROP-025"]

[[requirements]]
id = "REQ-PROP-026"
title = "SIL observed runs capture closed-loop propulsion fault response"
statement = "A native SIL package run may combine SilStimulation with the estimate-vs-truth monitor; scheduled propulsion faults remain recorded as EvidenceBundle.stimuli, the observed run attaches EKF residual evidence, and a shortened closed-loop TVC engine-out scenario shows the scheduled hard-off reducing terminal thrust and vehicle velocity while preserving parser-validated scenario mutation."
verification = ["V-PROP-026"]

[[requirements]]
id = "REQ-PROP-027"
title = "Monte Carlo propulsion fault campaigns execute sampled overlays"
statement = "The CLI Monte Carlo layer can run a sampled scheduled-propulsion-fault campaign by reading a base scenario and a PropulsionFaultLibrary TOML manifest, materializing deterministic per-sample PropulsionFaultOverlay fragments, parsing each mutated scenario through the normal scenario validator, executing the standard runner, reading a terminal telemetry metric, writing one CSV row per sample with activated fault ids and success state, and summarizing the metric with Welford statistics plus a Clopper-Pearson success interval."
verification = ["V-PROP-027"]

[[requirements]]
id = "REQ-PROP-028"
title = "Liquid engine performance can be derived from thermochemistry"
statement = "The propulsion crate exposes a deterministic liquid-engine performance helper that consumes looked-up thermochemical chamber pressure, ideal c*, gamma, optional empirical c_star_efficiency band, and nozzle geometry, computes nominal and bounded choked throat mass flow from effective c*, solves the existing ideal pressure-thrust nozzle model with optional separation, derives max thrust plus nominal and bounded effective Isp from the same state, validates non-finite and out-of-envelope inputs fail-closed, and can construct a LiquidEngine by replacing only max_thrust_n and nominal isp_s while preserving existing lifecycle and control limits."
verification = ["V-PROP-028"]

[[requirements]]
id = "REQ-PROP-029"
title = "Liquid engine scenarios can consume thermochemistry decks"
statement = "A liquid engine may declare an optional thermochemical_performance block under [[vehicle.assembly.engines]] with throat area, exit area, ambient pressure, and optional nozzle separation; scenario validation requires a SHA-pinnable [propulsion.thermochem] deck lookup when any engine opts in, rejects malformed nozzle scalars fail-closed, keeps the no-block constant-thrust/Isp path unchanged, and the point-mass and rigid-body runners build the engine with deck-derived max thrust, nominal effective-Isp, and choked mass-flow/Isp efficiency envelope through LiquidEnginePerformance."
verification = ["V-PROP-029"]

[[requirements]]
id = "REQ-PROP-030"
title = "Thermochemistry decks carry checked Cantera reference evidence"
statement = "The repository ships provenance-recorded Cantera 3.2.0 LOX/LCH4, LOX/LH2, and LOX/RP-1 n-dodecane-surrogate Schema-1 thermochemistry decks using gri30.yaml and nDodecane_Reitz.yaml, spanning 1-30 MPa chamber pressure and pair-appropriate mixture-ratio bands, plus independent tolerance tables over every grid point and multiple in-deck log-pressure and mixture-ratio interpolation cases; the runner validation harness loads each deck, checks looked-up temperature, gamma, molecular weight, and ideal c* against its table, and checks LiquidEnginePerformance nominal mass flow, mass-flow envelope, sea-level thrust, and nominal Isp against independently generated nozzle references."
verification = ["V-PROP-030"]

[[requirements]]
id = "REQ-SENSOR-001"
title = "IMU truth can opt into force-accumulator specific force"
statement = "The synthetic sensor layer exposes SpecificForceTruth as an additive force-accumulator truth record, schema v3 [sensors.<imu>] may declare specific_force_source = \"force_accumulator\" while non-IMU sensors reject that field and the default remains \"finite_difference\", and the runner's FC bridge uses the opt-in path to fill SensorTruth.specific_force_body_m_s2 from summed non-gravity force divided by mass and to fill angular_acceleration_body_rad_s2 from the rigid moment accumulator and Euler rotational dynamics; point-mass and rigid-body runner paths evaluate the existing force/moment stacks at the bridge tick boundary without extra model evaluation in legacy finite-difference mode. This is a WP-09.1 substrate only: the legacy default, high-rate strapdown increments, and broader WP-09 actuator/navigation work remain open; the rotating-frame closed-form validation source is tracked separately by REQ-SENSOR-002."
verification = ["V-SENSOR-001"]

[[requirements]]
id = "REQ-SENSOR-002"
title = "Stationary rotating-frame IMU truth has a closed-form oracle"
statement = "The openbmp-physics frame layer exposes StationaryRotatingFrameImuTruth and stationary_rotating_frame_imu_truth_eci for a point fixed in a uniformly rotating frame, computing ideal accelerometer specific force as a - g with a = omega x (omega x r) and ideal gyro truth as the frame spin about inertial +z. Schema v3 IMUs may declare specific_force_source = \"stationary_rotating_frame\" while non-IMU sensors reject the field, and the runner FC bridge consumes that source through the scenario FrameContext and sampled gravity vector. The regressions cover the WGS84 equator against mu/a^2 - omega^2 a, project Earth-rate gyro into the KSC local NED frame, reject non-finite position/gravity/spin inputs fail-closed, and run a one-tick rigid-body FC bridge scenario at the WGS84 equator with body axes aligned to local NED to prove body-frame specific force and gyro truth within the WP-09.1 stationary-on-rotating-Earth tolerances. This is a WP-09.1 validation source only: default force-accumulator selection and high-rate strapdown increments remain open."
verification = ["V-SENSOR-002"]

[[requirements]]
id = "REQ-SENSOR-003"
title = "Second-order servo substrate exposes deterministic bandwidth dynamics"
statement = "The openbmp-vehicle effector layer exposes SecondOrderServoParams, SecondOrderServo, RateLimitBacklashDescribingFunction, and rate_limit_backlash_describing_function as scalar actuator primitives and validation evidence with finite natural frequency and damping, command-side rate limiting, command acceleration limiting, backlash dead-zone behavior, position saturation, fixed-step pure-delay latency, and the Jam, Runaway, ReducedRate, Hardover, and Oscillatory fault modes. Oscillatory faults inject a deterministic sinusoidal command offset before normal actuator dynamics and, for RCS effectors, before pulse quantization. The rate-limit/backlash describing-function helper computes a deterministic first-harmonic estimate for the same command-side rate limiter and backlash play operator used before the servo bandwidth model, including output amplitude, gain, phase lag, rate-limited fraction, and backlash-hold fraction. Schema v2+ [[vehicle.assembly.effectors]] blocks may select kind = \"second_order_servo\" with finite positive natural frequency, finite non-negative damping, finite positive command acceleration limit, and finite non-negative backlash half-width bounded by half the authority range, and may declare load-time fault = { kind = \"oscillatory\", amplitude, frequency_hz, phase_rad } with non-negative finite amplitude, positive finite frequency, and finite phase. The runner EffectorRack builds second_order_servo and oscillatory faults through the same command schedule, override, fault, and telemetry path as existing effectors. The regressions prove invalid parameter rejection, closed-form underdamped step response within the WP-09.2 0.5% band, acceleration limiting, backlash hold/engagement, rate-limit/backlash first-harmonic amplitude within the WP-09.2 5% describing-function band, latency delay, jam behavior, deterministic oscillatory injection for linear, second-order, and RCS pulse effectors, scenario parser acceptance/rejection of oscillatory faults, and runner rack mounting of oscillatory faults. RCS minimum-impulse-bit/PWPF is tracked separately, and resonant actuator load extensions remain open."
verification = ["V-SENSOR-003"]

[[requirements]]
id = "REQ-SENSOR-004"
title = "RCS MIB, PWPF, and allocation substrate exposes deterministic pulse primitives"
statement = "The openbmp-vehicle effector layer exposes RcsMinimumImpulseBit, RcsPulse, PwpfParams, PwpfModulator, PwpfStep, PulsePolarity, RcsPulseEffectorParams, RcsPulseEffector, RcsBlowdownParams, RcsThrusterConfig, RcsThrusterBankEffectorParams, RcsThrusterBankEffector, RcsThrusterBankPulse, RcsCoupledThrusterPulse, RcsCoupledAllocation, RcsCoupledAllocator, and RcsError as deterministic fixed-step reaction-control pulse and allocation primitives. RcsMinimumImpulseBit validates finite positive minimum impulse and nominal thrust, emits zero for zero requested impulse, floors any nonzero below-MIB requested impulse to the exact signed MIB, passes above-MIB requested impulse through linearly when it fits within nominal_thrust_n * dt, reports average thrust, on-time, duty cycle, and polarity, and fails closed on non-finite requested impulse or fixed-step capacity overflow. PwpfModulator validates finite positive gain, time constant, and turn-on threshold plus finite non-negative turn-off threshold smaller than turn-on, advances its first-order prefilter with the exact ZOH update, and applies symmetric Schmitt hysteresis for positive, off, and negative pulse polarity. RcsThrusterBankEffector maps scalar direct_torque commands into requested body-axis torque, allocates deterministic declared-order pulses over body-frame thruster geometry, applies each thruster's MIB, optional pressure-fed blowdown scale, and live feed-pressure scale, and reports equivalent direct_torque command units so the existing moment adapter effectiveness remains unchanged. RcsCoupledAllocator maps vector body torque-impulse requests across physical thruster geometry in deterministic declaration order, reports requested, actual, and residual body torque-impulse vectors plus per-thruster pulse telemetry, separates MIB quantization from authority saturation, avoids same-step opposite-thruster chasing of MIB overshoot, and applies optional pressure-fed blowdown plus live feed-pressure scale per thruster. Schema v3 direct_torque effectors may opt into an rcs table with legacy scalar minimum_impulse_n_s, nominal_thrust_n, and optional pwpf parameters; mode = \"bank\" with per-thruster position_body_m, direction_body, MIB, nominal thrust, optional blowdown, optional feed = { tank, specific_impulse_s, pressure_exponent }, and optional pwpf; or mode = \"coupled_bank\" with a shared group id, optional per-member pwpf, an identical physical thruster bank on exactly one roll, pitch, and yaw direct_torque effector, and the same optional per-thruster feed binding. Scenario validation rejects feed bindings with unknown tanks, tanks without ullage, body mismatches when mounted_to is declared, and non-positive Isp or pressure exponent. The runner EffectorRack builds RcsPulseEffector, RcsThrusterBankEffector, or a grouped RcsCoupledAllocator with per-axis PWPF gating while preserving the existing continuous direct_torque path when rcs is absent; physical bank and coupled-bank feed bindings consume live PropellantTankState::blowdown_pressure_scale, derate thruster nominal thrust, report per-tank drain from actual impulse divided by specific impulse and standard gravity, and TankRack::set_rcs_feed_drain_rates applies that drain additively. The regressions prove the exact MIB floor, linear above-floor impulse, signed negative pulse handling, invalid input/capacity rejection, positive PWPF hysteresis, negative PWPF polarity, RcsPulseEffector average-output quantization, bank geometry allocation, blowdown capacity reduction, coupled cross-axis geometry allocation, coupled MIB quantization without saturation, invalid coupled geometry/request rejection, parser acceptance/rejection of scalar, bank, coupled-bank, and RCS tank-feed direct_torque rcs configs including coupled-bank PWPF, and runner rack scalar, bank, coupled-bank MIB quantization, coupled-bank PWPF gating, bank tank-feed thrust derating/drain, and coupled-bank shared tank-feed drain."
verification = ["V-SENSOR-004"]

[[requirements]]
id = "REQ-SENSOR-005"
title = "Synthetic air-data sensor exposes Pitot-static and vane primitives"
statement = "The openbmp-sensors crate exposes AirDataNoiseBudget, SyntheticAirData, pitot_impact_pressure_pa, mach_from_pitot_impact_pressure, calibrated_airspeed_from_impact_pressure, pressure_altitude_from_static_pressure, and vane_angles_from_body_velocity as deterministic WP-09.3 air-data primitives. SensorTruth carries runner-supplied static pressure, atmosphere density, speed of sound, and body-frame air-relative velocity so the synthetic sensor can emit SensorMeasurement::AirData with static pressure, compressible Pitot impact pressure, Mach, calibrated airspeed, true airspeed, alpha, beta, and ISA pressure altitude, while fixed_latency_s reports delayed capture_time through the existing Timestamped adapter on a non-GNSS sensor. Schema validation registers kind = \"airdata\", data/sensors/airdata-textbook.toml provides a zero-noise validated-toy budget, the runner FC bridge can build the sensor from resolved scenario files, openbmp-msgs exposes AirDataSample and FcStepInput::with_airdata publishes it before dispatch, openbmp-fc exposes AirDataIngest and VotedAirDataIngest for simplex and redundant FC ingestion with SensorStatus lane divergence, and openbmp-bridge SensorPacket protocol v4 carries every air-data channel across transport/PIL adapters. The regressions prove subsonic Pitot pressure against closed form, supersonic pressure inversion back to Mach, calibrated airspeed against the sea-level reference, pressure-altitude sea-level inversion, alpha/beta vane recovery from manufactured body-frame velocity, zero-noise measurement output, budget rejection, delayed timestamp reporting, scenario registry acceptance, runner construction, SensorPacket codec round-trip, portable FC step publication, simplex/voted FC air-data ingest, runner bridge packet ingestion, and fc_bridge air-data serialization."
verification = ["V-SENSOR-005"]

[[requirements]]
id = "REQ-SENSOR-006"
title = "Strapdown increment substrate exposes coning/sculling reference math"
statement = "The openbmp-sensors crate exposes InertialIncrement, IncrementQuantization, HighRateImuConfig, InertialTruthSample, ConingScullingAlgo, ConingScullingWindow, quantize_increment_vector, inertial_increment_from_constant_truth, inertial_increment_from_rk4_truth, integrate_constant_truth_window, integrate_rk4_truth_window, coning_sculling_window, and coning_sculling_update as deterministic WP-09.4 strapdown primitives. The substrate validates finite positive sub-intervals, finite truth/increment vectors, finite non-negative delta-theta and delta-v quantization LSBs, positive high-rate sub-sample counts, finite RK4 sample times, and non-empty coning/sculling windows fail-closed. It can generate locked-sequence constant-truth and RK4 time-varying high-rate increment windows, applies deterministic round-to-nearest LSB quantization to delta-theta and delta-v, accumulates adjacent-pair two-sample coning correction, velocity-rotation correction, and manufactured sculling correction, and returns a quaternion attitude update plus corrected body-frame delta-v. SyntheticImu::with_high_rate enables optional high-rate increment-window generation without changing the legacy SensorMeasurement::Imu output, generates the first/non-advancing timestamp window from constant truth, and uses RK4 over linearly interpolated successive runner SensorTruth samples for later advancing timestamps. Schema [sensors.<imu>.high_rate] accepts IMU-only sub_samples plus delta-theta/delta-v LSBs and rejects non-IMU or invalid counts, the runner FC bridge builds configured high-rate IMU sensors from parsed scenarios, openbmp-msgs exposes ImuIncrementWindow / ImuInertialIncrement on the canonical sensor.imu_increments topic, the direct runner FC bus path publishes those windows beside the legacy IMU sample, openbmp-bridge SensorPacket protocol v4 carries ImuIncrementPacket windows through the runner and PIL packet adapters into FcStepInput::with_imu_increment_window before dispatch, and [fc.transport_faults] scalar rules can target per-increment delta-theta components, delta-v components, and increment dt_s by sample index. This is a WP-09.4 partial implementation only: kernel RK-stage truth export, three/four-sample algorithms, and Schuler-period free-INS validation remain open."
verification = ["V-SENSOR-006"]

[[requirements]]
id = "REQ-PLUME-001"
title = "Plume similarity substrate computes live diagnostic state"
statement = "The L2 openbmp-plume crate exposes coordinate-free plume similarity inputs and deterministic PlumeState assembly from freestream, nozzle, and intrinsic cluster-geometry scalars; it computes nozzle pressure ratio, exit-pressure ratio, thrust coefficient, momentum-flux ratio, Prandtl-Meyer initial turn angle, reduced cluster-merge distance and flag, and a PIFS onset flag while validating non-finite and malformed scalar inputs fail-closed and depending on no runner, simulator, mission, or flight-controller crates."
verification = ["V-PLUME-001"]

[[requirements]]
id = "REQ-PLUME-002"
title = "Point-mass solid-motor scenarios can opt into plume telemetry"
statement = "Schema v3 scenarios may declare [aero.plume] as a telemetry-only plume-similarity opt-in without requiring an aerodynamic force source when aero is not active; the point-mass runner validates that opt-in against a runner-sampled atmosphere and a single solid motor, reconstructs chamber state from the pressure-thrust nozzle path, assembles PlumeState from live atmosphere and nozzle state at each row, emits deterministic plume.* telemetry with inactive rows zeroed, and preserves the default channel set when [aero.plume] is absent."
verification = ["V-PLUME-002"]

[[requirements]]
id = "REQ-PLUME-003"
title = "Rigid-body thermochemical liquid-engine scenarios can opt into plume telemetry"
statement = "Schema v3 rigid-body scenarios may declare [aero.plume] with a runner-sampled atmosphere and thermochemical_performance on every liquid engine; the runner retains thermochemical liquid-engine plume metadata, reconstructs live chamber pressure from runtime engine mass-flow snapshots, solves the ideal nozzle at the sampled ambient pressure, aggregates active-engine nozzle state into a PlumeState with summed thrust and exit area, emits deterministic plume.* telemetry with inactive rows zeroed, and preserves the default channel set when [aero.plume] is absent."
verification = ["V-PLUME-003"]

[[requirements]]
id = "REQ-PLUME-004"
title = "Rigid-body plume merge telemetry derives active engine spacing"
statement = "For rigid-body thermochemical liquid-engine plume telemetry, the runner pairs liquid plume metadata with the EngineRack engine ids and body-frame mount points, derives the active center-to-center spacing from the minimum distance between currently firing engines, uses active-engine count and summed exit area when assembling PlumeClusterGeometry, and drives plume.merge_distance_m and plume.cluster_merged from that live cluster geometry instead of the static [aero.plume].center_spacing_m declaration."
verification = ["V-PLUME-004"]

[[requirements]]
id = "REQ-PLUME-005"
title = "Plume telemetry remains byte-identical when not declared"
statement = "Point-mass and rigid-body runners must keep canonical telemetry bytes unchanged when a scenario has no [aero.plume] block, including the compatible case where an otherwise unused [aero] block is present; in that state the runner must allocate no plume.* channels, build no plume evaluator, and preserve the baseline canonical CSV byte stream."
verification = ["V-PLUME-005"]

[[requirements]]
id = "REQ-PLUME-006"
title = "Point-mass plume geometry derives from the solid motor"
statement = "For point-mass solid-motor plume telemetry, the runner must derive the PlumeClusterGeometry engine count, total exit area, and center spacing from the single solid motor instead of trusting the compatibility fields in [aero.plume]: engine_count is one, exit_area_total_m2 is the motor nozzle exit area, center_spacing_m is zero, and valid but misleading static [aero.plume] geometry values cannot change the canonical plume telemetry byte stream."
verification = ["V-PLUME-006"]

[[requirements]]
id = "REQ-PLUME-007"
title = "Plume momentum-flux ratio follows the documented similarity equation"
statement = "The openbmp-plume PlumeState momentum_flux_ratio diagnostic must implement the WP-15.1 similarity equation as total nozzle thrust divided by rho_inf * V_inf^2 * S_ref, using the runner-provided dynamic pressure as one half rho_inf * V_inf^2; the value must include pressure thrust through total_thrust_n, use reference_area_m2 rather than nozzle exit area in the denominator, and reject non-finite results fail-closed through PlumeState validation."
verification = ["V-PLUME-007"]


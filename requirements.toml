[[requirements]]
id = "REQ-COMM-001"
title = "The communications substrate exposes ground-site visibility and pass geometry"
statement = "The workspace contains an openbmp-comm L3 crate registered in the workspace and independent of openbmp-fc; it exposes WGS84 GeodeticPosition conversion to ECEF, GroundSite line-of-sight observations with slant range, range rate, azimuth, elevation, and visibility against a site elevation floor plus optional azimuth-binned MaskDeck terrain masks, and deterministic visibility_events / pass_intervals extraction over strictly time-ordered single-site samples with byte-stable CSV pass-table serialization. The crate parses a provenance-recorded data/comm/geometric-visibility-oracle-v1.toml tolerance table and checks point geometry plus fixed-Earth line-scan rise/set extraction against that repository-local analytic oracle, and parses data/comm/sgp4-visibility-oracle-v1.toml to check OpenBMP fixed-step rise/set extraction against bisection-refined SGP4/TLE LEO visibility crossings from the external sgp4 2.4.0 library. The schema-v3 [comm] / [[comm.sites]] parser surface accepts site ids, latitude_deg, longitude_deg, altitude_m, min_elevation_deg, and optional terrain_mask bins while rejecting v2 declarations and out-of-range fields fail-closed. The runner converts sampled point-mass and rigid-body primary ECI truth states through the active FrameContext, accumulates site observations, exposes deterministic pass-table bytes through RunOutcome.comm, and publishes per-site comm.<site>.slant_range_m, range_rate_m_s, elevation_rad, azimuth_rad, mask_elevation_rad, and visible telemetry channels for [comm] scenarios. This closes WP-20.1 only; link budgets, packet effects, blackout, station networks, tracking observables, and frame-shaped stream export remain later WP-20 work."

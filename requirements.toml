title = "HIL bridge lockstep messages are versioned and step-matched"
statement = "The optional in-house HIL bridge schema carries a versioned hello, sensor/command/ack/fault messages, validators that reject command or acknowledgement packets whose step or simulation timestamp does not match the outstanding sensor frame, and a simulator-side lockstep master that emits fail-closed fault packets on invalid peer responses."
verification = ["V-HIL-001"]

[[requirements]]
id = "REQ-HIL-002"
title = "HIL bridge transports preserve message boundaries"
statement = "The optional in-house HIL bridge exposes a message-level Transport trait, an in-process endpoint pair, a Read+Write stream transport, a split Read/Write stream transport for child stdio, TCP loopback listener/connect helpers, and Unix-domain-socket helpers on Unix platforms that exchange whole BridgeMessage values with length-prefixed postcard framing, close reporting, and payload-size limits while still shipping no real bus protocol or device driver."

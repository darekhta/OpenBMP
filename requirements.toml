[[requirements]]
id = "REQ-COMM-003"
title = "The communications substrate evaluates link budgets and FER curves"
statement = "The openbmp-comm crate exposes a WP-20.3 link-budget substrate: LinkBudgetInput validates per-link EIRP, receiver G/T, slant range, carrier frequency, bit rate, required Eb/N0, nonnegative loss terms, visibility, and blackout flags; free_space_path_loss_db computes deterministic free-space loss; evaluate_link_budget applies the locked dB operand order to produce LinkState fields for free-space loss, C/N0, Eb/N0, margin, FER, visibility, and blackout; FerCurveDeck validates monotone coded-performance samples then performs log-linear FER interpolation while failing closed outside the sampled Eb/N0 envelope; and ElevationLossDeck validates elevation-indexed nonnegative atmospheric/rain loss samples with fail-closed interpolation. The repository records data/comm/link-budget-fer-v1.toml, data/comm/attenuation-loss-v1.toml, data/comm/antenna-link-budget-v1.toml, and provenance for synthetic S-band budget/FER, elevation-loss, and antenna-link fixtures that prove arithmetic, interpolation, monotonicity, no-link FER behavior, additive atmospheric/rain loss application, antenna gain application to EIRP, body-mask visibility gating, and out-of-envelope rejection. The schema-v3 [comm] surface accepts [[comm.links]] budget constants, fer_curve_deck/fer_curve_deck_sha256 pins, optional atmospheric_loss_deck/atmospheric_loss_deck_sha256 pins, and optional rain_loss_deck/rain_loss_deck_sha256 pins, validates site/antenna references fail-closed, resolves/hashes those decks through Scenario::resolved_files_with_reader, and the point-mass/rigid-body runner paths load those decks, resolve the referenced antenna decks, and publish comm.link.<link>.free_space_loss_db, .c_n0_dbhz, .eb_n0_db, .margin_db, .fer, .visible, .blackout, .antenna_gain_dbi, and .body_blocked telemetry channels. This is a WP-20.3 partial implementation only: blackout attenuation and packet-effect integration remain open."
verification = ["V-COMM-003"]


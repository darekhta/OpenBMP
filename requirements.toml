[[requirements]]
id = "REQ-WEB-001"
title = "The runner exposes a steppable session byte-identical to the one-shot run"
statement = "The openbmp-runner crate exposes a Session API (prepare, step, finish) over the rigid-body path whose session-stepped runs produce byte-identical telemetry tables, SHA-256 telemetry digests, final step/time, and actuator command streams to the one-shot run() of the same scenario, implemented by construction over the same loop state, rejecting non-rigid-body scenarios fail-closed, while making no claim that the point-mass path is session-hosted."
verification = ["V-WEB-001"]

[[requirements]]
id = "REQ-WEB-002"
title = "Session malfunction stimuli are deterministic, effective, and fail-closed"
statement = "The runner Session accepts deterministic runtime malfunction stimuli — scheduled engine faults reusing the propulsion scheduled-fault queue, sensor outage windows that withhold measurements after the read so sensor noise streams stay byte-identical, and a wind override replacing the per-tick kernel wind sample — that demonstrably change the run (engine Failed lifecycle and zero thrust; estimator dead-reckoning divergence; navigation-steered trajectory change), reproduce byte-identically when the same stimulus timeline is replayed, and reject unknown engines, unknown sensors, and empty windows fail-closed, while adding no host command that steers guidance, navigation, or control."
verification = ["V-WEB-002"]

[[requirements]]
id = "REQ-WEB-003"
title = "The web host embeds canonical scenarios with pinned fidelity and replayable stimulus timelines"

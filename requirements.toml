[[requirements]]
id = "REQ-COMM-004"
title = "The communications substrate maps link state to deterministic packet effects"
statement = "The openbmp-comm crate exposes a WP-20.4 link-channel packet-effect substrate: LinkChannelModel validates a finite non-negative processing delay and packet error action, LinkPacketContext keys each packet by scenario seed, step, stable link stream id, packet index, direction, and slant range, LinkPacketEffect reports propagation delay, processing delay, total latency, deterministic FER draw evidence, and packet disposition, link_stream_id_from_id provides a stable per-link stream id, no-visibility or blackout LinkState drops packets fail-closed without drawing, and physical-link FER draws are generated from a domain-keyed DeterministicRng stream to produce deliver, drop, or bit-flip dispositions. LinkLossRateGate and evaluate_link_loss_rate_gate evaluate deterministic packet streams and gate observed dropped-or-corrupted packet counts against a two-sided exact binomial acceptance interval for the expected FER, treating no-visibility or blackout as expected 100% errored packets. The repository records data/comm/link-channel-model-v1.toml and provenance for a synthetic packet-effect fixture that proves one-way light-time latency, declared processing delay addition, deterministic repeated draws, no-link drop behavior, validation failures, packet-index/domain separation, and bit-flip error action. The schema-v3 [comm] surface accepts bridge_link_selection = \"first_declared\" or \"best_margin\", optional non-negative bridge_link_hysteresis_db, [[comm.links]].packet_processing_delay_s, packet_error_action = { kind = \"drop\" } or { kind = \"bit_flip\", mask = <nonzero> }, optional packet_loss_rate_gate = { packet_count = <1..1000000>, alpha = <0..1> }, and optional positive data_loss_timeout_s, validates negative hysteresis, negative delay, zero masks, invalid packet counts, invalid alpha, and non-positive timeouts fail-closed, and the runner validates those declarations through LinkChannelModel while reporting packet_processing_delay_s, packet_error_action, packet_error_bit_flip_mask, downlink/uplink packet_loss_rate_gate evidence, and downlink data_loss_timeout latch evidence in RunOutcome.comm link reports. The runner stores the latest comm observation, evaluates the selected comm link for FC bridge sensor and command frames, preserves first-declared fail-closed behavior by default, can select the visible non-blackout declared link with the highest current margin under bridge_link_selection = \"best_margin\", retains the active visible non-blackout link while the best candidate remains inside bridge_link_hysteresis_db, preserves zero-hysteresis greedy tie-break behavior, queues delivered frames by step-quantized downlink/uplink latency, preserves direct-vs-transport determinism for zero-step delivered comm links, and fails closed at the [fc.transport] seam on drop or bit-flip packet effects before configured transport faults. This is a WP-20.4 partial implementation only: blackout attenuation remains open, while declared pass-plan handover and relay composition are tracked by REQ-COMM-005."
verification = ["V-COMM-004"]


[[requirements]]
id = "REQ-COMM-002"
title = "The communications substrate exposes antenna gain and body-mask decks"
statement = "The openbmp-comm crate exposes a WP-20.2 antenna/body-mask substrate: AntennaGainDeck validates an axisymmetric boresight plus strictly increasing off-boresight gain samples and interpolates dBi gain for body-frame directions; BodyMaskDeck validates or precomputes body-frame occlusion samples from BodyMaskTriangle direct ray casts, exposes allocation-free nearest-direction runtime lookup, rejects degenerate vectors/triangles fail-closed, and computes a deterministic SHA-256 deck digest bound to a supplied mesh hash. The repository records data/comm/antenna-body-mask-v1.toml, data/comm/antenna-link-budget-v1.toml, and provenance for synthetic gain/intersection fixtures that prove interpolation values, direct triangle mask precompute, runtime lookup, stable deck hashing, and link-budget application. The schema-v3 [comm] surface accepts [[comm.antennas]] entries with optional gain_deck/body_mask_deck paths plus gain_deck_sha256/body_mask_deck_sha256 pins, rejects duplicate antenna ids and orphan pins fail-closed, and resolves/hashes those files through the standard Scenario::resolved_files_with_reader mechanism. The runner point-mass and rigid-body paths parse declared comm antenna decks from the resolved byte map, validate gain/body-mask data through openbmp-comm constructors, precompute body masks, report resolved file hashes, derived body-mask hashes, and sample counts in RunOutcome.comm, rotate vehicle-to-site line of sight into the body frame, add sampled antenna gain to link EIRP, gate link visibility when the body-mask lookup is blocked, and publish comm.link.<link>.antenna_gain_dbi plus comm.link.<link>.body_blocked telemetry. This is a WP-20.2 partial implementation only: doc-03 watertight mesh/BVH integration and real mesh-derived regeneration tooling remain open."

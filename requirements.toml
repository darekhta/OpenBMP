schema_version = 1

[[requirements]]
id = "REQ-SIL-001"
title = "FC-owned mission decisions use the estimated-state commander"
statement = "When mission authority belongs to the flight controller, mission events and mission actions are evaluated by the commander on bus-published estimated state; the simulator kernel does not re-evaluate them on truth."
verification = ["V-SIL-001", "V-SIL-002"]

[[requirements]]
id = "REQ-SIL-002"
title = "FC scenarios reject ideal truth sensors"
statement = "A scenario that declares a flight-controller block must not use an ideal-state sensor, because that bypasses the SIL sensor boundary."
verification = ["V-SIL-003"]

[[requirements]]
id = "REQ-SIL-003"
title = "Propellant depletion is visible to the commander"
statement = "The commander reads onboard PropellantState mass fraction when evaluating mass-fraction mission triggers."
verification = ["V-SIL-004"]

[[requirements]]
id = "REQ-SIL-004"
title = "Unsupported FC relative-navigation triggers fail closed"
statement = "A flight-controller-owned mission must reject relative-distance or relative-speed triggers until an onboard relative-navigation observable is wired, so simulator truth-relative maps cannot silently drive FC mission decisions."
verification = ["V-SIL-005"]

[[requirements]]
id = "REQ-SCHED-001"
title = "FC job rates and budgets are declarative I-loads"
statement = "Estimator, guidance, commander, autopilot, mixer, health, and FDIR rates and declared budgets are configurable through the scenario FC scheduler block with validated positive values."
verification = ["V-SCHED-001", "V-SCHED-002"]

[[requirements]]
id = "REQ-SCHED-002"
title = "Scheduler budget overruns are health and FDIR visible"
statement = "A scheduler budget overrun publishes an overrun event; sustained overrun bursts set the health failsafe flag and FDIR can latch the scheduler-overrun fault bit."
verification = ["V-SCHED-003"]

[[requirements]]
id = "REQ-RT-001"
title = "Known FC tick allocation regressions are guarded"
statement = "The scheduler dispatch hot path must use a registration-time cached order rather than sorting or collecting per tick, the commander tick must not clone the full mission binding table each tick, and voted sensor ingest jobs must reuse scratch buffers instead of allocating them per tick."
verification = ["V-RT-001"]

[[requirements]]
id = "REQ-BUS-001"
title = "Canonical FC topics have static bus indices"
statement = "Every canonical flight-controller topic exposes a stable compile-time topic-table index for static bus dictionaries and downstream fixed-storage backends."
verification = ["V-BUS-001"]

[[requirements]]
id = "REQ-ILOAD-001"
title = "Flight I-load blobs are versioned and integrity checked"
statement = "A serialized flight I-load is wrapped in a fixed envelope with a schema version, payload length, CRC-32 integrity check, and primary/fallback validation path."
verification = ["V-ILOAD-001"]

[[requirements]]
id = "REQ-NAV-001"
title = "High-dynamics navigation process noise is phase driven"
statement = "The EKF applies the high-dynamics position and velocity process-noise scale only when the commander-published estimator-regime state is boost mode."
verification = ["V-NAV-001", "V-NAV-002", "V-NAV-003"]

[[requirements]]
id = "REQ-FDIR-001"
title = "Estimator lane failover is visible to FDIR"
statement = "When a multi-lane estimator switches away from the primary lane or loses all lanes, it publishes lane-selection status and FDIR latches an estimator-lane failover fault bit."
verification = ["V-FDIR-001"]

[[requirements]]
id = "REQ-FDIR-002"
title = "HAL sensor read failures surface as FDIR sensor faults"
statement = "Sensor ingest publishes unhealthy samples when a HAL or synthetic sensor read fails; the health monitor turns unhealthy samples into failsafe flags and FDIR latches the corresponding sensor fault bit."
verification = ["V-FDIR-002"]

[[requirements]]
id = "REQ-FDIR-003"
title = "FDIR redlines are declarative I-load watchpoints"
statement = "A scenario can declare FDIR redline watchpoints; the runner maps them into FdirParams and the FDIR job latches a fault bit when the watched estimate exceeds the limit."
verification = ["V-FDIR-003"]

[[requirements]]
id = "REQ-HAL-001"
title = "Shared and flight-math contracts compile without std"
statement = "The shared core, state, model, mission, HAL, bare sensor-trait, no_std flight-math physics, propulsion core, aerodynamics core, and alloc-aware flight controller crates compile for the embedded thumb target with default features disabled."
verification = ["V-HAL-001"]

[[requirements]]
id = "REQ-HAL-002"
title = "HAL provides a no-heap static bus contract"
statement = "The HAL crate exposes a fixed-capacity latest-value StaticBus keyed by Topic::INDEX and backed by explicit payload encoders rather than TypeId, Any, or heap storage."
verification = ["V-HAL-002"]

[[requirements]]
id = "REQ-HAL-003"
title = "HAL adopter contract is documented"
statement = "The repository documents the HAL boundary, the single-threaded lockstep stance, sensor-error-to-FDIR mapping, I-load/storage contract, dual-use limits, and the current PIL/HIL limits for downstream adopters."
verification = ["V-HAL-003"]

[[requirements]]
id = "REQ-HAL-004"
title = "HAL flight records are bounded and integrity checked"
statement = "The HAL crate exposes a fixed flight-recorder frame format with version, record kind, sequence, timestamp, payload length, CRC-32, and a no-heap queue with explicit overflow policy."
verification = ["V-HAL-004"]

[[requirements]]
id = "REQ-HIL-001"
title = "HIL bridge lockstep messages are versioned and step-matched"
statement = "The optional in-house HIL bridge schema carries a versioned hello, sensor/command/ack/fault messages, and validators that reject command or acknowledgement packets whose step or simulation timestamp does not match the outstanding sensor frame."
verification = ["V-HIL-001"]

[[requirements]]
id = "REQ-DUAL-001"
title = "Forward-only dual-use boundary is mechanically guarded"
statement = "Flight-controller and board-facing code must not reach offline free-flight footprint capabilities, expose target-like footprint input fields, or emit footprint Monte-Carlo output names that frame nominal-relative dispersion as target accuracy."
verification = ["V-DUAL-001", "V-DUAL-002", "V-DUAL-003"]

[[requirements]]
id = "REQ-GOV-001"
title = "Safety gates have protected review ownership"
statement = "Repository governance documents require protected branch status checks and code-owner review for safety and dual-use changes, including maintainer and solo-author changes."
verification = ["V-GOV-001"]

[[requirements]]
id = "REQ-TRACE-001"
title = "Requirements and verification evidence remain linked"
statement = "Every requirement in this register has verification evidence, and every verification item points back to at least one valid requirement."
verification = ["V-TRACE-001"]

[[requirements]]
id = "REQ-DET-001"
title = "Telemetry diffs can emit determinism provenance"
statement = "The diff tool can write a machine-readable report containing the comparison result, first divergence if present, host/toolchain provenance, floating-point contract, and Parquet archive metadata."
verification = ["V-DET-001"]

[[requirements]]
id = "REQ-STD-001"
title = "Standards posture avoids certification overclaim"
statement = "The repository documents that upstream OpenBMP uses civil aerospace and simulation standards as vocabulary and evidence organization only; certification, qualification, real-time proof, and export-control posture are re-earned by downstream real-vehicle forks."
verification = ["V-STD-001"]

[[requirements]]
id = "REQ-CONFORM-001"
title = "A fork-runnable conformance entry point exists"
statement = "The CLI exposes a conformance command that validates and runs one or more scenarios without writing telemetry, so downstream forks can smoke-test the shared scenario and runner path."
verification = ["V-CONFORM-001"]

[[requirements]]
id = "REQ-MC-001"
title = "Seeded Monte-Carlo evidence has a visible CI lane"
statement = "The repository exposes a scheduled or manually runnable CI lane for the seeded footprint and ascent Monte-Carlo checks, so dispersion acceptance evidence is reproducible outside ad hoc local runs."
verification = ["V-MC-001"]


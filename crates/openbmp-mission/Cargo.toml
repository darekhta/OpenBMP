[package]
name                    = "openbmp-mission"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP mission graph + event triggers — hardware-portable; no simulator dependency."

[features]
default = ["std"]
std     = ["openbmp-core/std"]

[dependencies]
openbmp-core = { version = "0.0.1", path = "../openbmp-core", default-features = false }
thiserror    = { version = "2.0.18", default-features = false }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package]
name                    = "openbmp-physics"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP HAL-portable physics: gravity, atmosphere, magnetic, wind, constants."

[features]
# `GustWind` (Dryden filter driven by `DeterministicRng`).
# Default-on for the simulator binary; hardware adopters disable
# via `default-features = false`.
default   = ["std", "synthetic"]
std       = [
    "nalgebra/std",
    "num-traits/std",
    "openbmp-core/std",
    "dep:sgp4",
    "sgp4/std",
    "thiserror/std",
]
synthetic = []

[dependencies]
nalgebra          = { version = "0.34.2", default-features = false, features = ["libm"] }
num-traits        = { version = "0.2.19", default-features = false, features = ["libm"] }
openbmp-core      = { version = "0.0.1", path = "../openbmp-core", default-features = false }
openbmp-uq        = { version = "0.0.1", path = "../openbmp-uq", default-features = false }
sgp4              = { version = "2.4.0", default-features = false, optional = true }
static_assertions = { workspace = true }
thiserror         = { version = "2.0.18", default-features = false }

[dev-dependencies]
approx              = { workspace = true }
openbmp-aero        = { workspace = true }
openbmp-aerothermal = { workspace = true }
proptest            = { workspace = true }
sha2                = { workspace = true }
toml                = { workspace = true }

[lints]
workspace = true

# Phase-3.6 parser fixture: engine cluster + a mission event whose
# action is a typed `engine_command` referencing the declared engine
# by id. Synthetic; not a benchmark.

openbmp.scenario = 1

[meta]
name        = "assembly-engine-cluster-with-engine-command-fixture"
description = "Phase-3.6 parser fixture exercising the typed engine_command mission action. Synthetic; not a benchmark."
validation  = "experimental"

[time]
start_s = 0.0
stop_s  = 1.0
dt_s    = 0.001
seed    = 0xdead_beef

[vehicle]
kind                     = "point_mass"
mass_kg                  = 1.0
initial_position_eci_m   = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id             = "two-engine-cluster"
cluster_layout = "ring"

[[vehicle.assembly.bodies]]
id            = "main"
geometry      = { kind = "reference", length_m = 1.0, area_m2 = 0.5 }
dry_mass_kg   = 1.0

[[vehicle.assembly.engines]]
id                  = "engine_a"
kind                = { kind = "liquid_engine" }
mount_point_body_m  = [0.5, 0.0, 0.0]
limits              = { max_thrust_n = 1000.0, isp_s = 250.0, ignition_transient_s = 0.1, shutdown_transient_s = 0.1, max_gimbal_rad = 0.087 }

[[vehicle.assembly.engines]]
id                  = "engine_b"
kind                = { kind = "liquid_engine" }
mount_point_body_m  = [-0.5, 0.0, 0.0]
limits              = { max_thrust_n = 1000.0, isp_s = 250.0, ignition_transient_s = 0.1, shutdown_transient_s = 0.1, max_gimbal_rad = 0.087 }

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "none"
wind          = "none"

[forces]
models = ["gravity", "thrust"]

[telemetry]
output.csv = "out/fixture.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

[mission]
initial_phase = "ascent"

[[mission.phases]]
id    = "ascent"
label = "ascent"

[[mission.events]]
id      = "evt"
trigger = { kind = "at_apogee" }
action  = { kind = "engine_command", id = "engine_a", command = { throttle_unit = 0.5, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }

# Phase-3.3 assembly-tree parser fixture exercising the
# UnsupportedAssemblyChild deferral for `[[vehicle.assembly.engines]]`.
# Phase 3.6 will land the engine cluster; in 3.3 the parser rejects.

openbmp.scenario = 1

[meta]
name        = "assembly-deferred-engines-fixture"
description = "Phase-3.3 parser fixture; rejects [[vehicle.assembly.engines]] until Phase 3.6. Synthetic; not a benchmark."
validation  = "experimental"

[time]
start_s = 0.0
stop_s  = 1.0
dt_s    = 0.01
seed    = 0xdead_beef

[vehicle]
kind                     = "point_mass"
mass_kg                  = 0.080
initial_position_eci_m   = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]

[[vehicle.assembly.bodies]]
id           = "main"
geometry     = { kind = "cylinder", length_m = 0.56, diameter_m = 0.029 }
dry_mass_kg  = 0.080

# Future Phase-3.6 child — should be rejected at parse time in 3.3.
[[vehicle.assembly.engines]]
id = "main_engine"

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "none"
wind          = "none"

[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/fixture.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

# Assembly-tree parser fixture retained as an ignored
# historical flat/assembly rigid-inertia consistency case. Synthetic;
# not a benchmark.

openbmp.scenario = 2

[meta]
name        = "assembly-rigid-inertia-mismatch-fixture"
description = "Parser fixture retained as an ignored historical rigid-inertia consistency case. Synthetic; not a benchmark."
validation  = "experimental"

[time]
start_s = 0.0
stop_s  = 1.0
dt_s    = 0.01
seed    = 0xdead_beef

[vehicle]
kind                                  = "rigid_body"
initial_position_eci_m                = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s              = [0.0, 0.0, 0.0]
initial_quaternion_body_to_eci_xyzw   = [0.0, 0.0, 0.0, 1.0]
initial_angular_velocity_body_rad_s   = [0.0, 0.0, 0.0]
[vehicle.assembly]

[[vehicle.assembly.bodies]]
id                         = "main"
geometry                   = { kind = "cylinder", length_m = 0.56, diameter_m = 0.029 }
dry_mass_kg                = 0.080
dry_inertia_body_kg_m2     = [[0.02, 0.0, 0.0], [0.0, 0.02, 0.0], [0.0, 0.0, 0.002]]

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "none"
wind          = "none"

[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/fixture.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

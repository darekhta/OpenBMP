# Assembly-tree parser fixture retained as an ignored
# historical cross-consistency case.
#
# The flat vehicle dry-mass field was retired, so this TOML now
# parses as an ordinary two-body assembly. The ignored test documents
# the deleted v1 consistency check. Synthetic; not a benchmark.

openbmp.scenario = 2

[meta]
name        = "assembly-mass-mismatch-fixture"
description = "Parser fixture retained as an ignored historical mass-consistency case. Synthetic; not a benchmark."
validation  = "experimental"

[time]
start_s = 0.0
stop_s  = 1.0
dt_s    = 0.01
seed    = 0xdead_beef

[vehicle]
kind                     = "point_mass"
initial_position_eci_m   = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id = "two-body-mismatch"

[[vehicle.assembly.bodies]]
id           = "main"
geometry     = { kind = "cylinder", length_m = 0.56, diameter_m = 0.029 }
dry_mass_kg  = 0.080

[[vehicle.assembly.bodies]]
id           = "fairing"
geometry     = { kind = "cone", length_m = 0.05, base_diameter_m = 0.029 }
dry_mass_kg  = 0.005

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "none"
wind          = "none"

[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/fixture.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

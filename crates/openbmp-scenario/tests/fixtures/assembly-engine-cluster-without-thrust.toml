# Phase-3.6 negative parser fixture: engine cluster declared without
# `forces.models = ["thrust"]`. Used for
# `rejects_engine_cluster_without_thrust_force_model`.

openbmp.scenario = 1

[meta]
name        = "assembly-engine-cluster-without-thrust-fixture"
description = "Phase-3.6 negative parser fixture: engines declared but thrust force omitted."
validation  = "experimental"

[time]
start_s = 0.0
stop_s  = 1.0
dt_s    = 0.001
seed    = 0xdead_beef

[vehicle]
kind                     = "point_mass"
mass_kg                  = 1.0
initial_position_eci_m   = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id             = "two-engine-cluster"
cluster_layout = "ring"

[[vehicle.assembly.bodies]]
id            = "main"
geometry      = { kind = "reference", length_m = 1.0, area_m2 = 0.5 }
dry_mass_kg   = 1.0

[[vehicle.assembly.engines]]
id                  = "engine_a"
kind                = { kind = "liquid_engine" }
mount_point_body_m  = [0.5, 0.0, 0.0]
limits              = { max_thrust_n = 1000.0, isp_s = 250.0, ignition_transient_s = 0.1, shutdown_transient_s = 0.1, max_gimbal_rad = 0.087 }

[[vehicle.assembly.engines]]
id                  = "engine_b"
kind                = { kind = "liquid_engine" }
mount_point_body_m  = [-0.5, 0.0, 0.0]
limits              = { max_thrust_n = 1000.0, isp_s = 250.0, ignition_transient_s = 0.1, shutdown_transient_s = 0.1, max_gimbal_rad = 0.087 }

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "none"
wind          = "none"

[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/fixture.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

[package]
name                    = "openbmp-thermochem"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP thermochemistry deck ingestion and deterministic interpolation."

[features]
default = ["std", "parser"]
std     = ["openbmp-core/std", "serde?/std", "thiserror/std", "toml?/std"]
parser  = ["std", "dep:serde", "dep:toml"]

[dependencies]
openbmp-core = { version = "0.0.1", path = "../openbmp-core", default-features = false }
serde        = { version = "1.0.228", default-features = false, optional = true, features = ["derive"] }
thiserror    = { version = "2.0.18", default-features = false }
toml         = { version = "1.1.2", default-features = false, optional = true, features = ["parse", "serde"] }

[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true

# Synthetic; not a benchmark. WGS84 placeholders are filled from canonical constants.

openbmp.scenario = 3

[meta]
name = "sil-afts-stimulus-test"
description = "Synthetic point-mass SIL AFTS stimulation regression."
validation = "validated-toy"

[time]
start_s = 0.0
stop_s = 0.1
dt_s = 0.1
seed = 21

[vehicle]
kind = "point_mass"
initial_position_eci_m = [6379137.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id = "sil-afts-stimulus-test"

[[vehicle.assembly.bodies]]
id = "body"
geometry = { kind = "reference", length_m = 1.0, area_m2 = 1.0 }
dry_mass_kg = 1.0
dry_cg_body_m = [0.0, 0.0, 0.0]

[environment]
frame_profile = "toy-fixed-earth"
gravity = "point_mass"
mu_m3_s2 = "@WGS84_MU_M3_S2@"
atmosphere = "none"
wind = "none"

[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/sil-afts-stimulus-test.csv"

[validation]
require_finite_state = true
require_monotonic_time = true

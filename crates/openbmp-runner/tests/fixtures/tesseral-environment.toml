# Synthetic; not a benchmark. WGS84 placeholders are filled from canonical constants.

openbmp.scenario = 3

[meta]
name = "tesseral-environment-test"
description = "Synthetic runtime-environment tesseral gravity test."
validation = "validated-toy"
provenance = "synthetic runner unit test"

[time]
start_s = 0.0
stop_s = 1.0
dt_s = 1.0
seed = 1

[vehicle]
kind = "point_mass"
initial_position_eci_m = [6900000.0, 400000.0, 300000.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id = "tesseral-environment-test"

[[vehicle.assembly.bodies]]
id = "mass"
geometry = { kind = "reference", length_m = 1.0, area_m2 = 1.0 }
dry_mass_kg = 1.0
dry_cg_body_m = [0.0, 0.0, 0.0]

[environment]
frame_profile = "wgs84-uniform-rotation"
gravity = "tesseral"
mu_m3_s2 = "@WGS84_MU_M3_S2@"
r_e_m = "@WGS84_A_M@"
tesseral_degree = 2
tesseral_order = 2
tesseral_c20 = "@NEG_WGS84_J2@"
tesseral_c21 = 2.0e-7
tesseral_s21 = -3.0e-7
tesseral_c22 = 1.0e-7
tesseral_s22 = -2.0e-7
atmosphere = "none"
wind = "none"

[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/tesseral-environment-test.csv"

[validation]
require_finite_state = true
require_monotonic_time = true

[package]
name                    = "openbmp-runner"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP scenario runner: builds and drives the simulation kernel from a parsed scenario."

[lib]
name = "openbmp_runner"
path = "src/lib.rs"

[features]
default     = []
l1-adaptive = ["openbmp-fc/l1-adaptive"]
lqr         = ["openbmp-fc/lqr"]
indi        = ["openbmp-fc/indi"]
mpc         = ["openbmp-fc/mpc"]

[dependencies]
nalgebra            = { workspace = true }
openbmp-aero        = { workspace = true }
openbmp-aerothermal = { workspace = true }
openbmp-bridge      = { workspace = true }
openbmp-contact     = { workspace = true }
openbmp-core        = { workspace = true }
openbmp-feedsystem  = { workspace = true }
openbmp-fc          = { workspace = true }
openbmp-mission     = { workspace = true }
openbmp-mc          = { workspace = true }
openbmp-multibody   = { workspace = true }
openbmp-physics     = { workspace = true }
openbmp-plume       = { workspace = true }
openbmp-propulsion  = { workspace = true }
openbmp-rt          = { workspace = true }
openbmp-scenario    = { workspace = true }
openbmp-sensors     = { workspace = true, features = ["synthetic"] }
openbmp-sim         = { workspace = true }
openbmp-state       = { workspace = true }
openbmp-telemetry   = { workspace = true }
openbmp-thermochem  = { workspace = true }
openbmp-vehicle     = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
sha2                = { workspace = true }
thiserror           = { workspace = true }
toml                = { workspace = true }
uom                 = { workspace = true }

[dev-dependencies]
approx          = { workspace = true }
openbmp-testkit = { workspace = true }

[lints]
workspace = true

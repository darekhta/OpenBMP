[package]
name                    = "openbmp-afts"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP forward AFTS instantaneous-impact-point containment monitor."

[features]
default = ["std"]
std     = ["openbmp-core/std", "openbmp-physics/std", "openbmp-state/std", "thiserror/std"]

[dependencies]
num-traits      = { version = "0.2.19", default-features = false, features = ["libm"] }
openbmp-core    = { version = "0.0.1", path = "../openbmp-core", default-features = false }
openbmp-physics = { version = "0.0.1", path = "../openbmp-physics", default-features = false }
openbmp-state   = { version = "0.0.1", path = "../openbmp-state", default-features = false }
thiserror       = { version = "2.0.18", default-features = false }

[dev-dependencies]
approx = { workspace = true }
toml   = { workspace = true }
uom    = { workspace = true }

[lints]
workspace = true

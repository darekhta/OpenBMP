[package]
name                    = "openbmp-propulsion"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP propulsion: motor models, thrust curves (in-house RASP-shaped TOML format)."

[features]
default = ["std", "parser"]
std     = ["nalgebra/std", "num-traits/std", "openbmp-core/std", "serde?/std", "thiserror/std", "toml?/std"]
parser  = ["std", "dep:serde", "dep:toml"]

[dependencies]
nalgebra      = { version = "0.35.0", default-features = false, features = ["libm"] }
num-traits    = { version = "0.2.19", default-features = false, features = ["libm"] }
openbmp-core  = { version = "0.0.1", path = "../openbmp-core", default-features = false }
serde         = { version = "1.0.228", default-features = false, optional = true, features = ["derive"] }
thiserror     = { version = "2.0.18", default-features = false }
toml          = { version = "1.1.2", default-features = false, optional = true, features = ["parse", "serde"] }

[dev-dependencies]
approx   = { workspace = true }
proptest = { workspace = true }
sha2     = { workspace = true }

[lints]
workspace = true

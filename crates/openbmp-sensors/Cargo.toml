[package]
name                    = "openbmp-sensors"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP synthetic sensors and fault models. No device drivers."

[features]
# Synthetic noise infrastructure (the truth-driven
# `SyntheticSensor` implementations and their `DeterministicRng`
# dependency). Default-on for the simulator binary; hardware adopters
# disable it via `default-features = false` so the crate compiles
# down to just the `Sensor` trait + the typed measurement / truth
# value shapes.
default   = ["synthetic"]
synthetic = ["dep:serde", "dep:toml"]

[dependencies]
nalgebra     = { workspace = true }
openbmp-core = { workspace = true }
serde        = { workspace = true, optional = true }
thiserror    = { workspace = true }
toml         = { workspace = true, optional = true }

[dev-dependencies]
approx   = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

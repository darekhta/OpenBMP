[package]
name                    = "openbmp-sensors"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP synthetic sensors and fault models. No device drivers."

[features]
# Synthetic noise infrastructure (the truth-driven
# `SyntheticSensor` implementations and their `DeterministicRng`
# dependency). Default-on for the simulator binary; hardware adopters
# disable it via `default-features = false` so the crate compiles
# down to just the `Sensor` trait + the typed measurement / truth
# value shapes.
default   = ["std", "synthetic"]
std       = ["nalgebra/std", "openbmp-core/std", "serde?/std", "thiserror/std", "toml?/std"]
synthetic = ["std", "dep:serde", "dep:toml"]

[dependencies]
nalgebra     = { version = "0.35.0", default-features = false, features = ["libm"] }
openbmp-core = { version = "0.0.1", path = "../openbmp-core", default-features = false }
serde        = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
thiserror    = { version = "2.0.18", default-features = false }
toml         = { version = "1.1.2", default-features = false, features = ["parse", "serde"], optional = true }

[dev-dependencies]
approx   = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

[package]
name                    = "openbmp-models"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP model trait surface (force, moment, mass, environment) — hardware-portable; no integrator dependency."

[features]
default = ["std"]
std     = ["nalgebra/std", "openbmp-core/std", "openbmp-state/std", "uom/std"]

[dependencies]
openbmp-core       = { version = "0.0.1", path = "../openbmp-core", default-features = false }
openbmp-state      = { version = "0.0.1", path = "../openbmp-state", default-features = false }
nalgebra           = { version = "0.34.2", default-features = false, features = ["libm"] }
thiserror          = { version = "2.0.18", default-features = false }
uom                = { version = "0.38.0", default-features = false, features = ["f64", "si", "autoconvert"] }

[dev-dependencies]
approx          = { workspace = true }
proptest        = { workspace = true }

[lints]
workspace = true

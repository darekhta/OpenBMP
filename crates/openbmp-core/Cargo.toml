[package]
name                    = "openbmp-core"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP foundation: math, units, frames, time, deterministic RNG."

[features]
default = ["std"]
std     = ["nalgebra/std", "rand/std", "rand/std_rng", "serde/std", "uom/std"]

[dependencies]
nalgebra    = { version = "0.35.0", default-features = false, features = ["libm"] }
uom         = { version = "0.38.0", default-features = false, features = ["f64", "si", "autoconvert"] }
rand        = { version = "0.10.1", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
serde       = { version = "1.0.228", default-features = false, features = ["derive"] }
thiserror   = { version = "2.0.18", default-features = false }
# num-traits is intentionally absent (removed per cargo-machete); add
# it back if state types or integrators need generic numeric traits.

[dev-dependencies]
approx   = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

[package]
name                    = "openbmp-uq"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP uncertainty quantification budgets and credibility records."

[features]
default = ["std"]
std     = ["num-traits/std", "openbmp-core/std", "thiserror/std"]

[dependencies]
num-traits  = { version = "0.2.19", default-features = false, features = ["libm"] }
openbmp-core = { version = "0.0.1", path = "../openbmp-core", default-features = false }
thiserror    = { version = "2.0.18", default-features = false }

[lints]
workspace = true

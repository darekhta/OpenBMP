[package]
name                    = "openbmp-cli"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP command-line: scenario runner, golden diff, scenario lint, batch sweep."

[lib]
name = "openbmp_cli"
path = "src/lib.rs"

[[bin]]
name = "openbmp"
path = "src/main.rs"

[features]
default     = []
bridge      = []
l1-adaptive = ["openbmp-runner/l1-adaptive"]
lqr         = ["openbmp-runner/lqr"]
indi        = ["openbmp-runner/indi"]
mpc         = ["openbmp-runner/mpc"]

[dependencies]
arrow              = { workspace = true }
clap               = { workspace = true }
csv                = { workspace = true }
openbmp-core       = { workspace = true }
openbmp-mc         = { workspace = true }
openbmp-msgs       = { workspace = true }
openbmp-physics    = { workspace = true }
openbmp-runner     = { workspace = true }
openbmp-scenario   = { workspace = true }
openbmp-sensors    = { workspace = true }
openbmp-sim        = { workspace = true }
openbmp-sil        = { workspace = true }
openbmp-telemetry  = { workspace = true }
openbmp-testkit    = { workspace = true }
openbmp-trajopt    = { workspace = true }
openbmp-uq         = { workspace = true }
nalgebra           = { workspace = true }
parquet            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
sha2               = { workspace = true }
thiserror          = { workspace = true }
toml               = { workspace = true }
toml_edit          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd        = { workspace = true }
insta             = { workspace = true }
insta-cmd         = { workspace = true }
openbmp-fc        = { workspace = true }
predicates        = { workspace = true }
tempfile          = { workspace = true }

[lints]
workspace = true

[package]
name                    = "openbmp-cli"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP command-line: scenario runner, golden diff, scenario lint, batch sweep."

[lib]
name = "openbmp_cli"
path = "src/lib.rs"

[[bin]]
name = "openbmp"
path = "src/main.rs"

[features]
default = []
bridge  = []

[dependencies]
arrow              = { workspace = true }
clap               = { workspace = true }
openbmp-core       = { workspace = true }
openbmp-scenario   = { workspace = true }
openbmp-sim        = { workspace = true }
openbmp-state      = { workspace = true }
openbmp-telemetry  = { workspace = true }
parquet            = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uom                = { workspace = true }

[dev-dependencies]
assert_cmd        = { workspace = true }
insta             = { workspace = true }
insta-cmd         = { workspace = true }
openbmp-testkit   = { workspace = true }
predicates        = { workspace = true }
tempfile          = { workspace = true }

[lints]
workspace = true

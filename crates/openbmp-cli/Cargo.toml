[package]
name                    = "openbmp-cli"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP command-line: scenario runner, golden diff, scenario lint, batch sweep."

[lib]
name = "openbmp_cli"
path = "src/lib.rs"

[[bin]]
name = "openbmp"
path = "src/main.rs"

[features]
default     = []
bridge      = []
l1-adaptive = ["openbmp-fc/l1-adaptive"]
lqr         = ["openbmp-fc/lqr"]

[dependencies]
arrow              = { workspace = true }
clap               = { workspace = true }
nalgebra           = { workspace = true }
openbmp-aero       = { workspace = true }
openbmp-core       = { workspace = true }
openbmp-fc         = { workspace = true }
openbmp-mission    = { workspace = true }
openbmp-physics    = { workspace = true }
openbmp-propulsion = { workspace = true }
openbmp-scenario   = { workspace = true }
openbmp-sensors    = { workspace = true, features = ["synthetic"] }
openbmp-sim        = { workspace = true }
openbmp-state      = { workspace = true }
openbmp-telemetry  = { workspace = true }
openbmp-vehicle    = { workspace = true }
parquet            = { workspace = true }
thiserror          = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uom                = { workspace = true }

[dev-dependencies]
assert_cmd        = { workspace = true }
insta             = { workspace = true }
insta-cmd         = { workspace = true }
openbmp-testkit   = { workspace = true }
predicates        = { workspace = true }
tempfile          = { workspace = true }

[lints]
workspace = true

# Tolerance table for the constant-acceleration-drop analytic-toy
# scenario. Reference values come from the closed-form solution
# z(t) = -0.5 * g * t² and vz(t) = -g * t with g = 9.80665 m/s² and
# t = 10 s. RK4 with constant force on constant mass is exact for the
# integrated polynomials, so the tolerances are dominated by f64
# round-off across 1000 steps (≤ 10⁻¹⁰ in this regime).

case       = "constant-acceleration-drop"
source     = "closed-form: z(t) = -0.5 * g * t^2, vz(t) = -g * t, g = 9.80665 m/s²"
validation = "validated-toy"

[[metric]]
name                = "final_time_s"
expected            = 10.0
absolute_tolerance  = 1.0e-12
relative_tolerance  = 1.0e-13

[[metric]]
name                = "final_position_z_m"
expected            = -490.3325
absolute_tolerance  = 1.0e-9
relative_tolerance  = 1.0e-12

[[metric]]
name                = "final_velocity_z_m_s"
expected            = -98.0665
absolute_tolerance  = 1.0e-10
relative_tolerance  = 1.0e-12

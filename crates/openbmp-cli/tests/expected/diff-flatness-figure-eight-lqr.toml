case = "diff-flatness-figure-eight-lqr-rigid-body-8000-steps"
source = "Synthetic; same lemniscate waypoints as scenarios/diff-flatness-figure-eight, with rate_loop_kind = \"lqr\". See scenarios/diff-flatness-figure-eight-lqr/provenance.md."
validation = "experimental"

# Phase 5.A.3.B tolerance bench: rigid-body figure-eight tracker
# with the per-axis LQR rate loop (DARE-solved at scenario load).
# Asserts:
#   - 8000 kernel steps;
#   - rigid-body quaternion stays normalised after projection;
#   - max body-frame angular velocity magnitude bounded — generous
#     5.0 rad/s ceiling around the observed ~1.1 rad/s peak,
#     which already exceeds the PID baseline because the LQR is
#     tracking the trajectory loop's body-rate reference more
#     tightly. Comparison against PID + L1 is Phase-5.A.3.D scope.

[[metric]]
name = "kernel_steps"
expected = 8000
absolute_tolerance = 0.0
relative_tolerance = 0.0

[[metric]]
name = "max_angular_velocity_magnitude_rad_s"
expected = 0.0
absolute_tolerance = 5.0
relative_tolerance = 0.0

[[metric]]
name = "max_quaternion_norm_error"
expected = 0.0
absolute_tolerance = 1.0e-12
relative_tolerance = 0.0

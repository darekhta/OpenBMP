case = "diff-flatness-figure-eight-mpc-rigid-body-8000-steps"
source = "Synthetic; same lemniscate waypoints as scenarios/diff-flatness-figure-eight, with attitude_loop_kind = \"mpc\". See scenarios/diff-flatness-figure-eight-mpc/provenance.md."
validation = "experimental"

# MPC tolerance bench: rigid-body figure-eight tracker with
# the receding-horizon attitude MPC (Clarabel, deterministic
# settings). Asserts:
#   - 8000 kernel steps;
#   - rigid-body quaternion stays normalised after projection;
#   - max body-frame angular velocity magnitude bounded — generous
#     5.0 rad/s ceiling. The MPC's configured rate-command box bound
#     is 3 rad/s, but the downstream PID rate loop and actuator limits
#     are outside the command-level QP, so this tolerance is a
#     run-to-completion / bounded-motion check rather than a production
#     tracking benchmark. Comparison against PID, LQR, and INDI under
#     the same disturbance is left for a future controller-comparison
#     harness extension.

[[metric]]
name = "kernel_steps"
expected = 8000
absolute_tolerance = 0.0
relative_tolerance = 0.0

[[metric]]
name = "max_angular_velocity_magnitude_rad_s"
expected = 0.0
absolute_tolerance = 5.0
relative_tolerance = 0.0

[[metric]]
name = "max_quaternion_norm_error"
expected = 0.0
absolute_tolerance = 1.0e-12
relative_tolerance = 0.0

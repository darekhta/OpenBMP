case = "diff-flatness-figure-eight-rigid-body-8000-steps"
source = "Synthetic; minimum-snap waypoints in scenario.toml. See scenarios/diff-flatness-figure-eight/provenance.md."
validation = "experimental"

# Phase 5.A.2.A tolerance bench: rigid-body kernel with three
# direct-torque effectors, the existing PID + DifferentialFlatness
# autopilot driving the figure-eight reference. Asserts:
#  - the scenario runs end-to-end (8000 steps at 1 ms);
#  - the autopilot keeps the body stable (max angular velocity
#    bounded — generous 5.0 rad/s ceiling sized for the
#    pre-L1 baseline);
#  - the rigid-body quaternion stays normalized after projection;
#  - the polynomial-coefficient byte-stability proven by the
#    trajectory unit tests propagates through the closed-loop
#    pipeline (asserted by the rerun-byte-stable e2e test).
#
# Tighter attitude-error tolerances land with the L1 adaptive
# (5.A.2.B–D) and observer-form anti-windup (5.A.3) sub-phases.

[[metric]]
name = "kernel_steps"
expected = 8000
absolute_tolerance = 0.0
relative_tolerance = 0.0

[[metric]]
name = "max_angular_velocity_magnitude_rad_s"
expected = 0.0
absolute_tolerance = 5.0
relative_tolerance = 0.0

[[metric]]
name = "max_quaternion_norm_error"
expected = 0.0
absolute_tolerance = 1.0e-12
relative_tolerance = 0.0

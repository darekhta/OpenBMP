openbmp.scenario = 3

[meta]
name = "mc-acoustics-response-campaign"
description = "Synthetic MC ascent-to-response acoustics campaign test."
validation = "validated-toy"

[time]
start_s = 0.0
stop_s = 0.1
dt_s = 0.1
seed = 220607

[vehicle]
kind = "point_mass"
initial_position_eci_m = [0.0, 0.0, 10.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id = "mc-acoustics-response-campaign"

[[vehicle.assembly.bodies]]
id = "main"
geometry = { kind = "reference", length_m = 1.0, area_m2 = 1.0 }
dry_mass_kg = 1.0

[environment]
frame_profile = "toy-fixed-earth"
gravity = "constant"
gravity_m_s2 = 0.0
atmosphere = "none"
wind = "none"

[forces]
models = ["gravity"]

[acoustics.ascent]
station_id = "station-a"
deck_file = @ASCENT_DECK@
deck_file_sha256 = "@ASCENT_DECK_SHA256@"
class_id = "attached_turbulent"
dynamic_pressure_pa = 50000.0
mach = 0.8

[acoustics.fairing_internal]
station_id = "payload-a"
deck_file = @FAIRING_DECK@
deck_file_sha256 = "@FAIRING_DECK_SHA256@"
class_id = "synthetic_light_fairing"
fill_factor = 1.0

[acoustics.response]
station_id = "payload-a"
source = "fairing_internal"
deck_file = @RESPONSE_DECK@
deck_file_sha256 = "@RESPONSE_DECK_SHA256@"
class_id = "synthetic_panel_light"
surface_mass_kg_m2 = 12.0
area_m2 = 4.0
mode_shape_factor = 0.6

[telemetry]
output.csv = "out/mc-acoustics-response-campaign.csv"

[validation]
require_finite_state = true
require_monotonic_time = true

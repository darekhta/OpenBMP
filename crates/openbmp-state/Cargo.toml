[package]
name                    = "openbmp-state"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP state types: PointMassState, RigidBodyState, MassProperties."

[features]
default = ["std"]
std     = ["nalgebra/std", "openbmp-core/std", "uom/std"]

[dependencies]
openbmp-core = { version = "0.0.1", path = "../openbmp-core", default-features = false }
nalgebra     = { version = "0.35.0", default-features = false, features = ["libm"] }
uom          = { version = "0.38.0", default-features = false, features = ["f64", "si", "autoconvert"] }
thiserror    = { version = "2.0.18", default-features = false }

[dev-dependencies]
approx   = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

case = "planar-point-mass-double-pendulum"
description = "Synthetic WP-01.1 tolerance fixture for kinetic energy and revolute generalized momenta on a planar double pendulum with a zero-velocity free-flyer root."

link_lengths_m = [2.0, 1.5]
masses_kg = [3.0, 2.0]

q = [
  0.25,
  1.0471975511965979,
]

qd = [
  0.4,
  -0.7,
]

expected_kinetic_energy_j = 1.4425
expected_revolute_generalized_momentum = [
  6.95,
  -0.15,
]

[integration]
horizon_s = 10000.0
step_s = 1.0
initial_q = [
  0.35,
  -0.4,
]
initial_qd = [
  0.00001,
  -0.000007,
]
root_qd = [
  0.0,
  0.0,
  0.0,
  0.2,
  0.0,
  0.0,
]

[tolerances]
kinetic_energy_abs = 1.0e-12
generalized_momentum_max_abs = 1.0e-12
energy_drift_rel = 1.0e-6

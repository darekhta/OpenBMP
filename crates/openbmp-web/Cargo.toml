[package]
name                    = "openbmp-web"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP web demo host: the steppable runner session, embedded Phalcon-9 scenarios, and a WebAssembly-facing API for the browser visualisation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { workspace = true }
nalgebra                 = { workspace = true }
openbmp-core             = { workspace = true }
openbmp-runner           = { workspace = true }
openbmp-scenario         = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
uom                      = { workspace = true }
wasm-bindgen             = { workspace = true }

[lints]
workspace = true

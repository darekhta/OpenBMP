[package]
name                    = "openbmp-aero"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
authors.workspace       = true
description             = "OpenBMP aerodynamics: deck format, tabulated and hypersonic aero methods, continuum-to-rarefied bridging."

[features]
default = ["std", "parser"]
std     = ["nalgebra/std", "num-traits/std", "serde?/std", "thiserror/std", "toml?/std"]
parser  = ["std", "dep:serde", "dep:toml"]

[dependencies]
nalgebra   = { version = "0.35.0", default-features = false, features = ["libm"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
serde      = { version = "1.0.228", default-features = false, optional = true, features = ["derive"] }
thiserror  = { version = "2.0.18", default-features = false }
toml       = { version = "1.1.2", default-features = false, optional = true, features = ["parse", "serde"] }

[dev-dependencies]
approx   = { workspace = true }
proptest = { workspace = true }
sha2     = { workspace = true }

[lints]
workspace = true

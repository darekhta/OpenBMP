version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      arrow-stack:
        patterns: ["arrow", "parquet"]
      tracing-stack:
        patterns: ["tracing", "tracing-subscriber"]
      serde-stack:
        patterns: ["serde", "serde_*"]
      proptest-stack:
        patterns: ["proptest", "proptest-derive"]
      nalgebra-stack:
        patterns: ["nalgebra", "nalgebra-*"]
    labels:
      - "deps"
      - "rust"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - "deps"
      - "ci"

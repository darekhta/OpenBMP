name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly heavier dispersion campaign. PRs keep the normal deterministic
    # gates; this lane carries the Monte-Carlo acceptance burden.
    - cron: "17 3 * * 0"

env:
  CARGO_TERM_COLOR: always

# Cancel in-progress runs for the same PR/branch on new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Format
  # ----------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ----------------------------------------------------------------------
  # Clippy (deny warnings)
  # ----------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # ----------------------------------------------------------------------
  # Build (workspace)
  # ----------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --workspace --all-features --locked

  # ----------------------------------------------------------------------
  # Test (cargo-nextest)
  # ----------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.133
      - run: cargo nextest run --workspace --all-features --locked

  # ----------------------------------------------------------------------
  # Coverage (stable line/region floor)
  # ----------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - name: GNC/dynamics line coverage floor
        run: |
          cargo llvm-cov \
              -p openbmp-fc \
              -p openbmp-physics \
              -p openbmp-models \
              -p openbmp-aero \
              -p openbmp-propulsion \
              --all-features \
              --locked \
              --fail-under-lines 35

  # ----------------------------------------------------------------------
  # Doc tests
  # ----------------------------------------------------------------------
  doc-tests:
    name: doc-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test --doc --workspace --all-features --locked

  # ----------------------------------------------------------------------
  # Supply-chain: cargo-deny
  # ----------------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      - run: cargo deny check

  # ----------------------------------------------------------------------
  # Supply-chain: cargo-audit
  # ----------------------------------------------------------------------
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - run: cargo audit

  # ----------------------------------------------------------------------
  # Supply-chain: cargo-machete (unused deps)
  # ----------------------------------------------------------------------
  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # ----------------------------------------------------------------------
  # Feature powerset (empty today, catches accidental feature coupling later)
  # ----------------------------------------------------------------------
  feature-powerset:
    name: cargo-hack feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.44
      - run: cargo hack check --workspace --feature-powerset --locked

  # ----------------------------------------------------------------------
  # MSRV verification
  # ----------------------------------------------------------------------
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --workspace --all-features --locked

  # ----------------------------------------------------------------------
  # Spelling
  # ----------------------------------------------------------------------
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli@1.45.1
      - run: typos

  # ----------------------------------------------------------------------
  # Documentation builds (no warnings)
  # ----------------------------------------------------------------------
  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo doc --workspace --all-features --no-deps --document-private-items

  # ----------------------------------------------------------------------
  # HAL portability — `openbmp-fc` must build with default features
  # disabled. Catches an accidental import of a simulator-only crate
  # (`openbmp-sim`, `openbmp-runner`, `openbmp-cli`, `openbmp-scenario`,
  # `openbmp-telemetry`, `openbmp-bridge`, `openbmp-aerothermal`)
  # inside the controller's source tree.
  # ----------------------------------------------------------------------
  hal-portability:
    name: HAL portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: rustup target add thumbv7em-none-eabihf
      - run: cargo check -p openbmp-core -p openbmp-state -p openbmp-models -p openbmp-mission -p openbmp-physics -p openbmp-propulsion -p openbmp-aero -p openbmp-afts -p openbmp-sensors -p openbmp-hal -p openbmp-fc --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo check -p openbmp-bridge -p openbmp-pil --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo check -p openbmp-hal --no-default-features --locked
      - run: cargo test -p openbmp-hal flight_record --locked
      - run: cargo build -p openbmp-fc --no-default-features --features std --locked
      - run: cargo test -p openbmp-fc --no-default-features --features std --locked

  # ----------------------------------------------------------------------
  # Flight-core dependency graph tripwire
  #
  # Required structural guard: `openbmp-fc` must not acquire any
  # simulator/tooling dependency edge. This is separate from the
  # compile-only HAL portability build so renamed deps, target-
  # conditional deps, and feature-activated `dep:*` aliases fail
  # closed at manifest level.
  # ----------------------------------------------------------------------
  fc-dependency-graph:
    name: FC dependency graph tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test -p openbmp-testkit --test fc_dependency_tripwire --locked

  # ----------------------------------------------------------------------
  # Lockstep-clock tripwire — fails if any wall-clock API
  # (`std::time::Instant::now`, `std::time::SystemTime::now`)
  # is referenced inside `crates/openbmp-fc/`.
  # ----------------------------------------------------------------------
  lockstep-clock:
    name: lockstep-clock tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test -p openbmp-testkit --lib --locked fc_lints

  # ----------------------------------------------------------------------
  # Requirements traceability
  #
  # Validates the checked-in requirements register:
  #   - requirement and verification IDs are unique and well-formed;
  #   - every requirement has verification evidence;
  #   - every verification item links back to at least one requirement;
  #   - evidence paths exist and contain the named test / CI anchors.
  # ----------------------------------------------------------------------
  requirements-traceability:
    name: requirements traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_requirements_traceability.py

  # ----------------------------------------------------------------------
  # FMI export schema gate
  #
  # Validates the generated point-mass exporter metadata against the
  # repository's restricted XSD contract and the pinned official FMI 3.0
  # XSD set. This is not the FMI conformance suite.
  # ----------------------------------------------------------------------
  fmi-export-schema:
    name: FMI export schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: python3 scripts/check_fmi_export_schema.py

  # ----------------------------------------------------------------------
  # FMI import point-mass smoke
  #
  # Packages the current-platform point-mass FMU, loads it through the
  # OpenBMP importer, and compares the output to the native tolerance table.
  # ----------------------------------------------------------------------
  fmi-import-point-mass:
    name: FMI import point-mass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: python3 scripts/check_fmi_import_point_mass.py

  # ----------------------------------------------------------------------
  # FMI import FMPy cross-check
  #
  # Packages the current-platform point-mass FMU, runs it through OpenBMP's
  # importer and FMPy, and compares both final samples.
  # ----------------------------------------------------------------------
  fmi-import-fmpy:
    name: FMI import FMPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: python3 -m pip install --disable-pip-version-check FMPy==0.3.26
      - run: python3 scripts/check_fmi_import_fmpy.py

  # ----------------------------------------------------------------------
  # FMI Reference-FMU smoke
  #
  # Downloads the pinned Modelica Reference-FMUs release, checks its
  # SHA-256, imports a small supported FMU matrix through OpenBMP, and
  # compares to FMPy.
  # ----------------------------------------------------------------------
  fmi-reference-smoke:
    name: FMI Reference-FMU smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: python3 -m pip install --disable-pip-version-check FMPy==0.3.26
      - run: python3 scripts/check_fmi_reference_smoke.py

  # ----------------------------------------------------------------------
  # FMI export FMPy smoke
  #
  # Packages the current-platform point-mass FMU, executes it through
  # FMPy, and compares the output to the native tolerance table.
  # ----------------------------------------------------------------------
  fmi-export-fmpy:
    name: FMI export FMPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: python3 -m pip install --disable-pip-version-check FMPy==0.3.26
      - run: python3 scripts/check_fmi_export_fmpy.py

  # ----------------------------------------------------------------------
  # Data/scenario provenance
  #
  # Fails closed when source data or scenario files lose their sibling
  # `provenance.md` record. Generated scenario `out/` telemetry directories
  # are skipped by the CLI walker.
  # ----------------------------------------------------------------------
  provenance:
    name: data and scenario provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build -p openbmp-cli --locked
      - run: ./target/debug/openbmp check-provenance data
      - run: ./target/debug/openbmp check-provenance scenarios

  # ----------------------------------------------------------------------
  # Native SIL evidence + interchange smoke
  #
  # Exercises the industry-shaped package/testbench path directly:
  # package validation, dictionary exports, evidence bundle writing,
  # verdict reading, mission/script migration tests, and the FMI
  # co-simulation adapter-boundary smoke.
  # ----------------------------------------------------------------------
  sil-evidence-interchange:
    name: SIL evidence and interchange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build -p openbmp-cli --locked
      - run: cargo test -p openbmp-sil --locked
      # Default features (no `extension-module`) so the in-process pyo3
      # test can link libpython; the workspace `--all-features` gate
      # builds the extension cdylib but gates this test out.
      - run: cargo test -p openbmp-sil-py --locked
      - run: cargo test -p openbmp-models fmu_cosim_port_matches_native_toy_model --locked
      - run: cargo test -p openbmp-cli mission_script_split --locked
      - run: ./target/debug/openbmp dict export --format json --output target/ci-dictionary.json
      - run: ./target/debug/openbmp dict export --format xtce --experimental --output target/ci-dictionary.xtce.xml
      - run: ./target/debug/openbmp package check scenarios/phalcon9/mission-package.toml
      - run: ./target/debug/openbmp sil step scenarios/phalcon9/mission-package.toml --case orbit-insertion --ticks 5 --evidence target/ci-sil-evidence
      - run: ./target/debug/openbmp sil verdict target/ci-sil-evidence/manifest.json

  # ----------------------------------------------------------------------
  # Phalcon-9 deterministic SIL
  #
  # Named flagship mission lane: keeps the orbit and integrated
  # boostback checks visible as SIL evidence rather than only as part
  # of the broad workspace test run.
  # ----------------------------------------------------------------------
  phalcon9-sil:
    name: Phalcon-9 deterministic SIL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test -p openbmp-cli phalcon9_orbit_meets_orbital_mechanics_invariants --locked
      - run: cargo test -p openbmp-cli phalcon9_boostback_ascends_to_orbit_and_booster_burns_retrograde --locked

  # ----------------------------------------------------------------------
  # HAL build-time gate
  #
  # `openbmp-fc` carries the test-only `ScenarioStateOverride` topic
  # gated behind `#[cfg(not(feature = "hal"))]`. The current host HAL
  # build uses `--features "std hal" --no-default-features` and the
  # topic compiles out entirely. Without enforcement, an accidental `#[cfg]` change
  # could silently leak the test-only override into a HAL build.
  #
  # This job:
  #   1. Builds `openbmp-fc` in HAL mode (`--features "std hal"
  #      --no-default-features`); the build must succeed.
  #   2. Compiles a probe that imports `ScenarioStateOverride` against
  #      the HAL build; the probe must fail to build (the symbol must
  #      not be visible in HAL mode).
  #   3. Builds the same probe against the default (non-HAL) build;
  #      the probe must build (the symbol must be visible in sim mode).
  # ----------------------------------------------------------------------
  fc-hal-gate:
    name: fc HAL build-time gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      # The HAL build path compiles `openbmp-fc` with the
      # test-only `ScenarioStateOverride` topic gated out. The
      # build must succeed cleanly.
      - name: HAL build of openbmp-fc must succeed
        run: cargo build -p openbmp-fc --no-default-features --features "std hal" --locked
      # The default (sim) build must still expose
      # `ScenarioStateOverride` so the simulator can use it. The
      # `hal_topic_gate` test in `crates/openbmp-fc/tests/`
      # references the symbol and is `#[cfg(not(feature = "hal"))]`
      # in HAL builds, so this run pins the visibility under the
      # sim default.
      - name: ScenarioStateOverride must be visible in default build
        run: cargo test -p openbmp-fc --test hal_topic_gate --locked
      # The same test target compiled with `--features hal
      # --no-default-features --features "std hal"` must compile down to no test bodies
      # (the cfg-gated module is empty under HAL). The compile pass
      # alone proves the gate behaves; we just check that
      # `cargo build --tests` succeeds under HAL.
      - name: HAL build of fc test targets must succeed
        run: cargo build -p openbmp-fc --tests --no-default-features --features "std hal" --locked

  # ----------------------------------------------------------------------
  # Determinism gate
  #
  # The headline policy gate on x86_64-unknown-linux-gnu. Three
  # canonical scenarios are gated:
  #
  # 1. `scenarios/analytic-toy/constant-acceleration-drop.toml` —
  #    the byte-stable analytic-toy drop. Runs three times: two with
  #    clean tracing, one with `RUST_LOG=trace` + stderr redirected
  #    to /dev/null. All three Parquet+CSV outputs must be
  #    byte-identical (the no-tracing-leak contract).
  #
  # 2. `scenarios/sounding-rocket/niskanen-2009-chapter6.toml` —
  #    the canonical sounding-rocket scenario. Runs three times:
  #    two with clean tracing, one with `RUST_LOG=trace` + stderr
  #    redirected to /dev/null. The Parquet outputs (including the
  #    SHA-256 schema metadata) must be byte-identical.
  #
  # 3. `scenarios/sounding-rocket/calisto/rocketpy-calisto.toml` —
  #    the RocketPy Calisto cross-tool scenario. Runs three times:
  #    two with clean tracing, one with `RUST_LOG=trace` + stderr
  #    redirected to /dev/null. Exercises the rigid-body runner
  #    end-to-end (assembly tree, engine cluster, mission events,
  #    drogue + main recovery) so a regression on any of those
  #    surfaces fails the gate.
  #
  # 4. `scenarios/diff-flatness-figure-eight/scenario.toml` —
  #    the canonical closed-loop rigid-body figure-eight. Runs twice
  #    with clean tracing and byte-diffs the Parquet archive.
  #
  # 5. `scenarios/phalcon9/phalcon9-orbit.toml` — the canonical
  #    closed-loop orbital insertion. Runs twice with clean tracing
  #    and byte-diffs the Parquet archive. This is intentionally a
  #    heavier gate than the analytic/public-reference cases because
  #    the sequencer migration must not drift the flagship SIL case
  #    silently.
  #
  # Cross-platform matrix (macos/windows) runs the same scenarios as
  # state-stable smoke tests via `cargo test -p openbmp-cli --tests`.
  # ----------------------------------------------------------------------
  determinism:
    name: determinism-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build release binary
        run: cargo build --release --workspace --locked
      # ----- Analytic-toy byte-stability gate --------------------------
      - name: Run analytic-toy twice (clean tracing)
        run: |
          mkdir -p target/det/run1 target/det/run2
          ./target/release/openbmp run \
              scenarios/analytic-toy/constant-acceleration-drop.toml \
              --output-parquet target/det/run1/drop.parquet \
              --output-csv     target/det/run1/drop.csv
          ./target/release/openbmp run \
              scenarios/analytic-toy/constant-acceleration-drop.toml \
              --output-parquet target/det/run2/drop.parquet \
              --output-csv     target/det/run2/drop.csv
      - name: Diff analytic-toy Parquet bytes
        run: |
          ./target/release/openbmp diff \
              target/det/run1/drop.parquet \
              target/det/run2/drop.parquet
      - name: Diff analytic-toy CSV bytes
        run: diff -q target/det/run1/drop.csv target/det/run2/drop.csv
      - name: Run analytic-toy with noisy tracing redirected (no-leak verification)
        run: |
          mkdir -p target/det/run3
          RUST_LOG=trace ./target/release/openbmp -ttt run \
              scenarios/analytic-toy/constant-acceleration-drop.toml \
              --output-parquet target/det/run3/drop.parquet \
              --output-csv     target/det/run3/drop.csv \
              2> /dev/null
      - name: Diff analytic-toy after tracing redirect
        run: |
          ./target/release/openbmp diff \
              target/det/run1/drop.parquet \
              target/det/run3/drop.parquet
          diff -q target/det/run1/drop.csv target/det/run3/drop.csv
      # ----- Niskanen sounding-rocket byte-stability gate --------------
      - name: Run Niskanen scenario twice (clean tracing)
        run: |
          mkdir -p target/det/niskanen1 target/det/niskanen2
          ./target/release/openbmp run \
              scenarios/sounding-rocket/niskanen-2009-chapter6.toml \
              --output-parquet target/det/niskanen1/niskanen.parquet
          ./target/release/openbmp run \
              scenarios/sounding-rocket/niskanen-2009-chapter6.toml \
              --output-parquet target/det/niskanen2/niskanen.parquet
      - name: Diff Niskanen Parquet bytes
        run: |
          diff -q \
              target/det/niskanen1/niskanen.parquet \
              target/det/niskanen2/niskanen.parquet
      - name: Run Niskanen with noisy tracing redirected (no-leak verification)
        run: |
          mkdir -p target/det/niskanen3
          RUST_LOG=trace ./target/release/openbmp -ttt run \
              scenarios/sounding-rocket/niskanen-2009-chapter6.toml \
              --output-parquet target/det/niskanen3/niskanen.parquet \
              2> /dev/null
      - name: Diff Niskanen after tracing redirect
        run: |
          diff -q \
              target/det/niskanen1/niskanen.parquet \
              target/det/niskanen3/niskanen.parquet
      # ----- Calisto cross-tool byte-stability gate --------------------
      - name: Run Calisto scenario twice (clean tracing)
        run: |
          mkdir -p target/det/calisto1 target/det/calisto2
          ./target/release/openbmp run \
              scenarios/sounding-rocket/calisto/rocketpy-calisto.toml \
              --output-parquet target/det/calisto1/calisto.parquet
          ./target/release/openbmp run \
              scenarios/sounding-rocket/calisto/rocketpy-calisto.toml \
              --output-parquet target/det/calisto2/calisto.parquet
      - name: Diff Calisto Parquet bytes
        run: |
          diff -q \
              target/det/calisto1/calisto.parquet \
              target/det/calisto2/calisto.parquet
      - name: Run Calisto with noisy tracing redirected (no-leak verification)
        run: |
          mkdir -p target/det/calisto3
          RUST_LOG=trace ./target/release/openbmp -ttt run \
              scenarios/sounding-rocket/calisto/rocketpy-calisto.toml \
              --output-parquet target/det/calisto3/calisto.parquet \
              2> /dev/null
      - name: Diff Calisto after tracing redirect
        run: |
          diff -q \
              target/det/calisto1/calisto.parquet \
              target/det/calisto3/calisto.parquet
      # ----- Differential-flatness closed-loop byte-stability gate ---
      - name: Run diff-flatness figure-eight twice (clean tracing)
        run: |
          mkdir -p target/det/flatness1 target/det/flatness2
          ./target/release/openbmp run \
              scenarios/diff-flatness-figure-eight/scenario.toml \
              --output-parquet target/det/flatness1/diff-flatness-figure-eight.parquet
          ./target/release/openbmp run \
              scenarios/diff-flatness-figure-eight/scenario.toml \
              --output-parquet target/det/flatness2/diff-flatness-figure-eight.parquet
      - name: Diff diff-flatness Parquet bytes
        run: |
          ./target/release/openbmp diff \
              target/det/flatness1/diff-flatness-figure-eight.parquet \
              target/det/flatness2/diff-flatness-figure-eight.parquet
      # ----- Phalcon-9 closed-loop orbital byte-stability gate --------
      - name: Run Phalcon-9 orbit twice (clean tracing)
        run: |
          mkdir -p target/det/phalcon9-orbit1 target/det/phalcon9-orbit2
          ./target/release/openbmp run \
              scenarios/phalcon9/phalcon9-orbit.toml \
              --output-csv     target/det/phalcon9-orbit1/phalcon9-orbit.csv \
              --output-parquet target/det/phalcon9-orbit1/phalcon9-orbit.parquet
          ./target/release/openbmp run \
              scenarios/phalcon9/phalcon9-orbit.toml \
              --output-csv     target/det/phalcon9-orbit2/phalcon9-orbit.csv \
              --output-parquet target/det/phalcon9-orbit2/phalcon9-orbit.parquet
      - name: Diff Phalcon-9 orbit Parquet bytes
        run: |
          ./target/release/openbmp diff \
              target/det/phalcon9-orbit1/phalcon9-orbit.parquet \
              target/det/phalcon9-orbit2/phalcon9-orbit.parquet
      - name: Assemble x86_64 determinism reference artifact
        run: |
          mkdir -p target/det/x86-reference
          cp target/det/run1/drop.parquet target/det/x86-reference/drop.parquet
          cp target/det/run1/drop.csv target/det/x86-reference/drop.csv
          cp target/det/niskanen1/niskanen.parquet target/det/x86-reference/niskanen.parquet
          cp target/det/calisto1/calisto.parquet target/det/x86-reference/calisto.parquet
          cp target/det/flatness1/diff-flatness-figure-eight.parquet target/det/x86-reference/diff-flatness-figure-eight.parquet
          cp target/det/phalcon9-orbit1/phalcon9-orbit.parquet target/det/x86-reference/phalcon9-orbit.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-determinism-reference-${{ github.sha }}
          path: target/det/x86-reference
          compression-level: 0
          retention-days: 7

  # ----------------------------------------------------------------------
  # Native aarch64 determinism gate
  #
  # Runs the fixed-step canonical scenario set on GitHub's native
  # Ubuntu arm64 runner and byte-diffs those outputs against the
  # x86_64 reference-platform bytes produced by the determinism job
  # for the same commit. This closes the WP-12.3-b second-profile
  # gate without committing large binary golden Parquet archives.
  # ----------------------------------------------------------------------
  determinism-aarch64:
    name: determinism-gate (aarch64)
    needs: determinism
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-determinism-reference-${{ github.sha }}
          path: target/det/x86-reference
      - name: Verify aarch64 host profile and FP guard
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-unknown-linux-gnu"
          cargo test -p openbmp-core fp --locked
      - name: Verify aarch64 MC scalar report bytes
        run: cargo test -p openbmp-mc scalar_campaign_report_bytes_match_pinned_golden --locked
      - name: Build release binary
        run: cargo build --release --workspace --locked
      - name: Run native aarch64 canonical scenarios
        run: |
          mkdir -p target/det/aarch64
          ./target/release/openbmp run \
              scenarios/analytic-toy/constant-acceleration-drop.toml \
              --output-parquet target/det/aarch64/drop.parquet \
              --output-csv     target/det/aarch64/drop.csv
          ./target/release/openbmp run \
              scenarios/sounding-rocket/niskanen-2009-chapter6.toml \
              --output-parquet target/det/aarch64/niskanen.parquet
          ./target/release/openbmp run \
              scenarios/sounding-rocket/calisto/rocketpy-calisto.toml \
              --output-parquet target/det/aarch64/calisto.parquet
          ./target/release/openbmp run \
              scenarios/diff-flatness-figure-eight/scenario.toml \
              --output-parquet target/det/aarch64/diff-flatness-figure-eight.parquet
          ./target/release/openbmp run \
              scenarios/phalcon9/phalcon9-orbit.toml \
              --output-csv     target/det/aarch64/phalcon9-orbit.csv \
              --output-parquet target/det/aarch64/phalcon9-orbit.parquet
      - name: Compare aarch64 outputs against x86_64 reference
        run: |
          ./target/release/openbmp diff \
              target/det/x86-reference/drop.parquet \
              target/det/aarch64/drop.parquet
          diff -q target/det/x86-reference/drop.csv target/det/aarch64/drop.csv
          ./target/release/openbmp diff \
              target/det/x86-reference/niskanen.parquet \
              target/det/aarch64/niskanen.parquet
          ./target/release/openbmp diff \
              target/det/x86-reference/calisto.parquet \
              target/det/aarch64/calisto.parquet
          ./target/release/openbmp diff \
              target/det/x86-reference/diff-flatness-figure-eight.parquet \
              target/det/aarch64/diff-flatness-figure-eight.parquet
          ./target/release/openbmp diff \
              target/det/x86-reference/phalcon9-orbit.parquet \
              target/det/aarch64/phalcon9-orbit.parquet

  # ----------------------------------------------------------------------
  # Monte-Carlo nightly
  #
  # Heavier seeded dispersion evidence, exposed as its own scheduled/manual
  # lane so acceptance statistics stay reproducible and visible.
  # ----------------------------------------------------------------------
  monte-carlo-nightly:
    name: monte-carlo-nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Footprint Monte-Carlo reporting
        run: cargo test -p openbmp-cli footprint_mc_writes_declared_outputs --locked
      - name: Phalcon-9 Monte-Carlo determinism
        run: cargo test -p openbmp-cli phalcon9_orbit_monte_carlo_is_deterministic --locked
      - name: Phalcon-9 Monte-Carlo robustness
        run: cargo test -p openbmp-cli phalcon9_orbit_monte_carlo_robustness --locked -- --nocapture

  # ----------------------------------------------------------------------
  # Cross-platform state-stable gate
  #
  # macOS and Windows runners build and run the same scenario but only
  # assert tolerance compliance via the e2e test, not bit-stability.
  # These are "state-stable, not bit-stable" platforms; bit equality
  # is enforced only on the x86_64-unknown-linux-gnu reference profile.
  # ----------------------------------------------------------------------
  cross-platform:
    name: cross-platform-state-stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo test -p openbmp-cli --tests --locked

# Niskanen 2009 Chapter-6 small-rocket benchmark — Phase-3.2 mission variant.
#
# Same physics as the canonical point-mass Niskanen scenario at
# `niskanen-2009-chapter6.toml`, but adds a `[mission]` block that
# declares the Phase-3.2 declarative event-driven scheduling
# vocabulary. The mission block:
#
# - Declares two phases: `ascent` (initial) and `descent`.
# - Declares one event: `at_apogee_marker`, with `AtApogee` trigger
#   and `emit_telemetry_marker` action (tag = "at_apogee_marker").
# - Declares one transition: `ascent → descent` on `at_apogee_marker`.
#
# The runner allocates a `bool` telemetry channel
# `mission.marker.at_apogee_marker` and writes `true` on the step
# where the trigger fires (the apogee step), `false` on every other
# step. The current-phase state transitions from `ascent` to `descent`
# on the same step.
#
# Pinned digests are SHA-256 of the referenced files at the commit
# that ships this scenario; mismatches fail closed.

openbmp.scenario = 1

[meta]
name        = "niskanen-2009-chapter6-with-mission"
description = "Niskanen 2009 Chapter-6 small model rocket; identical physics to the canonical point-mass Niskanen scenario plus a Phase-3.2 [mission] block exercising the at_apogee_marker telemetry channel."
validation  = "checked"
provenance  = "Niskanen 2009 Chapter 6, Helsinki UT MSc thesis; Phase-3.2 mission variant of the canonical Niskanen scenario."

[time]
start_s = 0.0
stop_s  = 20.0
dt_s    = 0.001
seed    = 0x4e69_736b_616e_654d  # same seed root with last byte 'M' for mission

[vehicle]
kind                     = "point_mass"
mass_kg                  = 0.080
initial_position_eci_m   = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[environment]
frame_profile = "wgs84-uniform-rotation"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "us_standard_1976"
wind          = "none"

[atmosphere]
kind = "us_standard_1976"

[frames]
profile = "wgs84-uniform-rotation"

[frames.local_origin]
latitude_deg  = 60.18
longitude_deg = 24.83
height_m      = 0.0
source        = "Helsinki proxy launch site (Niskanen 2009 Chapter 6 does not publish exact coordinates)."

[aero]
deck         = "../../data/aero/synthetic-niskanen-ch6-rocket.toml"
deck_sha256  = "cd862c2af98a1f28dc86c6e754d311c7a724081ca91b80704ad89b2ec4cb5c27"

[propulsion.motor]
file         = "../../data/motors/estes-c6-eng-derived.toml"
ignite_at_s  = 0.0
variant      = "solid"
file_sha256  = "da8272d3a7a135046c614e51b279971d37cac376f7aaaffdedc3ccc14d50ad4e"

[forces]
models = ["gravity", "thrust", "aero"]

[telemetry]
output.parquet = "out/niskanen-2009-chapter6-with-mission.parquet"

[validation]
require_finite_state   = true
require_monotonic_time = true

# Phase-3.2 mission block: declare phases, the apogee event, and the
# ascent→descent transition.

[mission]
initial_phase = "ascent"

[[mission.phases]]
id    = "ascent"
label = "powered + coast ascent"

[[mission.phases]]
id    = "descent"
label = "post-apogee descent"

[[mission.events]]
id      = "at_apogee_marker"
trigger = { kind = "at_apogee" }
action  = { kind = "emit_telemetry_marker", tag = "at_apogee_marker" }

[[mission.transitions]]
from  = "ascent"
to    = "descent"
event = "at_apogee_marker"

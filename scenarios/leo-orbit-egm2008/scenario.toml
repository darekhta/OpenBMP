# Demo: 1 kg point mass in a 400 km LEO orbit under
# EGM2008 zonal-harmonic gravity (degrees 2-6). The initial state is
# the closed-form circular-orbit velocity for the WGS84 µ at radius
# r = 6_778_000 m, inclined 30° relative to the equatorial plane so
# the trajectory crosses ±30° latitude and exercises the higher-order
# zonal terms (J_3, J_4, J_5, J_6) that the truncated EGM2008 model
# adds on top of the existing J_2 perturbation. Under perfect Newtonian
# gravity the orbit would close exactly after one period; the EGM2008
# zonal corrections introduce slight oblateness-driven precession and
# a small radial perturbation that the math-side unit tests in
# `crates/openbmp-physics/src/gravity.rs` already characterise — this
# scenario is the end-to-end determinism + integration check.
#
# RK4 fixed-step at dt = 1.0 s integrates one full orbit (≈ 5556 s)
# with relative energy drift well below 1e-9 for the model used here.
# Telemetry is parquet-only (the byte-stability oracle compares Parquet
# bytes; CSV is omitted to keep the artifact slim).

openbmp.scenario = 3

[meta]
name = "leo-orbit-egm2008"
description = "1 kg point mass in 400 km / 30° inclined LEO under EGM2008 zonal gravity (degrees 2-6) for one orbit period; fixed-RK4 demo."
validation = "experimental"
provenance = "synthetic; closed-form circular-orbit IC for WGS84 µ at r = 6_778_000 m, 30° inclination; gravity = EGM2008 zonal degrees 2-6 with J_n from Pavlis et al. 2012. See provenance.md."

[time]
start_s = 0.0
stop_s = 5556.0
dt_s = 1.0
seed = 0x4567_4d32_3030_3801

[vehicle]
kind = "point_mass"
initial_position_eci_m = [6_778_000.0, 0.0, 0.0]
# v_circ = sqrt(WGS84_MU_M3_S2 / r) ≈ 7669.10 m/s at r = 6_778_000 m
# (the WGS84 GM constant lives in
# `crates/openbmp-physics/src/frames.rs`; see provenance.md for
# derivation). Inclined at 30°:
#   v_y = v_circ · cos(30°),   v_z = v_circ · sin(30°).
initial_velocity_eci_m_s = [0.0, 6_641.108_553, 3_834.553_092]

[vehicle.assembly]
id = "leo-orbit-egm2008"

[[vehicle.assembly.bodies]]
id          = "main"
geometry    = { kind = "reference", length_m = 1.0, area_m2 = 1.0 }
dry_mass_kg = 1.0

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "egm2008"
atmosphere    = "none"
wind          = "none"

[forces]
models = ["gravity"]

[telemetry]
output.parquet = "out/leo-orbit-egm2008.parquet"

[validation]
require_finite_state = true
require_monotonic_time = true

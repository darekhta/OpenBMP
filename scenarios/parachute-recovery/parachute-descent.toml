openbmp.scenario = 3

[meta]
name        = "parachute-descent"
description = "Exit-criterion: point-mass vehicle with two-stage drogue + main recovery driven by mission events. Demonstrates the full recovery-rack hot path. Synthetic; not a benchmark."
validation  = "experimental"

[time]
start_s = 0.0
stop_s  = 120.0
dt_s    = 0.01
seed    = 0x52_6563_6f76_6572   # "Recover"

[vehicle]
kind                     = "point_mass"
initial_position_eci_m   = [0.0, 0.0, 1000.0]
initial_velocity_eci_m_s = [0.0, 0.0, 50.0]

[vehicle.assembly]
id = "parachute-descent"

[[vehicle.assembly.bodies]]
id            = "main"
geometry      = { kind = "reference", length_m = 1.0, area_m2 = 0.05 }
dry_mass_kg   = 5.0

# Two-stage drogue + main parachute. Drogue area is small (decelerates
# the vehicle from terminal-velocity-no-chute to a manageable rate
# before main inflation). Main area is large (slow descent to safe
# touchdown). Coefficients per Knacke 1992 Chapter 5 typical values.
[[vehicle.assembly.recovery]]
id   = "dual_chute"
kind = { kind = "drogue_main", drogue_c_d = 1.0, drogue_area_m2 = 0.5, main_c_d = 1.5, main_area_m2 = 4.0 }

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "us_standard_1976"
wind          = "none"

[atmosphere]
kind = "us_standard_1976"

[telemetry]
output.parquet = "out/parachute-descent.parquet"

[validation]
require_finite_state   = true
require_monotonic_time = true

[mission]
initial_phase = "ascent"

[[mission.phases]]
id    = "ascent"
label = "ascent"

[[mission.phases]]
id    = "drogue_descent"
label = "drogue_descent"

[[mission.phases]]
id    = "main_descent"
label = "main_descent"

# Apogee fires `deploy_drogue` against the dual_chute device.
[[mission.events]]
id      = "evt_apogee"
trigger = { kind = "at_apogee" }
action = { kind = "emit_telemetry_marker", tag = "evt_apogee" }

# Apogee fires `deploy_drogue` against the dual_chute device.
[[scenario_script.events]]
id      = "evt_apogee"
trigger = { kind = "at_apogee" }
action  = { kind = "deploy_recovery", id = "dual_chute", command = "deploy_drogue" }

# Crossing 300 m AGL on the way down fires `deploy_main`.
[[mission.events]]
id      = "evt_main"
trigger = { kind = "at_altitude_descending", altitude_m = 300.0 }
action = { kind = "emit_telemetry_marker", tag = "evt_main" }

# Crossing 300 m AGL on the way down fires `deploy_main`.
[[scenario_script.events]]
id      = "evt_main"
trigger = { kind = "at_altitude_descending", altitude_m = 300.0 }
action  = { kind = "deploy_recovery", id = "dual_chute", command = "deploy_main" }

# Phase transitions tracking the recovery state machine.
[[mission.transitions]]
from  = "ascent"
to    = "drogue_descent"
event = "evt_apogee"

[[mission.transitions]]
from  = "drogue_descent"
to    = "main_descent"
event = "evt_main"

[scenario_script]

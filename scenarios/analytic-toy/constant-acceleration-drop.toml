# Constant-acceleration drop — analytic-toy scenario.
#
# A 1 kg point mass at the ECI origin with zero initial velocity falls
# under constant gravity magnitude g = 9.80665 m/s² along -z for 10 s. The
# closed-form solution is
#
#   z(t) = -0.5 g t²,
#   vz(t) = -g t,
#
# which the kernel's RK4 fixed-step integrator reproduces exactly for a
# constant force on a constant mass. This scenario is the
# end-to-end validation case described in `docs/verification.md`.

openbmp.scenario = 2

[meta]
name = "constant-acceleration-drop"
description = "1 kg point mass dropped under constant gravity for 10 s; analytic-toy validation."
validation = "validated-toy"
provenance = "synthetic; closed-form drop under constant gravity; no external data"

[time]
start_s = 0.0
stop_s = 10.0
dt_s = 0.01
seed = 0x0afe_f00d_dead_beef

[vehicle]
kind = "point_mass"
initial_position_eci_m = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id = "drop-test"

[[vehicle.assembly.bodies]]
id          = "main"
geometry    = { kind = "reference", length_m = 1.0, area_m2 = 1.0 }
dry_mass_kg = 1.0

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "none"
wind          = "none"

# `[forces]` is optional and the loader auto-derives
# `["gravity"]` from this minimal scenario when omitted. The
# explicit declaration is retained because the parser unit tests in
# `crates/openbmp-scenario/src/scenario.rs` substitute on this line
# to construct negative test variants. Drop the block to exercise
# the auto-derivation path.
[forces]
models = ["gravity"]

[telemetry]
output.csv = "out/constant-acceleration-drop.csv"
output.parquet = "out/constant-acceleration-drop.parquet"

[validation]
require_finite_state = true
require_monotonic_time = true

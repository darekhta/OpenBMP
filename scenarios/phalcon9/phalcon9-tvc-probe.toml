# Phalcon-9 TVC probe — validate closed-loop engine-gimbal thrust-vector
# control tracking an ascent pitch program. DEMONSTRATION ARTIFACT;
# wholly synthetic (see provenance.md).
#
# Single-stage rigid body under CONSTANT gravity (no aero -> attitude is
# neutrally stable, a clean double integrator for the TVC loop). The
# flight controller (EKF + three-loop autopilot + ascent-reference
# guidance) steers by gimbaling the engine cluster (thrust_vector_control
# = true). The pitch program holds vertical, then pitches over to ~0.5 rad
# (~29 deg). Success = the vehicle's thrust axis (body +z) tracks the
# commanded pitch and the trajectory bends downrange, without diverging.
#
# This is the control-loop proof; the two-stage orbital ascent builds on
# it.

openbmp.scenario = 3

[meta]
name        = "phalcon9-tvc-probe"
description = "Phalcon-9 single-stage TVC probe: closed-loop engine-gimbal steering tracks an ascent pitch program. Synthetic; not a benchmark."
validation  = "experimental"
provenance  = "Wholly synthetic control-loop probe; rounded figures, not a fielded-vehicle model. See scenarios/phalcon9/provenance.md."

[time]
start_s = 0.0
stop_s  = 40.0
dt_s    = 0.01
seed    = 0x5476635f70726f62   # "Tvc_prob"

[vehicle]
kind                                = "rigid_body"
initial_position_eci_m              = [0.0, 0.0, 0.0]
initial_velocity_eci_m_s            = [0.0, 0.0, 0.0]
initial_quaternion_body_to_eci_xyzw = [0.0, 0.0, 0.0, 1.0]
initial_angular_velocity_body_rad_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id             = "phalcon9-probe"
cluster_layout = "octaweb"

# Body origin is placed AT the vehicle CG (cluster moment is computed
# about the body origin), so the engine plane 12 m below the origin
# gives the gimbal a real pitch/yaw moment arm.
[[vehicle.assembly.bodies]]
id                     = "core"
geometry               = { kind = "cylinder", length_m = 30.0, diameter_m = 3.7 }
dry_mass_kg            = 20_000.0
dry_cg_body_m          = [0.0, 0.0, 0.0]
dry_inertia_body_kg_m2 = [[1.0e7, 0.0, 0.0], [0.0, 1.0e7, 0.0], [0.0, 0.0, 2.0e5]]

[[vehicle.assembly.tanks]]
id                    = "prop"
mounted_to            = "core"
mount_point_body_m    = [0.0, 0.0, 0.0]
geometry              = { kind = "cylinder", radius_m = 1.85, height_m = 11.0 }
propellant            = { density_kg_m3 = 1030.0, label = "synthetic_kerolox_bulk" }
initial_fill_fraction = 1.0
moving_mass           = { kind = "rigid_liquid" }

# 9-engine octaweb cluster (1 center + 8 ring); each 854 kN, Isp 300 s,
# drawing from `prop`, gimbal limit 5 deg for TVC.
[[vehicle.assembly.engines]]
id = "eng_0"
mounted_to = "core"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, 0.0, -12.0]
limits = { max_thrust_n = 854_000.0, isp_s = 300.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "prop", feed = "regulated", residual_reserve_kg = 50.0 }


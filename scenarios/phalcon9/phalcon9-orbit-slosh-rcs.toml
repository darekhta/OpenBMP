# Coast: RCS attitude hold against slosh. The rate-loop output is the RCS
# torque demand (uncapped to the RCS range), so the limits here are large.
# Strong rate damping (high rate_kd) arrests the slosh-driven body rates;
# moderate attitude_kp holds the coast reference without chasing it

# Phalcon-9 — synthetic two-stage launch vehicle: closed-loop ORBITAL
# INSERTION WITH PROPELLANT SLOSH + RCS COAST ATTITUDE HOLD.
# DEMONSTRATION ARTIFACT; wholly synthetic (rounded, order-of-magnitude
# class figures, not a fielded-vehicle model; see provenance.md).
#
# This is the slosh-coupled-closure variant of `phalcon9-orbit`. It is
# identical to that scenario EXCEPT:
#
#   1. The upper-stage propellant tank (`s2_prop`) carries an
#      EquivalentPendulum SLOSH model with a non-zero initial
#      perturbation, instead of the rigid-liquid placeholder. Slosh on the
#      stage-2 tank is what survives stage separation and couples into the
#      light upper stage during the unpowered coast.
#
#   2. The upper stage carries a REACTION CONTROL SYSTEM (RCS): three
#      body-axis `direct_torque` effectors (roll / pitch / yaw). RCS is the
#      ONLY active attitude authority with the main engines off — the
#      gimbal is dead in coast (no thrust to vector) and there is no
#      aerodynamic moment in vacuum. With the corrected specific-force and
#      capillary slosh model, disabling the RCS no longer produces the old
#      runaway tumble; instead the RCS damps the residual slosh-driven rate
#      and leaves the stage well pointed for circularisation, inserting to a
#      bound near-circular LEO that holds steady to the end of the run.
#
#   3. The freefall slosh dynamics are made WELL-POSED so the insertion is a
#      genuinely stable orbit, not a burn-cutoff snapshot. Two coupled fixes
#      (see the s2_prop tank block and crates/openbmp-runner/src/rigid_body.rs):
#        (a) the runner feeds the slosh model the SPECIFIC force (proper,
#            non-gravitational acceleration = total − gravity), not the
#            gravity-laden kinematic acceleration, so gravity does not
#            spuriously drive the pendulum in coast; and
#        (b) the tank carries a capillary surface-wave restoring term, derived
#            from surface tension, density, tank radius, and fill height, plus
#            critical damping in the capillary-dominated regime, so the
#            freefall slosh is asymptotically stable.
#      Together the coast slosh is asymptotically stable and its reaction
#      force remains bounded; without them an undamped, gravity-forced
#      freefall pendulum self-excites and can drift the orbit over minutes.
#
# WHY THIS IS NOT DOUBLE-ACTUATION IN POWERED FLIGHT: the autopilot's
# three-axis rate-loop output is interpreted per phase. During the powered
# ascent and circularise burns the engine GIMBAL carries pitch/yaw (the
# rate-loop output is a small gimbal-angle command, ~0.087 rad cap) and the
# RCS contribution on those axes is negligible because the loop is
# converged (steady-state rate-loop output is tiny; the per-phase output
# cap stays at the gimbal limit). During the engines-off coast the same
# rate-loop output is uncapped to the RCS torque range and the RCS provides
# the authority. The RCS effectiveness is sized so the powered-phase
# spurious torque is a negligible fraction of the gimbal moment while the
# coast authority is sufficient to damp the residual slosh rate.
#
# Forward-only: vehicle-intrinsic ascent toward an insertion RADIUS; no
# target / aimpoint / range / terminal-guidance field anywhere. RCS is an
# attitude-control subsystem (body-frame torque), not a guidance or
# targeting capability.

openbmp.scenario = 3

[meta]
name        = "phalcon9-orbit-slosh-rcs"
description = "Phalcon-9 synthetic two-stage closed-loop orbital insertion WITH upper-stage propellant slosh + RCS coast attitude hold. The RCS damps the slosh-driven post-separation coast rate so circularisation stays well pointed. Synthetic; not a benchmark."
validation  = "validated-toy"
provenance  = "Wholly synthetic two-stage kerolox vehicle; rounded class figures, not validated against any fielded vehicle. Slosh-coupled INSERTION is validated against first-principles orbital-mechanics invariants (vis-viva bound near-circular LEO) by crates/openbmp-cli/tests/phalcon9_orbit_slosh_rcs_e2e.rs — analytic references only, no real-vehicle data. See scenarios/phalcon9/provenance.md."

[time]
start_s = 0.0
# Same 1000 s as phalcon9-orbit: with the freefall slosh well-posedness fix
# the coast is no longer perturbed, so the apogee arrival and PEG
# circularisation timing match the no-slosh baseline; the extra time after
# burn cutoff lets the test confirm the inserted orbit is stable (no drift).
stop_s  = 1000.0
dt_s    = 0.02
seed    = 0x5068616c39736c68   # "Phal9slh"

[vehicle]
kind                                = "rigid_body"
# Equatorial due-east launch under uniform Earth rotation (see
# phalcon9-orbit.toml for the full attitude/co-rotation rationale).
initial_position_eci_m              = [6_370_000.0, 0.0, 0.0]
initial_velocity_eci_m_s            = [0.0, 464.5, 0.0]
initial_quaternion_body_to_eci_xyzw = [0.0, 0.70710678118654752, 0.0, 0.70710678118654752]
initial_angular_velocity_body_rad_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id             = "phalcon9"
cluster_layout = "octaweb"

# Stage 1 ("lower"): booster structure + 9-engine cluster + stage-1 tank.
[[vehicle.assembly.bodies]]
id                     = "lower"
geometry               = { kind = "cylinder", length_m = 30.0, diameter_m = 3.7 }
dry_mass_kg            = 10_000.0
dry_cg_body_m          = [0.0, 0.0, -2.0]
dry_inertia_body_kg_m2 = [[3.0e7, 0.0, 0.0], [0.0, 3.0e7, 0.0], [0.0, 0.0, 5.0e5]]

# Stage 2 + payload ("upper"): stage-2 dry + payload, vacuum engine,
# stage-2 tank.
[[vehicle.assembly.bodies]]
id                     = "upper"
geometry               = { kind = "cylinder", length_m = 11.0, diameter_m = 3.7 }
dry_mass_kg            = 9_000.0
dry_cg_body_m          = [0.0, 0.0, 16.0]
dry_inertia_body_kg_m2 = [[1.2e6, 0.0, 0.0], [0.0, 1.2e6, 0.0], [0.0, 0.0, 6.0e4]]

# Stage-1 propellant (mounted to `lower`). ~250 t at full fill.
[[vehicle.assembly.tanks]]
id                    = "s1_prop"
mounted_to            = "lower"
mount_point_body_m    = [0.0, 0.0, -2.0]
geometry              = { kind = "cylinder", radius_m = 1.85, height_m = 49.8 }
propellant            = { density_kg_m3 = 1030.0, label = "synthetic_kerolox_bulk" }
initial_fill_fraction = 1.0
moving_mass           = { kind = "rigid_liquid" }

# Stage-2 propellant (mounted to `upper`). ~40 t at full fill.
# SLOSH: EquivalentPendulum dynamics with a small initial perturbation on
# both transverse slosh axes. This is the disturbance the RCS must arrest
# through the coast.
[[vehicle.assembly.tanks]]
id                    = "s2_prop"
mounted_to            = "upper"
mount_point_body_m    = [0.0, 0.0, 15.0]
geometry              = { kind = "cylinder", radius_m = 1.85, height_m = 0.9 }
propellant            = { density_kg_m3 = 1030.0, label = "synthetic_kerolox_bulk" }
initial_fill_fraction = 1.0
# The freefall restoring term is the capillary surface-wave contribution
# omega_cap^2 = (sigma / rho) * k^3 * tanh(kh), k = 1.841 / radius. The
# surface-tension value is a public/textbook kerosene-class order-of-magnitude
# property for the synthetic bulk propellant, not a fitted trajectory
# frequency. In coast the axial-thrust restoring vanishes; this term keeps the
# freefall pendulum asymptotically stable without the former hand-picked
# freefall-frequency scalar.
moving_mass           = { kind = "equivalent_pendulum", damping_ratio_zeta = 0.005, freefall_restoring = { kind = "capillary_surface_wave", surface_tension_n_m = 0.026, damping_ratio_zeta = 1.0 } }
initial_slosh         = { angles_rad = [0.04, 0.03], rates_rad_s = [0.0, 0.0] }

# Stage-1 cluster: 1 center + 8 ring, each 854 kN, Isp 340 s, from
# s1_prop, gimballed for TVC.
[[vehicle.assembly.engines]]
id = "eng_s1_0"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, 0.0, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_1"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [1.6, 0.0, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_2"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [1.13137, 1.13137, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_3"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, 1.6, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_4"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [-1.6, 0.0, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_5"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [-1.13137, 1.13137, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_6"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [-1.13137, -1.13137, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_7"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, -1.6, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

[[vehicle.assembly.engines]]
id = "eng_s1_8"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [1.13137, -1.13137, -14.0]
limits = { max_thrust_n = 854_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }

# Stage-2 vacuum engine (mounted to `upper`): 981 kN, Isp 348 s, from
# s2_prop, gimballed for TVC. Below the upper-stage CG for a pitch arm.
[[vehicle.assembly.engines]]
id = "eng_vac"
mounted_to = "upper"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, 0.0, 10.0]
limits = { max_thrust_n = 981_000.0, isp_s = 348.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s2_prop", feed = "regulated", residual_reserve_kg = 50.0 }

# Upper-stage REACTION CONTROL SYSTEM: three body-axis direct_torque
# effectors. effectiveness_n_m_per_rad = 6000 converts the autopilot's
# normalized rate-loop output into a body torque. Symmetric ±2 command range
# -> 12 kN*m per axis at saturation, corresponding to ~0.01 rad/s^2 angular
# acceleration on the declared ~1.2e6 kg*m2 transverse inertia. This is a
# hardware-style torque-capacity anchor, not a value fitted to this
# trajectory. In the powered phases the rate-loop output is capped at the
# gimbal limit (0.087), so the RCS contributes at most ~0.5 kN*m there —
# negligible against the engine gimbal moment (hundreds of kN*m) and, on the
# otherwise-ungimballed roll axis, a small roll-damping path. The high
# max_rate_per_s models a fast cold-gas / monopropellant RCS that tracks the
# command within a control step.
[[vehicle.assembly.effectors]]
id               = "rcs_roll"
mounted_to       = "upper"
kind             = { kind = "direct_torque", axis = "roll", effectiveness_n_m_per_rad = 6000.0 }
limits           = { min = -2.0, max = 2.0, max_rate_per_s = 1000.0, deadband = 0.0, latency_s = 0.0 }
initial_position = 0.0
unit             = "rad"

[[vehicle.assembly.effectors]]
id               = "rcs_pitch"
mounted_to       = "upper"
kind             = { kind = "direct_torque", axis = "pitch", effectiveness_n_m_per_rad = 6000.0 }
limits           = { min = -2.0, max = 2.0, max_rate_per_s = 1000.0, deadband = 0.0, latency_s = 0.0 }
initial_position = 0.0
unit             = "rad"

[[vehicle.assembly.effectors]]
id               = "rcs_yaw"
mounted_to       = "upper"
kind             = { kind = "direct_torque", axis = "yaw", effectiveness_n_m_per_rad = 6000.0 }
limits           = { min = -2.0, max = 2.0, max_rate_per_s = 1000.0, deadband = 0.0, latency_s = 0.0 }
initial_position = 0.0
unit             = "rad"

[environment]
frame_profile = "wgs84-uniform-rotation"
gravity       = "egm2008"
atmosphere    = "us_standard_1976"
wind          = "none"
magnetic      = "wmm_2025"

[atmosphere]
kind = "us_standard_1976"

[frames]
profile = "wgs84-uniform-rotation"

[frames.local_origin]
latitude_deg  = 0.0
longitude_deg = 0.0
height_m      = 0.0
source        = "Synthetic equatorial launch site (lat 0, lon 0) for the due-east demo; not a real range."

[forces]
models = ["gravity", "thrust", "aero"]

[aero]
deck        = "../../data/aero/phalcon9-drag.toml"
deck_sha256 = "88259d8f3400538535be070ce4d6045a1c24b38033267dc9e326780cc927921f"
mounted_to  = "lower"

[sensors.imu]
kind = "imu"
file = "../../data/sensors/imu-tactical.toml"

[sensors.gnss]
kind = "gnss"
file = "../../data/sensors/gnss-textbook.toml"

[sensors.star_tracker]
kind = "star_tracker"
file = "../../data/sensors/star-tracker-textbook.toml"

[telemetry]
output.csv = "out/phalcon9-orbit-slosh-rcs.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

[mission]
initial_phase = "mission.phases.powered_ascent"

[[mission.phases]]
id              = "mission.phases.powered_ascent"
label           = "stage-1 closed-loop ascent (TVC)"
allowed_engines = ["eng_s1_0", "eng_s1_1", "eng_s1_2", "eng_s1_3", "eng_s1_4", "eng_s1_5", "eng_s1_6", "eng_s1_7", "eng_s1_8"]
allowed_effectors = ["rcs_roll", "rcs_pitch", "rcs_yaw"]

[[mission.phases]]
id              = "mission.phases.coast"
label           = "post-MECO coast to apogee (booster jettisoned; RCS holds attitude against slosh)"
allowed_engines = []
allowed_effectors = ["rcs_roll", "rcs_pitch", "rcs_yaw"]

[[mission.phases]]
id              = "mission.phases.circularize"
label           = "stage-2 PEG circularisation (TVC)"
allowed_engines = ["eng_vac"]
allowed_effectors = ["rcs_roll", "rcs_pitch", "rcs_yaw"]

[[mission.phases]]
id              = "mission.phases.orbit"
label           = "orbital insertion (engines idle)"
allowed_engines = ["eng_vac"]
allowed_effectors = ["rcs_roll", "rcs_pitch", "rcs_yaw"]

# Stage-1 ignition: light the cluster just after t=0.
[[mission.events]]
id = "ign_0"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_0", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_1"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_1", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_2"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_2", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_3"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_3", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_4"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_4", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_5"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_5", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_6"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_6", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_7"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_7", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_8"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_8", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_vac"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_vac", command = { throttle_unit = 0.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }

# MECO-1: end the stage-1 burn at V1 (sets the coast apogee).
[[mission.events]]
id      = "meco1"
once    = true
trigger = { kind = "at_velocity", velocity_m_s = 7235.0, falling = false }
action  = { kind = "emit_telemetry_marker", tag = "meco1" }

# Stage separation: jettison the spent booster at MECO-1.
[[mission.events]]
id      = "sep"
once    = true
trigger = { kind = "at_velocity", velocity_m_s = 7235.0, falling = false }
action  = { kind = "jettison_stage", body = "lower" }

# Apogee marker: drives the coast -> circularize transition.
[[mission.events]]
id      = "apogee"
once    = false
trigger = { kind = "at_apogee" }
action  = { kind = "emit_telemetry_marker", tag = "apogee" }

# SECO: cut on the PEG time-to-go at orbital insertion.
[[mission.events]]
id      = "seco"
once    = true
trigger = { kind = "at_guidance_cutoff", time_to_go_s = 0.0 }
action  = { kind = "emit_telemetry_marker", tag = "seco" }

[[mission.transitions]]
from  = "mission.phases.powered_ascent"
to    = "mission.phases.coast"
event = "meco1"
[[mission.transitions]]
from  = "mission.phases.coast"
to    = "mission.phases.circularize"
event = "apogee"
[[mission.transitions]]
from  = "mission.phases.circularize"
to    = "mission.phases.orbit"
event = "seco"

[multi_body]
[[multi_body.separation]]
event_id               = "sep"
upper_body_id          = "upper"
lower_body_id          = "lower"
upper_delta_v_body_m_s = [0.0, 0.0, 0.3]
lower_delta_v_body_m_s = [0.0, 0.0, -0.3]
conserve_momentum      = false

[fc]
estimator        = "ekf"
autopilot        = "three_loop"
guidance         = "ascent_reference"
base_rate_hz     = 50
frame_budget_us  = 4000

# RCS allocation: prioritised-redistributed allocator over the three
# direct_torque effectors (one per body axis). With one effector per axis
# this is a pass-through; it is the wired path that routes the autopilot's
# per-axis rate-loop demand to the body-torque effectors.
[fc.actuator_channels]
aileron  = "rcs_roll"
elevator = "rcs_pitch"
rudder   = "rcs_yaw"

[fc.autopilot_allocation]
kind          = "prioritised_redistributed"
axis_priority = ["roll", "pitch", "yaw"]

[fc.ascent_reference_by_phase."mission.phases.powered_ascent"]
method             = "closed_loop_insertion"
insertion_radius_m = 6_625_000.0
k_alt_rad_per_m    = 1.6e-5
k_vr_rad_per_m_s   = 2.0e-3
theta_min_rad      = -0.70
theta_max_rad      = 1.45
downrange_axis_eci = [0.0, 1.0, 0.0]
orbital_plane_normal_eci = [0.0, 0.0, 1.0]
k_cross_rad_per_m_s      = 0.0
psi_max_rad              = 0.15

[fc.ascent_reference_by_phase."mission.phases.circularize"]
method                    = "peg"
# Target a ~340 km LEO circularisation radius, matching the coast apoapsis
# delivered by the public-thrust Falcon-class ascent. Keeping the old lower
# radius made PEG command an inward radial component during circularisation and
# cut off eccentric.
insertion_radius_m        = 6_710_000.0
exhaust_velocity_m_s      = 3413.0

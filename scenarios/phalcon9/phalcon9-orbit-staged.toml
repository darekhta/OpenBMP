# Phalcon-9 — synthetic two-stage launch vehicle: full closed-loop
# ORBITAL INSERTION. DEMONSTRATION ARTIFACT; wholly synthetic (rounded,
# order-of-magnitude class figures, not a fielded-vehicle model; see
# provenance.md).
#
# A two-stage rigid-body stack launches from the +x equatorial radial
# (body +z, the engine thrust axis, is rotated to point radially outward
# = ECI +x) and flies a closed-loop ascent to a low circular orbit under
# engine-gimbal thrust-vector control. Profile:
#
#   1. powered_ascent  - stage-1 9-engine cluster; the closed-loop
#                        insertion law lofts the stack toward the
#                        insertion radius, building horizontal velocity.
#                        Max-Q is handled by a CLOSED-LOOP load-relief law
#                        in the autopilot (max_dynamic_pressure_pa): it
#                        computes the real dynamic pressure from the
#                        navigated altitude + air-relative velocity and
#                        throttles down to hold q at the limit — not an
#                        open-loop altitude/time throttle schedule.
#   2. coast           - MECO-1 at velocity V1; stage-1 (`lower`)
#                        jettisoned; ballistic climb to apogee.
#   3. circularize     - at apogee the stage-2 vacuum engine ignites and
#                        Powered Explicit Guidance (PEG) trims the orbit
#                        in its near-horizontal terminal regime. PEG steers
#                        and the `seco` event cuts the engine on the PEG
#                        time-to-go reaches zero, leaving
#                        propellant margin — a CONTROLLED cutoff, not a
#                        propellant-limited burn-to-depletion.
#   4. orbit           - engines idle (eng_vac gated to throttle 0 via
#                        [fc.phase_authority]; see that block).
#
# Per-phase guidance ([fc.ascent_reference_by_phase]): closed-loop
# insertion on the booster, PEG on the upper stage. Navigation is an
# EGM2008-gravity EKF seeded from the launch state, fed by a
# navigation-grade (tactical) IMU + GNSS + a STAR TRACKER (an independent
# full-attitude fix the EKF fuses via update_star_tracker; see the sensors
# block — it closes the off-pole attitude-observability gap that a single
# magnetometer left open). The EKF gates GNSS as independent position and
# velocity blocks, so a velocity-innovation spike under thrust rejects only
# velocity and never drops the position fix. Frame: wgs84-uniform-rotation
# (uniform Earth rotation); the launch boost is carried by the initial
# co-rotation velocity.

openbmp.scenario = 3

[meta]
name        = "phalcon9-orbit-staged"
description = "Phalcon-9 synthetic two-stage orbital insertion with the full discrete mission sequence: booster separation, payload-fairing jettison (coast), and payload deploy (in orbit). Synthetic; not a benchmark."
validation  = "validated-toy"
provenance  = "Wholly synthetic two-stage kerolox vehicle; rounded class figures, not validated against any fielded vehicle. The INSERTION is validated against first-principles orbital-mechanics invariants (vis-viva bound near-circular LEO; axial angular momentum + specific energy conserved on the coast) by crates/openbmp-cli/tests/phalcon9_orbit_validation.rs — analytic references only, no real-vehicle data. See scenarios/phalcon9/provenance.md."

[time]
start_s = 0.0
stop_s  = 1000.0
dt_s    = 0.02
seed    = 0x5068616c39306f72   # "Phal9or"

[vehicle]
kind                                = "rigid_body"
# Equatorial due-east launch under uniform Earth rotation. The launch
# site sits on the equator at ECI +x at t=0; body +z (the thrust axis)
# points radially out = ECI +x (a +90 deg rotation about ECI +y), and
# body +y points east = ECI +y (the prograde / downrange direction, which
# is also the direction of Earth rotation). The vehicle starts co-rotating
# with the surface, so its inertial velocity is the eastward surface speed
# Omega_e * R = 7.2921151467e-5 * 6.370e6 ~= 464.5 m/s (+y). The runner
# does NOT auto-add co-rotation, so the full ECI velocity is given here.
initial_position_eci_m              = [6_370_000.0, 0.0, 0.0]
initial_velocity_eci_m_s            = [0.0, 464.5, 0.0]
initial_quaternion_body_to_eci_xyzw = [0.0, 0.70710678118654752, 0.0, 0.70710678118654752]
initial_angular_velocity_body_rad_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id             = "phalcon9"
cluster_layout = "octaweb"

# Stage 1 ("lower"): booster structure + 9-engine cluster + stage-1 tank.
[[vehicle.assembly.bodies]]
id                     = "lower"
geometry               = { kind = "cylinder", length_m = 30.0, diameter_m = 3.7 }
dry_mass_kg            = 10_000.0
dry_cg_body_m          = [0.0, 0.0, -2.0]
dry_inertia_body_kg_m2 = [[3.0e7, 0.0, 0.0], [0.0, 3.0e7, 0.0], [0.0, 0.0, 5.0e5]]

# Stage 2 + payload ("upper"): stage-2 dry + payload, vacuum engine,
# stage-2 tank.
# Stage 2 ("upper") split from the lumped 9000 kg into stage-2 dry +
# fairing + payload at the SAME CG with PROPORTIONAL inertia, so the
# combined body is identical to the flagship (mass 9000, CG [0,0,16],
# inertia diag [1.2e6,1.2e6,6e4]) and the pre-jettison dynamics match.
[[vehicle.assembly.bodies]]
id                     = "upper"
geometry               = { kind = "cylinder", length_m = 11.0, diameter_m = 3.7 }
dry_mass_kg            = 6_900.0
dry_cg_body_m          = [0.0, 0.0, 16.0]
dry_inertia_body_kg_m2 = [[0.92e6, 0.0, 0.0], [0.0, 0.92e6, 0.0], [0.0, 0.0, 4.6e4]]

[[vehicle.assembly.bodies]]
id                     = "fairing"
geometry               = { kind = "cylinder", length_m = 6.0, diameter_m = 3.7 }
dry_mass_kg            = 600.0
dry_cg_body_m          = [0.0, 0.0, 16.0]
dry_inertia_body_kg_m2 = [[0.08e6, 0.0, 0.0], [0.0, 0.08e6, 0.0], [0.0, 0.0, 0.4e4]]

[[vehicle.assembly.bodies]]
id                     = "payload"
geometry               = { kind = "cylinder", length_m = 2.0, diameter_m = 2.0 }
dry_mass_kg            = 1_500.0
dry_cg_body_m          = [0.0, 0.0, 16.0]
dry_inertia_body_kg_m2 = [[0.20e6, 0.0, 0.0], [0.0, 0.20e6, 0.0], [0.0, 0.0, 1.0e4]]

# Stage-1 propellant (mounted to `lower`). ~220 t at full fill.
[[vehicle.assembly.tanks]]
id                    = "s1_prop"
mounted_to            = "lower"
mount_point_body_m    = [0.0, 0.0, -2.0]
geometry              = { kind = "cylinder", radius_m = 1.85, height_m = 19.86 }
propellant            = { density_kg_m3 = 1030.0, label = "synthetic_kerolox_bulk" }
initial_fill_fraction = 1.0
moving_mass           = { kind = "rigid_liquid" }

# Stage-2 propellant (mounted to `upper`). ~55 t at full fill.
[[vehicle.assembly.tanks]]
id                    = "s2_prop"
mounted_to            = "upper"
mount_point_body_m    = [0.0, 0.0, 15.0]
geometry              = { kind = "cylinder", radius_m = 1.85, height_m = 4.97 }
propellant            = { density_kg_m3 = 1030.0, label = "synthetic_kerolox_bulk" }
initial_fill_fraction = 1.0
moving_mass           = { kind = "rigid_liquid" }

# Stage-1 cluster: 1 center + 8 ring, each 433 kN, Isp 340 s, from
# s1_prop, gimballed for TVC.
[[vehicle.assembly.engines]]
id = "eng_s1_0"
mounted_to = "lower"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, 0.0, -14.0]
limits = { max_thrust_n = 433_000.0, isp_s = 340.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }
propellant = { oxidizer_fuel_ratio = 0.0, fuel_tank = "s1_prop", feed = "regulated", residual_reserve_kg = 50.0 }


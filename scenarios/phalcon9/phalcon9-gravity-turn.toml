# Phalcon-9 closed-loop ORBITAL INSERTION under EGM2008 gravity.
# DEMONSTRATION ARTIFACT; wholly synthetic (see provenance.md).
#
# A single-stage rigid body launches from the +z pole (so radial-up =
# ECI +z) and flies a full two-burn ascent to a low circular orbit under
# engine-gimbal thrust-vector control: EKF navigation + three-loop
# autopilot + closed-loop insertion guidance (fc.ascent_reference,
# method = "closed_loop_insertion"). The EKF uses the EGM2008 central
# gravity nav model (fc.ekf.gravity_model = "egm2008") matching the truth
# field, is seeded from the known launch state, and carries position /
# velocity process noise so the navigation solution stays valid through
# the long ballistic coast.
#
# Mission profile (phases gate engine throttle; the FC owns it):
#   1. powered_ascent  - all 9 engines; the closed-loop law lofts the
#                        vehicle and builds horizontal velocity.
#   2. coast           - MECO1 at ~6.6 km/s; engines idled (throttle 0,
#                        not shut down); ballistic climb to apogee.
#   3. circularize     - re-throttled at apogee (radial velocity ~0); the
#                        same law thrusts prograde to raise perigee.
#   4. orbit           - SECO at circular velocity; engines idled.
#
# RESULT (verified from telemetry): a bound, sustainable low Earth orbit,
# perigee ~245 km x apogee ~535 km, eccentricity ~0.02. Specific orbital
# energy is negative (closed orbit) and perigee is well above the
# atmosphere, so it does not decay. See scenarios/phalcon9/provenance.md.
#
# Forward-only: no target/aimpoint/range fields (the guidance steers from
# the live state toward an insertion RADIUS, not a ground location).

openbmp.scenario = 3

[meta]
name        = "phalcon9-gravity-turn"
description = "Phalcon-9 synthetic single-stage-to-orbit TVC ascent under EGM2008 gravity: closed-loop engine-gimbal gravity turn toward orbital insertion. Synthetic; not a benchmark."
validation  = "experimental"
provenance  = "Wholly synthetic control-loop probe; rounded figures, not a fielded-vehicle model. See scenarios/phalcon9/provenance.md."

[time]

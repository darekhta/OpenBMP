[environment]
frame_profile = "wgs84-uniform-rotation"
gravity       = "egm2008"
atmosphere    = "us_standard_1976"
wind          = "none"
magnetic      = "wmm_2025"

[atmosphere]
# US Standard Atmosphere 1976 (0-86 km); zero density above the ceiling
# (the exoatmospheric coast/insertion sees no drag). The aero altitude is
# geocentric (|r| - R_earth), so the equatorial ascent climbs out of the
# atmosphere correctly rather than reading sea level the whole way up.
kind = "us_standard_1976"

[frames]
profile = "wgs84-uniform-rotation"

[frames.local_origin]
latitude_deg  = 0.0
longitude_deg = 0.0
height_m      = 0.0
source        = "Synthetic equatorial launch site (lat 0, lon 0) for the due-east demo; not a real range."

[forces]
models = ["gravity", "thrust", "aero"]

[aero]
# Synthetic axial-drag deck (Cd vs Mach at 0 AoA). See the deck header and
# data/aero/provenance.md. Pinned by SHA-256 so edits are caught at load.
# Mounted on the booster (`lower`): the dense-atmosphere ascent happens
# while the full stack is together; the booster is jettisoned near MECO at
# high altitude where the remaining drag is negligible.
deck        = "../../data/aero/phalcon9-drag.toml"
deck_sha256 = "5aace6c7185d536bd09dae8d2640b3a0c15e35527ca577dd5333e069fb7dcec2"
mounted_to  = "lower"

[sensors.imu]
kind = "imu"
file = "../../data/sensors/imu-tactical.toml"

[sensors.gnss]
kind = "gnss"
file = "../../data/sensors/gnss-textbook.toml"

# No magnetometer: a launch vehicle navigates attitude with its
# navigation-grade IMU (gyro) + GNSS, not a magnetometer. A single
# magnetometer cannot observe rotation about the local field direction;
# at this equatorial launch that unobservable axis is the orbital-plane
# normal, so a magnetometer (with any hard-iron bias) drives the attitude
# estimate out of plane. The tactical IMU's gyro holds attitude through
# the powered ascent, so the magnetometer is both unrealistic here and
# actively harmful. See task #23 / provenance.md.

[telemetry]
output.csv = "out/phalcon9-orbit.csv"

[validation]
require_finite_state   = true
require_monotonic_time = true

[mission]
initial_phase = "mission.phases.powered_ascent"

[[mission.phases]]
id              = "mission.phases.powered_ascent"
label           = "stage-1 closed-loop ascent (TVC)"
allowed_engines = ["eng_s1_0", "eng_s1_1", "eng_s1_2", "eng_s1_3", "eng_s1_4", "eng_s1_5", "eng_s1_6", "eng_s1_7", "eng_s1_8"]

[[mission.phases]]
id              = "mission.phases.coast"
label           = "post-MECO coast to apogee (booster jettisoned)"
allowed_engines = []

[[mission.phases]]
id              = "mission.phases.circularize"
label           = "stage-2 PEG circularisation (TVC)"
allowed_engines = ["eng_vac"]

[[mission.phases]]
id              = "mission.phases.orbit"
label           = "orbital insertion (engines idle)"
allowed_engines = []

# Stage-1 ignition: light the cluster just after t=0.
[[mission.events]]
id = "ign_0"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_0", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_1"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_1", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_2"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_2", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_3"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_3", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_4"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_4", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_5"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_5", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_6"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_6", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_7"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_7", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
[[mission.events]]
id = "ign_8"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_s1_8", command = { throttle_unit = 1.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }
# Stage-2 vacuum engine: ignited at launch and held Burning at throttle 0
# (it is absent from the powered_ascent/coast allowed_engines, so the mixer
# gates its throttle to zero -> no propellant flow). The circularize phase
# throttles it up; the orbit phase throttles it back to zero (SECO). This
# keeps ignition synchronised with PEG instead of a kernel engine_command
# firing at the truth apogee while the commander phase still lags.
[[mission.events]]
id = "ign_vac"
trigger = { kind = "at_time", time_s = 0.05 }
action = { kind = "engine_command", id = "eng_vac", command = { throttle_unit = 0.0, gimbal_pitch_rad = 0.0, gimbal_yaw_rad = 0.0, ignite = true, shutdown = false } }

# MECO-1: end the stage-1 burn at V1 (sets the coast apogee).
[[mission.events]]
id      = "meco1"
once    = true
trigger = { kind = "at_velocity", velocity_m_s = 7250.0, falling = false }
action  = { kind = "emit_telemetry_marker", tag = "meco1" }

# Stage separation: jettison the spent booster at MECO-1.
[[mission.events]]
id      = "sep"
once    = true
trigger = { kind = "at_velocity", velocity_m_s = 7250.0, falling = false }
action  = { kind = "jettison_stage", body = "lower" }

# Apogee marker: drives the coast -> circularize transition. A commander
# event (engine-command events are kernel-side and cannot drive
# transitions). Not one-shot: the radial climb rate jitters through zero
# at launch, which would consume a one-shot before the real apogee.
[[mission.events]]
id      = "apogee"
once    = false
trigger = { kind = "at_apogee" }
action  = { kind = "emit_telemetry_marker", tag = "apogee" }

# SECO: cut on the PEG time-to-go at orbital insertion.
[[mission.events]]
id      = "seco"
once    = true
trigger = { kind = "at_guidance_cutoff", time_to_go_s = 6.0 }
action  = { kind = "emit_telemetry_marker", tag = "seco" }

[[mission.transitions]]
from  = "mission.phases.powered_ascent"
to    = "mission.phases.coast"
event = "meco1"
[[mission.transitions]]
from  = "mission.phases.coast"
to    = "mission.phases.circularize"
event = "apogee"
[[mission.transitions]]
from  = "mission.phases.circularize"
to    = "mission.phases.orbit"
event = "seco"

[multi_body]
[[multi_body.separation]]
event_id               = "sep"
upper_body_id          = "upper"
lower_body_id          = "lower"
upper_delta_v_body_m_s = [0.0, 0.0, 0.3]
lower_delta_v_body_m_s = [0.0, 0.0, -0.3]
conserve_momentum      = false

[fc]
estimator        = "ekf"
autopilot        = "three_loop"
guidance         = "ascent_reference"
base_rate_hz     = 50
frame_budget_us  = 4000

# Stage-1 booster: closed-loop insertion law lofts toward the insertion
# radius (proven to build a good coast apogee).
[fc.ascent_reference_by_phase."mission.phases.powered_ascent"]
method             = "closed_loop_insertion"
insertion_radius_m = 6_625_000.0
k_alt_rad_per_m    = 1.6e-5
k_vr_rad_per_m_s   = 2.0e-3
theta_min_rad      = -0.70
theta_max_rad      = 1.45
downrange_axis_eci = [0.0, 1.0, 0.0]

# Stage-2 upper: PEG terminal insertion at apogee.
[fc.ascent_reference_by_phase."mission.phases.circularize"]
method                    = "peg"
insertion_radius_m        = 6_652_000.0
exhaust_velocity_m_s      = 3413.0
initial_thrust_accel_m_s2 = 5.0
peg_initial_t_go_s        = 120.0
peg_min_speed_m_s         = 500.0
downrange_axis_eci        = [0.0, 1.0, 0.0]

[fc.ekf]
mag_field                   = "wmm_2025"
gravity_model               = "egm2008"
mag_epoch_decimal_year      = 2025.0
sigma_w_gyro                = 0.01
sigma_w_accel_bias          = 1.0e-4
sigma_w_gyro_bias           = 1.0e-5
sigma_w_position_m          = 5.0
sigma_w_velocity_m_s        = 20.0
tau_gyro_bias_s             = 100.0
tau_accel_bias_s            = 100.0
sigma_gnss_pos_m            = 5.0
sigma_gnss_vel_m_s          = 0.5
sigma_baro_alt_m            = 2.0
sigma_mag_nt                = 100.0
innovation_false_alarm_rate = 0.01
dead_reckon_timeout_s       = 1.5

[fc.autopilot_params]
thrust_vector_control = true
rate_deadband_rad_s   = 0.001
trajectory_loop_enabled = false
trajectory_kind       = "pid"

[fc.health]
imu_stale_after_s   = 0.1
gnss_stale_after_s  = 0.5
baro_stale_after_s  = 10.0
mag_stale_after_s   = 0.2
overrun_burst_count = 5

[fc.fdir]
detector_kind          = "burst_counter"
innovation_threshold   = 25.0
innovation_burst_count  = 5
failsafe_burst_count   = 5

[fc.gain_schedule."mission.phases.powered_ascent"]
rate_kp            = [0.2, 0.2, 0.1]
rate_kd            = [0.05, 0.05, 0.02]
attitude_kp        = [0.7, 0.7, 0.4]
elevator_limit_rad = 0.087
aileron_limit_rad  = 0.087
rudder_limit_rad   = 0.087
throttle_baseline  = 1.0

[fc.gain_schedule."mission.phases.coast"]
rate_kp            = [0.2, 0.2, 0.1]
rate_kd            = [0.05, 0.05, 0.02]
attitude_kp        = [0.7, 0.7, 0.4]
elevator_limit_rad = 0.087
aileron_limit_rad  = 0.087
rudder_limit_rad   = 0.087
throttle_baseline  = 1.0

[fc.gain_schedule."mission.phases.circularize"]

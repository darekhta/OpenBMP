mounted_to = "upper"
kind = { kind = "liquid_engine" }
mount_point_body_m = [0.0, 0.0, 10.0]
limits = { max_thrust_n = 450000.0, isp_s = 348.0, ignition_transient_s = 0.3, shutdown_transient_s = 0.3, max_gimbal_rad = 0.087, gimbal_slew_rad_per_s = 1.0 }

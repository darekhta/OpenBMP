openbmp.scenario = 3

[meta]
name        = "calisto-adaptive"
description = "RocketPy Calisto sounding-rocket validation scenario integrated with the Dormand-Prince 5(4) adaptive + PI step controller (rigid-body runner). Adaptive cross-tool demo."
validation  = "experimental"
provenance  = "RocketPy Calisto example (Souza et al. 2022, https://github.com/RocketPy-Team/RocketPy); same vehicle / motor / aero / recovery as scenarios/sounding-rocket/calisto/rocketpy-calisto.toml. Integrator: Dopri54Adaptive (Hairer-Nørsett-Wanner Vol I §II.5 Table 5.2 + Gustafsson 1991 PI controller, per-component HNW §II.4 RMS error norm). See provenance.md."

[time]
start_s = 0.0
stop_s  = 180.0
dt_s    = 0.001
seed    = 0x4361_6c69_7374_6f01

[vehicle]
kind                                = "rigid_body"
initial_position_eci_m              = [0.0, 0.0, 1400.0]
initial_velocity_eci_m_s            = [0.0, 0.0, 0.0]
initial_quaternion_body_to_eci_xyzw = [0.0, 0.043619387365336, 0.0, 0.9990482215818578]
initial_angular_velocity_body_rad_s = [0.0, 0.0, 0.0]

[vehicle.assembly]
id = "calisto-adaptive"

[[vehicle.assembly.bodies]]
id            = "main"
geometry      = { kind = "reference", length_m = 1.0, area_m2 = 0.012667686977437444 }
dry_mass_kg   = 14.426
dry_cg_body_m = [0.0, 0.0, 0.0]
dry_inertia_body_kg_m2 = [
  [6.321, 0.0,   0.0  ],
  [0.0,   6.321, 0.0  ],
  [0.0,   0.0,   0.034],
]

[[vehicle.assembly.recovery]]
id   = "calisto_chute"
kind = { kind = "drogue_main", drogue_c_d = 1.0, drogue_area_m2 = 1.0, main_c_d = 1.0, main_area_m2 = 10.0 }

[environment]
frame_profile = "toy-fixed-earth"
gravity       = "constant"
gravity_m_s2  = 9.80665
atmosphere    = "us_standard_1976"
wind          = "none"

[atmosphere]
kind = "us_standard_1976"

[aero]
deck         = "../../data/aero/calisto-drag.toml"
deck_sha256  = "e5411bb106529f5c6534627c87c7b7ea1df809355df642b38df9644530fcffb0"

[propulsion.motor]
file         = "../../data/motors/rocketpy-calisto-m1670.toml"
ignite_at_s  = 0.0
variant      = "solid"
file_sha256  = "2d111e4bbca80bdc0c3df2253cee85bcc44fb8bb5483ab60fced9cdb593659f1"

[solver]
profile = "adaptive-explicit"
trajectory_method = "dopri54"
determinism = "state-stable"

[solver.adaptive]
rtol = 1.0e-7
atol = 1.0e-9
min_dt_s = 1.0e-7
max_dt_s = 1.0e-3
dense_output = false

[telemetry]
output.parquet = "out/calisto-adaptive.parquet"

[validation]
require_finite_state   = true
require_monotonic_time = true

[mission]
initial_phase = "ascent"

[[mission.phases]]
id    = "ascent"
label = "ascent"

[[mission.phases]]
id    = "drogue_descent"
label = "drogue_descent"

[[mission.phases]]
id    = "main_descent"
label = "main_descent"

[[mission.events]]
id      = "evt_apogee_deploy_drogue"
trigger = { kind = "at_apogee" }
action = { kind = "emit_telemetry_marker", tag = "evt_apogee_deploy_drogue" }

[[scenario_script.events]]
id      = "evt_apogee_deploy_drogue"
trigger = { kind = "at_apogee" }
action  = { kind = "deploy_recovery", id = "calisto_chute", command = "deploy_drogue" }

[[mission.events]]
id      = "evt_altitude_deploy_main"
trigger = { kind = "at_altitude_descending", altitude_m = 1867.0 }
action = { kind = "emit_telemetry_marker", tag = "evt_altitude_deploy_main" }

[[scenario_script.events]]
id      = "evt_altitude_deploy_main"
trigger = { kind = "at_altitude_descending", altitude_m = 1867.0 }
action  = { kind = "deploy_recovery", id = "calisto_chute", command = "deploy_main" }

[[mission.transitions]]
from  = "ascent"
to    = "drogue_descent"
event = "evt_apogee_deploy_drogue"

[[mission.transitions]]
from  = "drogue_descent"
to    = "main_descent"
event = "evt_altitude_deploy_main"

[scenario_script]

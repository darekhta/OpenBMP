openbmp.feed_network_steady = 1

[meta]
dataset_id = "openbmp.feed_system.generic_steady_feed_network.v1"
source_class = "synthetic-openbmp"
source_title = "Synthetic steady feed-network mass-balance tolerance table"
provenance = "OpenBMP synthetic analytic fixture derived from incompressible valve flow, choked chamber throat flow, and the reduced two-valve node/branch mass-balance equations; not a real feed-network benchmark."
license_or_terms = "OpenBMP project synthetic data"
validation = "validated-toy"

[reduced_config]
tank_pressure_pa = 4.0e6
propellant_density_kg_m3 = 810.0

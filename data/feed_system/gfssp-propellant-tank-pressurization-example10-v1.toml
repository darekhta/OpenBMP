openbmp.feed_system_gfssp_pressurization_example10 = 1

[meta]
dataset_id = "openbmp.feed_system.gfssp_pressurization_example10.v1"
source_class = "public-nasa-gfssp-manual-digitized-worked-example"
source_title = "GFSSP Version 6 Example 10 pressurization of a propellant tank"
source_url = "https://www.nasa.gov/wp-content/uploads/2024/04/gfssp-v6-usermanual.pdf?emrc=67b605705809e"
source_hash_sha256 = "340f4b208a4814d776ef020df7167304dd74c09d641fb006d352b958cad4bc8c"
provenance = "Manual extraction from GFSSP Version 6 User's Manual section 6.10 plus plot digitization of Figure 136: five-node tank pressurization setup, run duration/time step, pressure/temperature/volume boundary values, tank-bottom and ullage pressure-history samples, and narrative trends from Figures 136 and 137."
license_or_terms = "NASA public technical manual"
validation = "research-digitized"

[conversion]
psi_to_pa = 6894.757293168
ft3_to_m3 = 0.028316846592
deg_f_to_k_offset = 255.37222222222223

[case]
run_duration_s = 200.0
time_step_s = 0.1
pressurant = "helium"
propellant = "oxygen"
pressurant_inlet_pressure_pa = 655001.94285096
pressurant_inlet_temperature_k = 322.0388888888889
initial_ullage_pressure_pa = 461948.738642256
initial_ullage_temperature_k = 108.70555555555552
initial_ullage_volume_m3 = 0.7079211648
initial_propellant_volume_m3 = 13.4505021312
engine_inlet_pressure_pa = 344737.8646584

[manual_inputs]
pressurant_inlet_pressure_psia = 95.0
pressurant_inlet_temperature_deg_f = 120.0
initial_ullage_pressure_psia = 67.0
initial_ullage_temperature_deg_f = -264.0
initial_ullage_volume_ft3 = 25.0
initial_propellant_volume_ft3 = 475.0
engine_inlet_pressure_psia = 50.0

[pressure_trend]
figure = "136"
ullage_initial_rise = true
ullage_slow_decline_after_initial_rise = true
tank_bottom_initially_above_ullage = true
tank_bottom_converges_toward_ullage = true
gravitational_head_decreases_as_propellant_drains = true

[temperature_trend]
figure = "137"
ullage_rise_first_60_s_deg_f = 192.0
ullage_declines_after_first_60_s = true
tank_wall_rise_over_run_deg_f = 32.0
tank_wall_warming_damped_by_propellant_heat_sink = true

[pressure_digitization]
figure = "136"
render_dpi = 300.0
pdf_page = 234
plot_x_min_s = 0.0
plot_x_max_s = 200.0
plot_y_min_psia = 60.0
plot_y_max_psia = 100.0
absolute_time_uncertainty_s = 1.0
absolute_pressure_uncertainty_psia = 0.75
absolute_pressure_uncertainty_pa = 5171.067969876
method = "Manual axis calibration from the 300 dpi rendered PDF page; sample points taken at visible time-grid locations from the tank-bottom and ullage curves. The t=0 row comes from the stated model initial condition, not from the nearly vertical startup transient in the plot."

[residual_gate]
absolute_pressure_tolerance_pa = 5171.067969876
absolute_time_tolerance_s = 1.0
expected_reference_max_abs_pressure_error_pa = 0.0
expected_reference_rms_pressure_error_pa = 0.0
expected_reference_within_tolerance = true

[reduced_model]
model = "startup_ramp_plus_power_law_ullage_and_hydrostatic_head"
validation = "research-calibrated"
fit_objective = "minimize the maximum absolute pressure-channel residual against the 300 dpi digitized Figure 136 pressure samples"

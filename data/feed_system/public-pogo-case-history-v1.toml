[[case]]
id = "gemini_titan_ii"
vehicle_family = "Gemini-Titan II"
stage = "Titan II first stage"
source_ids = ["nasa_sp_8055", "larsen_2008"]
observed_pogo = true
public_frequency_band_hz = [10.0, 13.0]
public_peak_acceleration_g = 2.5
mitigation = "fuel-line accumulators plus oxidizer standpipes/suppressors"
mitigation_outcome = "suppressed_to_human_flight_limit"
accumulator_trend = "raises_margin"
qualitative_benchmark = "correct fuel/oxidizer suppression reduced Titan II pogo below the Gemini human-flight limit; incomplete or wrong-side suppression could worsen coupled instability"
model_expectation = "adding appropriate accumulator compliance should detune the feedline resonance away from the structural mode and improve the stability verdict or sampled margin"

[[case]]
id = "apollo_saturn_v_sic"
vehicle_family = "Apollo Saturn V"
stage = "S-IC first stage"
source_ids = ["nasa_sp_8055", "larsen_2008"]
observed_pogo = true
public_frequency_band_hz = [5.0, 5.5]
public_peak_acceleration_g = 0.6
mitigation = "helium gas trapped in liquid-oxygen prevalves, converting cavities to low-inertance accumulators"
mitigation_outcome = "suppressed_on_corrected_subsequent_flights"
accumulator_trend = "raises_margin"
qualitative_benchmark = "Saturn V S-IC pogo occurred near the F-1/first-longitudinal-mode coincidence and was cleared after the LOX prevalve accumulator conversion"
model_expectation = "accumulator detuning should move the first feedline resonance away from the first significant structural mode and improve the stability verdict or sampled margin"

[[case]]

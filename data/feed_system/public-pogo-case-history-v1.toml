observed_pogo = true
public_frequency_band_hz = [17.0, 18.0]
public_peak_acceleration_g = 34.0
mitigation = "helium-bleed toroidal pogo suppressor on the oxidizer side of the center J-2 engine"
mitigation_outcome = "suppressed_after_apollo_13"
accumulator_trend = "raises_margin"
qualitative_benchmark = "Saturn V S-II center-engine pogo escalated on Apollo 13 and the oxidizer-side suppressor was installed for subsequent Apollo missions"
model_expectation = "adding the suppressor/accumulator compliance near the pump should reduce feedline/structural coincidence and improve the stability verdict or sampled margin"

openbmp.transient_feed_network = 1

[meta]
dataset_id = "openbmp.feed_system.generic_transient_chamber.v1"
source_class = "synthetic-openbmp"
source_title = "Synthetic transient chamber/feed-network tolerance table"
provenance = "OpenBMP synthetic analytic fixture derived from exact lumped chamber-pressure integration and start-of-step incompressible dual-valve feed flow; not a real feed-network benchmark."
license_or_terms = "OpenBMP project synthetic data"
validation = "validated-toy"

[chamber_config]
chamber_volume_m3 = 0.08
gas_temperature_k = 3400.0
gas_constant_j_per_kg_k = 360.0
throat_area_m2 = 1.2e-4
c_star_m_s = 1600.0

[network_config.oxidizer]
tank_pressure_pa = 4.0e6
propellant_density_kg_m3 = 810.0
valve_area_m2 = 8.0e-5
valve_discharge_coefficient = 0.72

[network_config.fuel]
tank_pressure_pa = 4.0e6
propellant_density_kg_m3 = 810.0
valve_area_m2 = 4.0e-5
valve_discharge_coefficient = 0.72

[tolerances]
absolute_pressure_pa = 1.0e-8
absolute_pressure_rate_pa_per_s = 1.0e-6
absolute_mass_flow_kg_per_s = 1.0e-12
absolute_mixture_ratio = 1.0e-12

[[chamber_case]]
name = "single_fluid_step"
initial_pressure_pa = 1.0e6
oxidizer_mass_flow_kg_per_s = 0.3
fuel_mass_flow_kg_per_s = 0.0
dt_s = 0.25
expected_chamber_pressure_pa = 1748183.3539996305
expected_pressure_rate_pa_per_s = 2992733.415998522
expected_inlet_mass_flow_kg_per_s = 0.3
expected_outlet_mass_flow_kg_per_s = 0.1311137515499723
expected_mixture_ratio = "none"
expected_validation = "validated-toy"


# Estes D12 solid motor — RASP `.eng`-derived (Schema 1).
#
# Time-thrust pairs transcribed from the canonical RASP `.eng` file
# at https://www.thrustcurve.org/motors/Estes/D12/ (contributed by
# John Coker, certified by NAR 1994-09-17). The (0, 0) starting
# point is prepended per the OpenBMP motor format requirement that
# `points[0].time = 0` exactly. The transcription is verbatim
# numerical except for that prepended ignition point.
#
# Header from the upstream `.eng` file:
#   D12 24 70 0-3-5-7 0.0211 0.0426 Estes
# Decoded:
#   - name:           D12
#   - diameter:       24 mm
#   - length:         70 mm
#   - delays:         0, 3, 5, 7 s
#   - propellant:     0.0211 kg
#   - total mass:     0.0426 kg
#   - manufacturer:   Estes
#
# The trapezoidal integral of the transcribed curve produces a
# total impulse of ~16.84 N·s; the published manufacturer spec is
# 16.8 N·s. The OpenBMP motor parser asserts the declared
# `total_impulse_n_s` matches the trapezoidal integral of the curve
# to 1e-9 relative, so the declared value below is the
# bit-exact f64 result of the integration (captured by the
# Phase-2.9.B regression test on first run; see
# `data/motors/provenance.md` for details).
#
# Specific-impulse consistency: declared `specific_impulse_s` is
# back-solved from `total_impulse = m_p · g_0 · Isp` for
# `g_0 = 9.80665 m/s²`. The motor parser asserts this consistency
# to 1e-3 relative.

openbmp.motor = 1

[meta]
name       = "estes-d12-eng-derived"
provenance = "ThrustCurve.org Estes D12 RASP .eng file (John Coker, NAR-certified 1994-09-17)"
validation = "checked"

[burn]
duration_s         = 1.65
total_impulse_n_s  = 16.8391395
specific_impulse_s = 81.3798273021187
propellant_mass_kg = 0.0211
dry_mass_kg        = 0.0215  # 0.0426 total − 0.0211 propellant

[thrust_curve]
# RASP-format (time_s, thrust_N) pairs. The (0.0, 0.0) entry is
# prepended to satisfy the OpenBMP motor format's `points[0].time
# = 0` invariant; the rest is verbatim from the upstream .eng file.
points = [
  [0.000, 0.000],
  [0.049, 2.569],
  [0.116, 9.369],
  [0.184, 17.275],
  [0.237, 24.258],
  [0.282, 29.730],
  [0.297, 27.010],
  [0.311, 22.589],
  [0.322, 17.990],
  [0.348, 14.126],
  [0.386, 12.099],
  [0.442, 10.808],
  [0.546, 9.876],
  [0.718, 9.306],
  [0.879, 9.105],
  [1.066, 8.901],
  [1.257, 8.698],
  [1.436, 8.310],
  [1.590, 8.294],
  [1.612, 4.613],
  [1.650, 0.000],
]

[geometry]
# 24 mm motor diameter; nozzle exit area approximated as the throat
# area (Estes D12 is a black-powder motor with a simple convergent
# nozzle, no separate exit cross-section published).
exit_area_m2                 = 0.0000314
ambient_pressure_correction  = "constant"

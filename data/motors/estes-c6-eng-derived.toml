  [0.370, 4.185834611700],
  [0.475, 3.783497734778],
  [0.671, 3.621882498805],
  [0.702, 3.863454746260],
  [0.723, 3.541925487324],
  [0.850, 3.783497734778],
  [1.063, 3.702690116792],
  [1.211, 3.702690116792],
  [1.242, 3.461117869337],
  [1.303, 3.621882498805],

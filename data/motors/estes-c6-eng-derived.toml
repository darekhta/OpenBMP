# Estes C6 solid motor — RASP `.eng`-derived (Schema 1).
#
# Time-thrust pairs derived from the canonical RASP `.eng` file at
# https://www.thrustcurve.org/simfiles/5f4294d20002e900000004e7/
# (contributed by John Coker, NAR-certified). The (0, 0) starting
# point is prepended per the OpenBMP motor format requirement that
# `points[0].time = 0` exactly. The shape of the curve is the
# upstream RASP profile; the magnitudes are scaled to the 7.5 N·s
# C6-family total impulse cited by Niskanen 2009 Chapter 6, which
# is the reference impulse the Niskanen Chapter-6 benchmark
# integrates against.
#
# Header from the upstream `.eng` file (decoded):
#   - name:           C6
#   - diameter:       18 mm
#   - length:         70 mm
#   - delays:         0, 3, 5, 7 s
#   - propellant:     0.0108 kg
#   - total mass:     0.0231 kg
#   - manufacturer:   Estes
#
# Specific-impulse consistency: declared `specific_impulse_s` is
# back-solved from `total_impulse = m_p · g_0 · Isp` for
# `g_0 = 9.80665 m/s²` so the Isp consistency check
# passes within 1e-3 relative.

openbmp.motor = 1

[meta]
name       = "estes-c6-eng-derived"
provenance = "ThrustCurve.org Estes C6 RASP .eng file (John Coker, NAR-certified), scaled to the 7.5 N·s C6-family impulse cited by Niskanen 2009 Chapter 6"
validation = "checked"

[burn]
duration_s         = 1.86
total_impulse_n_s  = 7.5
specific_impulse_s = 70.81362590124502
propellant_mass_kg = 0.0108
dry_mass_kg        = 0.0123  # 0.0231 total − 0.0108 propellant

[thrust_curve]
points = [
  [0.000, 0.000000000000],
  [0.031, 0.804673753844],

# Synthetic textbook solid motor (Schema 1).
#
# This is a clean trapezoidal-thrust unit-test fixture. The thrust
# curve has a 0.5 s ramp, 3 s flat top at 1000 N, and 0.5 s tail-off,
# so the trapezoidal integral is exactly 3500 N·s — matching the
# declared `total_impulse_n_s`. Use this as the canonical small-deck
# fixture for kernel-side integration tests.
#
# Closed-form trapezoidal integral:
#   I_total = 0.5·1000·0.5  +  1000·3.0  +  0.5·1000·0.5
#          =      250       +    3000    +      250       = 3500 N·s
#
# `specific_impulse_s` is the back-solved value for
# `total_impulse_n_s = m_p · g_0 · Isp` with `m_p = 1.0 kg` and
# `g_0 = 9.80665 m/s²`. Phase-2 mass integration still uses
# `dm/dt = -F(t) · m_p / I_total` directly; the Isp field is checked
# at load time as a consistency guard.

openbmp.motor = 1

[meta]
name       = "synthetic-solid-textbook"
provenance = "synthetic OpenBMP-authored textbook motor; 4 s burn, 3500 N·s total impulse"
validation = "validated-toy"

[burn]
duration_s         = 4.0
total_impulse_n_s  = 3500.0
specific_impulse_s = 356.9006745422749
propellant_mass_kg = 1.0
dry_mass_kg        = 0.5

[thrust_curve]
points = [
  [0.0, 0.0],
  [0.5, 1000.0],
  [3.5, 1000.0],
  [4.0, 0.0],
]

[geometry]
exit_area_m2                 = 0.0019
ambient_pressure_correction  = "constant"

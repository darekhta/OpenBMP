# Estes A8 solid motor — RASP `.eng`-derived (Schema 1).
#
# Time-thrust pairs from the canonical RASP `.eng` file at
# https://www.thrustcurve.org/simfiles/5f4294d20002e90000000897/
# (contributed by John Coker, NAR-certified). The (0, 0) starting
# point is prepended per the OpenBMP motor format requirement that
# `points[0].time = 0` exactly.
#
# Header from the upstream `.eng` file (decoded):
#   - name:           A8
#   - diameter:       18 mm
#   - length:         70 mm
#   - delays:         0 (only — single delay variant)
#   - propellant:     0.00384 kg
#   - total mass:     0.01389 kg
#   - manufacturer:   Estes (E)
#
# Total impulse note. The upstream RASP file documents in its header
# comment that the curve is a piecewise approximation limited to 32
# points by wRASP v1.6, and that the integral of the points "is as
# close to the certification curve as can be" within that point
# budget. Trapezoidal integration of the published points (with the
# OpenBMP-prepended (0, 0) starting point) yields 2.1503979999999996
# N·s in f64. The Estes manufacturer spec rounds the static-test
# total impulse to 2.5 N·s. OpenBMP declares the integrated value as
# the simulation truth (matching the D12 precedent) and documents
# the manufacturer-spec discrepancy in the provenance entry.
#
# Specific-impulse consistency: declared `specific_impulse_s` is
# back-solved from `total_impulse = m_p · g_0 · Isp` for
# `g_0 = 9.80665 m/s²` so the Phase-2.6 Isp consistency check
# passes within 1e-3 relative.

openbmp.motor = 1

[meta]
name       = "estes-a8-eng-derived"
provenance = "ThrustCurve.org Estes A8 RASP .eng file (John Coker, NAR-certified). Trapezoidal integral 2.1504 N·s; manufacturer spec rounds to 2.5 N·s — see provenance entry for discrepancy note."
validation = "checked"

[burn]
duration_s         = 0.534
total_impulse_n_s  = 2.1503979999999996
specific_impulse_s = 57.10405481654455
propellant_mass_kg = 0.00384
dry_mass_kg        = 0.01005  # 0.01389 total − 0.00384 propellant

[thrust_curve]
points = [
  [0.000, 0.000],
  [0.016, 1.080],
  [0.036, 0.293],
  [0.050, 0.259],
  [0.060, 0.357],
  [0.070, 0.419],
  [0.080, 0.355],
  [0.102, 0.781],
  [0.124, 1.443],
  [0.152, 2.966],
  [0.170, 4.426],
  [0.202, 7.160],
  [0.224, 9.051],
  [0.246, 9.555],
  [0.256, 9.317],
  [0.276, 7.958],
  [0.294, 6.108],
  [0.326, 4.235],
  [0.350, 3.813],
  [0.376, 3.997],
  [0.410, 3.926],
  [0.452, 3.724],
  [0.474, 4.046],
  [0.502, 4.092],
  [0.532, 4.146],
  [0.534, 0.000],
]

[geometry]
exit_area_m2                 = 0.0000159
ambient_pressure_correction  = "constant"

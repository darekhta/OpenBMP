# Estes B4 solid motor — RASP `.eng`-derived (Schema 1).
#
# Time-thrust pairs from the canonical RASP `.eng` file at
# https://www.thrustcurve.org/simfiles/5f4294d20002e90000000834/
# (contributed by Nicholas Domansky; ThrustCurve data source `user`;
# license tag `PD`). The (0, 0) starting point is prepended per the
# OpenBMP motor format requirement that `points[0].time = 0` exactly.
# The upstream file is named "B4-4", but the thrust profile is the B4
# burn; delay and ejection-charge behaviour are outside OpenBMP's
# Phase-2 motor model.
#
# Header from the upstream `.eng` file (decoded):
#   - name:           B4-4
#   - diameter:       18 mm
#   - length:         70 mm
#   - delays:         P (RASP header value; ignored by OpenBMP)
#   - propellant:     0.006 kg
#   - total mass:     0.0195 kg
#   - manufacturer:   Estes (E)
#
# Niskanen 2009 Chapter 6 cross-reference. The B4-4 motor is one of
# the two motors Niskanen Table 6.1 tabulates against experimental,
# OpenRocket, and RockSim apogees for the small-rocket benchmark.
# The published experimental B4 apogee is 64.0 m. This import can
# support a second cross-tool validation point alongside the existing
# C6 (151.5 m) once a B4 scenario is authored.
#
# Specific-impulse consistency: declared `specific_impulse_s` is
# back-solved from `total_impulse = m_p · g_0 · Isp` for
# `g_0 = 9.80665 m/s²` so the Phase-2.6 Isp consistency check
# passes within 1e-3 relative.

openbmp.motor = 1

[meta]
name       = "estes-b4-eng-derived"
provenance = "ThrustCurve.org Estes B4-4 RASP .eng file (Nicholas Domansky, user-contributed, PD license tag). Trapezoidal integral 5.0922 N·s vs. manufacturer-rounded 5.0 N·s spec; integrated value declared as simulation truth per the D12 precedent. Parser-checked only; no end-to-end B4 scenario yet."
validation = "checked"

[burn]
duration_s         = 1.049
total_impulse_n_s  = 5.092238500000001
specific_impulse_s = 86.54396931334008
propellant_mass_kg = 0.006
dry_mass_kg        = 0.0135  # 0.0195 total − 0.006 propellant

[thrust_curve]
points = [

# Synthetic VLM horseshoe derivative comparison fixture.
#
# This fixture pins OpenBMP's comparison-report schema for CL-alpha, Cm-alpha,
# hinge-alpha, control-lift, and control-hinge derivative rows. It is not AVL,
# wind-tunnel, NACA numeric, CFD, or flight validation data.

[openbmp]
vlm_horseshoe_derivative_comparison = 1

[provenance]
dataset_id = "openbmp.aero.vlm_horseshoe_derivative_comparison.v1"
source_class = "synthetic-openbmp"
validation_label = "checked"

[geometry]
root_chord_m = 0.30
tip_chord_m = 0.15
span_m = 0.20
sweep_deg = 20.0
root_le_x_m = 2.1
moment_reference_x_m = 1.25
reference_area_m2 = 0.031415926535897934
reference_length_m = 0.2
hinge_chord_fraction = 0.70

[lattice]
chordwise_panels = 2
spanwise_panels = 4
wake_length_m = 20.0

[tolerances]
abs_tolerance = 1.0e-12
rel_tolerance = 1.0e-12

[[samples]]
id = "mach-0p30-alpha-5deg"
mach = 0.3
alpha_deg = 5.0
control_deflection_deg = 0.0
alpha_step_deg = 0.25
control_step_deg = 0.25
expected_lift_curve_slope_per_rad = 2.474794037620649
expected_pitching_moment_slope_per_rad = -12.200563544167325
expected_hinge_moment_slope_per_rad = -0.0660881166576119
expected_control_lift_effectiveness_per_rad = 1.0031852861743418
expected_control_hinge_effectiveness_per_rad = -0.02678955307554877

# Synthetic Schema-2 aero deck — single elevon axis (Phase 3.5.B).
#
# 4-axis tabulated deck (mach × alpha × beta × delta_e_deg). The
# delta_e_deg axis encodes a body-flap pitch deflection in degrees;
# the deck values are constructed so non-zero deflection perturbs
# the normal-force coefficient `CN`. At delta_e_deg = 0 this deck is
# bit-equivalent to a Schema-1 deck with the same (mach, alpha, beta)
# slice — that property is exercised by the Phase 3.5.B parser
# tests.
#
# Generators (each evaluated on the cartesian product grid):
#   CN(M, α, β, δ_e) = α_deg · (0.07 + 0.005 · M) + 0.020 · δ_e_deg
#   CD(M, α, β, δ_e) = CD0(M) + 0.001 · α_deg² + 0.0005 · |δ_e_deg|
#   CM(M, α, β, δ_e) = -0.15 · CN(M, α, β, 0)  + 0.050 · δ_e_deg
# where CD0 is the Phase 2.5 finned-cylinder transonic curve.
#
# The shape parameters (1 m reference length, 0.05 m² reference
# area) match the Phase 3.4 single-elevon scenario airframe so the
# Phase 3.5.D exit-criterion run can swap this deck in without
# changing the scenario's geometry.

openbmp.aero_deck = 2

reference.area_m2  = 0.05
reference.length_m = 1.0
provenance         = "synthetic; OpenBMP-authored; Phase 3.5.B exit-criterion deck"
validation         = "validated-toy"

[grid]
mach        = [0.0, 0.3, 0.6, 1.0, 1.5, 2.0]
alpha_deg   = [-10.0, -5.0, 0.0, 5.0, 10.0]
beta_deg    = [0.0]
delta_e_deg = [-20.0, -10.0, 0.0, 10.0, 20.0]

[axis_order]
order = ["mach", "alpha", "beta", "delta_e_deg"]

[coefficients.cn]

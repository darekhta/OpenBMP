# Synthetic aero deck for the Phalcon-9 demonstration launch vehicle.
# WHOLLY SYNTHETIC, order-of-magnitude class figures for a ~3.7 m-diameter
# medium-lift launcher - NOT a fielded-vehicle deck and not validated
# against real drag/lift data. See data/aero/provenance.md.
#
# Full force + moment over an angle-of-attack grid (the rigid-body aero
# path applies cn as body normal force and cd as axial drag; the aero
# moment adapter applies cm as the body pitching moment, referenced to the
# 3.7 m body length). Synthetic linear-in-alpha model:
#   CN  = 2.50 * alpha_rad        (normal-force / lift slope)
#   CM  = -0.20 * alpha_rad        (pitching moment; <0 = mildly
#                                  statically STABLE / restoring)
#   CD  = CD0(Mach) + 0.50 * alpha_rad^2   (zero-lift polar + induced)
# Coefficients referenced to the body cross-section area pi*(3.7/2)^2.

openbmp.aero_deck = 1

reference.area_m2  = 10.752
reference.length_m = 3.7

provenance    = "synthetic OpenBMP-authored class-anchor aero deck for the Phalcon-9 demonstration launcher; linear-in-alpha CN/CM + CD0(Mach) polar with induced drag, rounded order-of-magnitude figures, not a fielded or validated deck"
validation    = "experimental"
extrapolation = "clamp"

[grid]
mach      = [0.0, 0.3, 0.8, 1.0, 1.2, 2.0, 3.0, 5.0, 8.0, 15.0, 25.0]
alpha_deg = [-10.0, -5.0, -2.0, 0.0, 2.0, 5.0, 10.0]
beta_deg  = [0.0]


# Public NASA SP-405 rectangular-wing lift-curve-slope fixture.
#
# Uses the Figure 5 rectangular-planform formula for lift-curve slope:
# CL_alpha = 2*pi*A / (A + 2.903 + 0.027/A). This is public NASA
# equation-level evidence, not AVL code-to-code or wind-tunnel validation.


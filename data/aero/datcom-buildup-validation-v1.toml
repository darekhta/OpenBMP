# Synthetic DATCOM-style buildup validation fixture.
#
# This is not public DATCOM/AGARD validation data. It is a checked
# OpenBMP-authored fixture that pins the validation harness, geometry
# parser, coefficient comparison path, and dynamic-derivative comparison
# path before public digitized NACA/AGARD rows are added.

openbmp.aero_datcom_validation = 1

reference_reynolds_at_mach1 = 4.0e6

[provenance]
dataset_id = "openbmp.aero.datcom_buildup_validation.v1"
source_class = "synthetic-openbmp"
validation_label = "checked"

[geometry]
body_diameter_m = 0.2
body_length_m = 2.4
surface_roughness_m = 6.0e-5
reference_area_m2 = 0.031415926535897934
reference_length_m = 0.2
center_of_gravity_from_nose_m = 1.25

[geometry.nose]
kind = "ogive"
fineness = 3.5

[geometry.afterbody]
exit_diameter_m = 0.14
length_m = 0.25

[geometry.fins]
count = 4
root_chord_m = 0.30
tip_chord_m = 0.12
span_m = 0.16
thickness_ratio = 0.06
sweep_deg = 29.79380534680281

[tolerances]
max_abs_error = 1.0e-12
max_relative_error = 1.0e-12


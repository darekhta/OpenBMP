# Calisto power-off / power-on drag-curve deck (Schema 1).
#
# Port of the RocketPy Calisto-example CD-vs-Mach
# table. RocketPy ships two files (`powerOffDragCurve.csv` and
# `powerOnDragCurve.csv`) that are byte-identical — Calisto is
# treated with a single CD curve regardless of motor burn state.
# OpenBMP ships one deck and a single CSV mirror at
# `data/aero/calisto-drag.csv` (SHA-256-pinned in
# `data/aero/provenance.md`).
#
# Reference area = π · (0.0635 m)² (Calisto body radius from the
# RocketPy Calisto example). Reference length = 1.0 m as a
# placeholder — Calisto is axisymmetric and the deck carries no
# moments, so the reference length is unused on the hot path.
#
# Grid: mach in {0.01, 0.02, …, 2.00} (200 points from the
# upstream CSV verbatim). Single-point α = [0.0] and β = [0.0]
# (axisymmetric reduced point-mass deck). CN and CM are
# identically zero. CD is the upstream curve verbatim.
#
# `extrapolation = "clamp"`: ascent peak Mach for Calisto is
# under M ≈ 1.5 (RocketPy's published apogee corresponds to a
# peak velocity around 280 m/s ≈ M 0.85), so the deck never gets
# evaluated above M = 2.0. Clamping the boundary keeps the
# adapter from raising `OutOfEnvelope` if the trajectory briefly
# exceeds the grid.

openbmp.aero_deck = 1

reference.area_m2  = 0.012667686977437444
reference.length_m = 1.0

provenance = "RocketPy Calisto-example CD-vs-Mach drag curve, byte-identical for power-off and power-on; axisymmetric reduced point-mass deck"
validation = "validated-toy"

extrapolation = "clamp"

[grid]

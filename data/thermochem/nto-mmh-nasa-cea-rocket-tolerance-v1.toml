openbmp.thermochem_reference = 1

[meta]
dataset_id = "openbmp.thermochem.nto_mmh_nasa_cea_rocket.v1"
source_class = "public-open-source-tool"
source_title = "NASA CEA 3.2.1 thermo.lib NTO/MMH rocket-equilibrium thermochemistry tolerance table"
